<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Platform">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="logo-64.png" type="image/png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141413">
<title>Platform</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap">
<style>
/* 1180×820(iPad 第10世代 横向き)の画面を作り、画面サイズに合わせて拡大縮小する */
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#141413;--ink:#ece8df;--sub:#8d8a83;--dim:#4a4844;--rule:#2b2a28;--card:#1b1b19;--track:#2f2e2b;--seg:#24231f;--segdone:#3a3833;
  --red:#ff5b3a;--blue:#6fa8dc;--yel:#e8c65a;--grn:#79c28a;--sl:#f5b301;--onpill:#141413;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --num:"Barlow Condensed","Helvetica Neue",Arial,sans-serif}
body.light{--bg:#eceeef;--ink:#16181b;--sub:#656a70;--dim:#a6abb0;--rule:#d3d7db;--card:#f7f8f9;--track:#d6dadd;--seg:#dde1e4;--segdone:#c7ccd1;
  --red:#e0431f;--blue:#2f78c4;--yel:#a87a05;--grn:#2f9a55;--sl:#c98a00;--onpill:#fff}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{-webkit-touch-callout:none;color:var(--ink);font-family:var(--jp);font-size:14px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
[hidden]{display:none!important}
#stage{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
/* 縦向き・スマホ(簡易表示) */
.pnote{display:none}
body.portrait{overflow:auto;height:auto}
body.portrait #stage{position:relative;width:auto;height:auto;overflow:visible;padding-top:env(safe-area-inset-top)}
body.portrait .bar{position:sticky;top:0;z-index:5;background:var(--bg);height:auto;min-height:52px;flex-wrap:wrap;padding:8px 12px;gap:6px}
body.portrait .bar .right{gap:8px}
body.portrait #chips{flex-wrap:wrap}
body.portrait .pnote{display:block;font-size:12px;color:var(--sub);padding:8px 16px;border-bottom:1px solid var(--rule)}
body.portrait .page{position:static;display:flex;flex-direction:column}
body.portrait .col{border-left:0!important;border-bottom:1px solid var(--rule)}
body.portrait #colC{order:1}body.portrait #colL{order:2}body.portrait #colR{order:3}
body.portrait .col>.tile.grow{flex:none}
body.portrait .tile{padding:16px}
body.portrait .clockt{padding:22px 12px}
body.portrait .pop{position:fixed;top:60px;width:calc(100% - 24px);left:12px;transform:none}
body.portrait .addp{position:fixed;width:calc(100% - 24px);left:12px;transform:none;max-height:80vh}
body.portrait .qb{position:fixed;height:auto;min-height:52px;flex-wrap:wrap;white-space:normal;padding:8px 12px;gap:6px 10px}
body.portrait #eew{position:fixed;display:block;overflow:auto}
body.portrait #eew .map{height:56vh}
body.portrait #eew canvas{width:100%!important;height:100%!important;object-fit:cover}
body.portrait #eew .p{border-left:0;border-top:4px solid #ff3b3b}
body.portrait #eew .row1{flex-wrap:wrap}
body.portrait #eew .hd{padding:10px 14px;gap:8px;align-items:center}body.portrait #eew .hd b{font-size:22px;white-space:nowrap}body.portrait #eew .hd span{font-size:13px;white-space:nowrap}body.portrait #eew .hd .x{white-space:nowrap}
body.portrait #eew .bd{padding:16px}body.portrait #eew .act div{font-size:20px}
body.portrait #eew .sh{font-size:100px;min-width:110px}
body.portrait #eew .cd .v{font-size:64px}

/* 上のバー */
.bar{position:absolute;left:0;right:0;top:0;height:52px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px;padding:0 16px}
.chip{display:flex;align-items:baseline;gap:7px;border:1px solid var(--rule);padding:5px 12px;font-size:13px;color:var(--sub);white-space:nowrap}
.chip b{font-family:var(--num);font-size:19px;color:var(--ink);font-weight:500}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--card)}
.chip .slc{color:var(--sl);font-weight:700}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--sub);white-space:nowrap}
.bar .right .warn{color:var(--red)}
.logo{display:flex;align-items:center;gap:8px;margin-right:8px;font-family:var(--num);font-size:21px;font-weight:600;letter-spacing:.03em}
.logo img{display:block;border-radius:7px}
.gear{border:1px solid var(--rule);padding:5px 12px;font-size:13px;color:var(--ink)}

.page{position:absolute;left:0;right:0;top:52px;bottom:0;display:grid;grid-template-columns:300px 1fr 300px}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.col+.col{border-left:1px solid var(--rule)}
.tile{padding:20px 24px;border-bottom:1px solid var(--rule);min-height:0;overflow:hidden}
.tile:last-child{border-bottom:0}
.grow{flex:1}
h3{font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:.12em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h3 span{font-weight:400;letter-spacing:0;font-size:12px;white-space:nowrap}
ul{list-style:none}

/* 時間割 */
.tt li{display:grid;grid-template-columns:18px 1fr auto;column-gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.tt li:last-child{border:0}
.tt .p{color:var(--sub);font-size:17px}.tt .s{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .rm{font-size:11px;color:var(--sub);margin-left:6px;font-weight:400}.tt .t{color:var(--sub);font-size:17px}
.tt li.past *{color:var(--dim)!important}
.tt li.now{border-bottom-color:var(--red)} .tt li.now .p,.tt li.now .t{color:var(--red)}
.tt li.now .s::after{content:"  いま";color:var(--red);font-size:11px;font-weight:700}
.empty{color:var(--sub);font-size:13px;line-height:1.7}

/* やること */
.todo li{display:grid;grid-template-columns:16px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);font-size:15px}
.todo li:last-child{border:0}
.box{width:15px;height:15px;border:1.5px solid var(--sub)}
.todo li.d{color:var(--dim);text-decoration:line-through}.todo li.d .box{background:var(--dim);border-color:var(--dim)}
.todo .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due{font-size:11.5px;color:var(--sub);white-space:nowrap} .due.h{color:var(--red)}
.kd{font-style:normal;font-size:10px;border:1px solid var(--yel);color:var(--yel);padding:0 3px;margin-right:7px;vertical-align:2px}
.add{font-size:16px;color:var(--sub);border:1px solid var(--rule);width:24px;height:24px;line-height:20px;text-align:center}

/* 時計 */
.clockt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 30px}
.date{font-size:16px;letter-spacing:.06em;color:var(--sub)} .date b{color:var(--ink);font-weight:500}
.clock{font-size:220px;font-weight:300;line-height:.88;letter-spacing:-2px;margin-top:10px;display:flex;align-items:flex-start;white-space:nowrap}
.clock .colon{color:var(--red);margin:0 2px;position:relative;top:-6px}
.clock .sec{font-size:44px;color:var(--sub);margin:18px 0 0 8px;font-weight:400;width:1.1em}
.next{margin-top:14px;font-size:16px;color:var(--sub);text-align:center} .next b{color:var(--ink)} .next .n{font-size:24px;color:var(--red);font-weight:500}
.pbar{width:100%;margin-top:18px;display:flex;height:22px;gap:2px}
.pbar div{flex:1;background:var(--seg);font-size:10.5px;color:var(--sub);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.pbar .done{background:var(--segdone)}
.pbar .cur{color:#fff}
.pbar .cur i{position:absolute;left:0;top:0;bottom:0;background:var(--red)}
.pbar .cur span{position:relative}
.pbar .brk{flex:.5;background:transparent;border-top:1px dashed var(--dim);height:1px;margin-top:11px}
.ticks{width:100%;display:flex;justify-content:space-between;margin-top:5px;color:var(--dim);font-size:12px}

/* 時計の下の枠 */
.col>.tile{flex:none}
.col>.tile.grow{flex:1 1 0;min-height:0}
.pop{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:620px;max-height:320px;background:var(--bg);border:1px solid var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.45);z-index:4;padding:18px 26px;display:flex;flex-direction:column}
.pop .back{font-size:11px;color:var(--dim);text-align:right;margin-top:auto;padding-top:6px}
.slhead{display:flex;align-items:baseline;gap:12px;min-width:0}
.pill{font-size:11.5px;font-weight:700;padding:1px 8px;background:var(--sl);color:var(--onpill);white-space:nowrap}
.pill.g{background:transparent;border:1px solid var(--sub);color:var(--sub);font-weight:500}
.slname{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slremain{margin-left:auto;font-size:15px;color:var(--sub);white-space:nowrap} .slremain .n{font-size:40px;color:var(--sl);font-weight:500;line-height:1}
.slsub{font-size:13px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.late{color:var(--red)} .okc{color:var(--grn)}
.route{position:relative;height:70px;margin:16px 8px 0}
.route .ln{position:absolute;left:0;right:0;top:12px;height:4px;background:var(--track)}
.route .ln i{position:absolute;left:0;top:0;bottom:0;background:var(--sl)}
.st{position:absolute;top:0;transform:translateX(-50%);text-align:center}
.st .dot{width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--dim);margin:7px auto 0}
.st.done .dot{border-color:var(--sl);background:var(--sl)}
.st.cur .dot{border-color:var(--sl);box-shadow:0 0 0 4px rgba(245,179,1,.25)}
.st.end .dot{width:18px;height:18px;border-radius:2px;margin-top:5px;border-color:var(--ink)}
.st .nm{font-size:12.5px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .tm{font-size:14px;color:var(--sub)}
.st.done .nm{color:var(--sub)} .st.cur .nm{color:var(--sl);font-weight:700}
.st.first{transform:none;text-align:left}.st.first .dot{margin-left:0}
.st.end{transform:translateX(-100%);text-align:right}.st.end .dot{margin-right:0}
.train{position:absolute;top:2px;width:26px;height:24px;transform:translateX(-50%);background:var(--sl);color:var(--onpill);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;clip-path:polygon(0 0,80% 0,100% 50%,80% 100%,0 100%)}
.slfoot{display:flex;gap:18px;margin-top:4px;font-size:12.5px;color:var(--sub);border-top:1px solid var(--rule);padding-top:8px}
.slfoot b{color:var(--ink);font-weight:500}

/* 記憶回路・語句のカード */
.card{border:1px solid var(--rule);background:var(--card);padding:14px 18px;display:flex;align-items:center;gap:22px;min-height:118px}
.ctag{font-size:10.5px;color:var(--yel);border:1px solid var(--yel);padding:0 6px;white-space:nowrap}
.cside{display:flex;flex-direction:column;gap:6px;align-items:flex-start;flex:none}
.cw{font-family:var(--num);font-size:46px;font-weight:500;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cw.jp{font-family:var(--jp);font-size:34px;font-weight:700}
.cans{min-width:0;flex:1}
.cans .a{font-size:20px;font-weight:700}
.cans .def{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5;max-height:3em;overflow:hidden}
.flip{margin-left:auto;font-size:12px;border:1px solid var(--dim);padding:3px 10px;color:var(--sub);white-space:nowrap}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.grade button{font-size:13px;border:1px solid var(--rule);padding:7px 0;color:var(--sub)}
.subj3{display:flex;gap:16px;font-size:12.5px;color:var(--sub);margin-bottom:10px}.subj3 b{color:var(--ink);font-size:17px;font-weight:500;margin-left:3px}
.term .tw{font-size:30px;font-weight:700;letter-spacing:.02em}
/* 語句のカード(めくる) */
.tnext{border:1px solid var(--rule);padding:2px 10px;font-size:12px;color:var(--ink)}
.termcard.fc{perspective:1200px;min-height:150px;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;min-height:inherit;transition:transform .5s;transform-style:preserve-3d}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;border:1px solid var(--rule);background:var(--card);padding:14px 18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.fc-front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.fc-front .tcat{position:absolute;left:14px;top:12px}.fc-front .flip{position:absolute;right:12px;bottom:10px}
.fc-front .tw{font-size:38px;font-weight:700;line-height:1.2}
.fc-back{transform:rotateY(180deg)}
.fc-back .tw2{font-size:22px;font-weight:700;margin-top:8px}.fc-back .tw2 .tr{font-size:13px;color:var(--sub);font-weight:400;margin-left:10px}
.fc-back .td2{font-size:14.5px;line-height:1.65;margin-top:6px}
.mini .termcard.fc{min-height:130px}.mini .fc-front .tw{font-size:26px}.mini .fc-back .tw2{font-size:17px}.mini .fc-back .td2{font-size:12.5px}
/* タイルの全画面 */
#full{position:absolute;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column}
#full[hidden]{display:none}
.fhead{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--rule)}
.fhead b{font-size:17px;margin-right:auto}.fhead .fhint{font-size:12px;color:var(--sub)}
.fbody{flex:1;min-height:0;display:flex;overflow:auto}
#full .tile{flex:1;border:0;zoom:1.6;padding:20px 28px;overflow:auto;display:flex;flex-direction:column}
#full .clockt{zoom:1;align-items:center;justify-content:center}
#full .clockt .date{font-size:26px}#full .clockt .next{font-size:24px}#full .clockt .next .n{font-size:36px}#full .clockt .pbar{height:34px}#full .clockt .pbar div{font-size:14px}
#full .termcard.fc{flex:1;min-height:220px}
#full .fc-front .tw{font-size:52px}#full .fc-back .tw2{font-size:28px}#full .fc-back .td2{font-size:18px}
body.portrait #full .tile{zoom:1.15}
/* 全画面の詳しい画面 */
.fv{flex:1;min-width:0;padding:14px 22px 18px;display:flex;flex-direction:column;font-size:16px;overflow:auto}
.fvbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:12px}
.fvbar>b{font-size:20px}.fvbar>button,.fvtabs button{border:1px solid var(--rule);padding:7px 14px;font-size:15px;color:var(--ink);min-width:44px}
.fvbar>button:disabled{opacity:.3}
.fvnote{font-size:12.5px;color:var(--sub)}.fvbar .fvnote{margin-left:auto}
.fvtabs{display:flex;gap:6px;flex-wrap:wrap}.fvtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.fvtabs.multi button.on{background:transparent;color:var(--ink);border-color:var(--yel);box-shadow:inset 0 0 0 1px var(--yel)}
.fvtabs.multi button{color:var(--sub)}.fvtabs small{font-size:11px;color:var(--sub)}
.fv h4{font-size:13px;color:var(--sub);letter-spacing:.1em;margin:14px 0 6px}
.calwrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr 340px;gap:18px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(0,1fr);grid-template-rows:auto;gap:3px;min-height:0}
.cw2{text-align:center;font-size:13px;color:var(--sub);padding:2px 0}.cw2.su,.cc.su .cn{color:var(--red)}.cw2.sa,.cc.sa .cn{color:var(--blue)}
.cc{border:1px solid var(--rule);text-align:left;padding:4px 6px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;align-items:stretch}
.cc .cn{font-size:18px}.cc.out{opacity:.35}.cc.past{opacity:.6}.cc.td{border-color:var(--red)}.cc.td .cn{color:var(--red);font-weight:700}
.cc.sel{background:var(--card);box-shadow:inset 0 0 0 2px var(--ink)}
.ch{font-size:10px;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ce{font-size:11px;border-left:3px solid var(--blue);padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm,.ct{font-size:10.5px;color:var(--sub)}.ct{color:var(--yel)}
.dp{border-left:1px solid var(--rule);padding-left:18px;overflow:auto;min-height:0}
.dph{font-size:24px;font-weight:700}.dph span{font-size:13px;color:var(--red);margin-left:8px}
.dpt{font-size:13px;color:var(--sub);margin-top:2px}.dpt.su{color:var(--red)}
.dpl li{display:grid;grid-template-columns:4px 92px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);font-size:15px}
.dpl li i{height:18px;background:var(--rule)}.dpl li .n{color:var(--sub);font-size:14px}.dpl li small{color:var(--sub)}
.dpl li.d{color:var(--dim);text-decoration:line-through}
.sgroups{columns:2;column-gap:28px}.sg{break-inside:avoid;margin-bottom:12px}
.sgh{display:flex;justify-content:space-between;width:100%;font-size:17px;font-weight:700;padding:6px 0;border-bottom:1px solid var(--ink);text-align:left}.sgh span{font-weight:400;font-size:13px;color:var(--sub)}.sgh.su{color:var(--red)}
.ttt{width:100%;border-collapse:collapse;font-size:20px}
.ttt th{font-size:12.5px;color:var(--sub);text-align:left;font-weight:400;padding:4px 10px;border-bottom:1px solid var(--rule)}
.ttt td{padding:11px 10px;border-bottom:1px solid var(--rule)}.ttt td.sj{font-weight:700}.ttt td.pno{color:var(--sub)}
.ttt tr.sub td{font-size:15px;color:var(--sub);padding:6px 10px}
.ttt tr.past td{color:var(--dim)}.ttt tr.now td{color:var(--red)}.ttt tr.now td.sj::after{content:"  いま";font-size:12px}
.wxbig{display:flex;gap:18px;align-items:center;margin-bottom:12px}.wxbig svg{width:80px;height:74px}
.wxbig .wt{font-size:24px;font-weight:700}.wxbig b{font-size:22px}.wsay{font-size:15px;margin-top:4px}
.hgrid{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;flex:1;min-height:200px}
.hc{display:flex;flex-direction:column;align-items:center;border-left:1px solid var(--rule);font-size:12px;min-width:0}
.hc.nowh{background:var(--card);box-shadow:inset 0 2px 0 var(--red)}.hc.pasth{opacity:.45}
.ht{font-size:17px;height:70px}.hw{font-size:10.5px;color:var(--sub);white-space:nowrap;overflow:hidden;max-width:100%}
.hp{flex:1;width:60%;display:flex;align-items:flex-end;min-height:50px;margin-top:6px}.hp i{display:block;width:100%;background:var(--blue);opacity:.7}
.hpn{font-size:12px;color:var(--blue)}.hh{font-size:14px;color:var(--sub);margin-top:2px}
.tdl li{display:grid;grid-template-columns:18px 70px 1fr auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--rule);font-size:19px;cursor:pointer}
.tdl .kd2{font-size:12px;color:var(--sub);border:1px solid var(--rule);text-align:center;padding:1px 0}
.tdl li.d{color:var(--dim);text-decoration:line-through}.tdl li.d .box{background:var(--dim);border-color:var(--dim)}
.tdl .due{font-size:14px}
.cdl{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}

<script>
'use strict';
const APP_VERSION = '1.8.0'; // 変えたら changelog.json の先頭も同じ番号にする

/* ================= 基本 ================= */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PREFIX = 'home:';
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(PREFIX + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) {} }
};
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const toMin = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : null; };
const fmtMin = m => `${Math.floor(m / 60)}:${pad(Math.round(m) % 60)}`;
const fmtDay = m => fmtMin(m > 1440 ? m - 1440 : m); // 24:00 はそのまま、それより後は 0:10 のように
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
const minOfDay = d => d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
const dayDiff = (a, b) => Math.round((new Date(b.getFullYear(), b.getMonth(), b.getDate()) - new Date(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
const hm = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60 ? pad(m % 60) + '分' : ''}` : `${m}分`; };

// ?at=2026-10-29T20:18 で時刻をずらして確認できる(進み続ける)
let timeOffset = 0;
{ const at = new URLSearchParams(location.search).get('at'); if (at) { const t = new Date(at).getTime(); if (!isNaN(t)) timeOffset = t - Date.now(); } }
const nowMs = () => Date.now() + timeOffset;
const now = () => new Date(nowMs());

/* ================= 設定 ================= */
const DEFAULT_CFG = {
  theme: 'dark', lightFrom: '06:30', darkFrom: '18:00', showSec: true,
  loc: null, // {lat, lon, pref, how}
  gasUrl: '',
  days: null, satWeeks: [1, 3, 5], // 曜日ごとの時刻(fixDays で初期値を入れる)。土曜は第何週に授業があるか
  tt: { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] }, // 曜日ごと [{s:教科, r:教室}]
  layout: null, bar: null, // タイルの置き場所(fixLayout で初期の配置を入れる)
  countdowns: [{ name: '共通テスト', date: '2027-01-16' }, { name: '', date: '' }],
  termCats: ['日本史', '古文単語', '化学', '物理', '現代文', '四字熟語'],
  qFull: 5, qBeep: 3, // 震度の段階(0〜9)。5 = 5弱。qFull 0 = 緊急地震速報はすべて全画面
  qiPref: 5, qiMax: 0, qiMag: 0, qiTsunami: true // 地震情報を全画面にする条件(0 = 使わない)
};
let cfg = Object.assign({}, DEFAULT_CFG, store.get('cfg') || {});
const saveCfg = () => store.set('cfg', cfg);
let todos = store.get('todos') || [];
const saveTodos = () => store.set('todos', todos);

/* ================= 祝日(2026〜2027) ================= */
const HOLIDAYS = {
  '2026-01-01': '元日', '2026-01-12': '成人の日', '2026-02-11': '建国記念の日', '2026-02-23': '天皇誕生日', '2026-03-20': '春分の日',
  '2026-04-29': '昭和の日', '2026-05-03': '憲法記念日', '2026-05-04': 'みどりの日', '2026-05-05': 'こどもの日', '2026-05-06': '振替休日',
  '2026-07-20': '海の日', '2026-08-11': '山の日', '2026-09-21': '敬老の日', '2026-09-22': '国民の休日', '2026-09-23': '秋分の日',
  '2026-10-12': 'スポーツの日', '2026-11-03': '文化の日', '2026-11-23': '勤労感謝の日',
  '2027-01-01': '元日', '2027-01-11': '成人の日', '2027-02-11': '建国記念の日', '2027-02-23': '天皇誕生日', '2027-03-21': '春分の日',
  '2027-03-22': '振替休日', '2027-04-29': '昭和の日', '2027-05-03': '憲法記念日', '2027-05-04': 'みどりの日', '2027-05-05': 'こどもの日',
  '2027-07-19': '海の日', '2027-08-11': '山の日', '2027-09-20': '敬老の日', '2027-09-23': '秋分の日', '2027-10-11': 'スポーツの日',
  '2027-11-03': '文化の日', '2027-11-23': '勤労感謝の日'
};
// 曜日ごとの1日の流れ:p = 時限 [はじまり, おわり]、pre = 朝(読書・HR など)、post = 帰り(掃除・HR など)
const WEEKDAY_DAY = { pre: [['読書', '8:35', '8:45'], ['HR', '8:45', '8:50']], p: [['8:55', '9:45'], ['9:55', '10:45'], ['10:55', '11:45'], ['11:55', '12:45'], ['13:25', '14:15'], ['14:25', '15:15']], post: ['掃除・HR', '15:15', '15:35'] };
const DEFAULT_DAYS = {
  1: WEEKDAY_DAY, 3: WEEKDAY_DAY, 4: WEEKDAY_DAY, 5: WEEKDAY_DAY,
  2: { pre: [['勤行・HR', '8:35', '9:00']], p: [['9:15', '10:05'], ['10:15', '11:05'], ['11:15', '12:05'], ['12:45', '13:35'], ['13:45', '14:35'], ['14:45', '15:35']], post: ['HR・掃除', '15:35', '15:55'] },
  6: { pre: [['読書', '9:00', '9:15']], p: [['9:20', '10:10'], ['10:20', '11:10']], post: ['HR', '11:10', '11:25'] }
};
const DEFAULT_TT = {
  1: ['論理・表現Ⅲ', '公民特講', '化学研究', 'リスニング', '物理|物理室', '英語コミュニケーションⅢ'],
  2: ['数学C', '国語特講Ⅱ', '地理総合', '物理|物理室', '総合的な探究', 'LHR'],
  3: ['化学研究', '国語特講Ⅱ', '数学Ⅲ|大教室', '物理|物理室', '数学B', '体育'],
  4: ['公民特講', '英語コミュニケーションⅢ', '物理|物理室', '数学Ⅲ|大教室', '英語コミュニケーションⅢ', '仏教'],
  5: ['論理・表現Ⅲ', '公民特講', '地理総合', '数学Ⅲ|大教室', 'リスニング', '体育'],
  6: ['英語コミュニケーションⅢ', '英語コミュニケーションⅢ']
};
function fixDays() {
  if (!cfg.days) cfg.days = JSON.parse(JSON.stringify(DEFAULT_DAYS));
  const empty = !Object.values(cfg.tt || {}).some(a => (a || []).some(x => x && x.s));
  if (empty) cfg.tt = Object.fromEntries(Object.entries(DEFAULT_TT).map(([d, a]) => [d, a.map(x => { const [sub, r] = x.split('|'); return { s: sub, r: r || '' }; })]));
}
fixDays();
const dayCfg = d => cfg.days[d.getDay()] || null;
const nthWeek = d => Math.ceil(d.getDate() / 7);
const isSchoolDay = d => {
  const w = d.getDay(), dc = cfg.days[w];
  if (!dc || !dc.p || !dc.p.length || HOLIDAYS[ymd(d)]) return false;
  return w === 6 ? (cfg.satWeeks || []).includes(nthWeek(d)) : w >= 1 && w <= 5;
};
const nextSchoolDay = d => { let x = addDays(d, 1); for (let i = 0; i < 30 && !isSchoolDay(x); i++) x = addDays(x, 1); return x; };

/* ================= 画面の大きさ ================= */
// ホーム画面から開いたときは上に iPad の時刻・電池の表示が重なるので、その分だけ下げる
// 横向き:1180×820 を基準に拡大縮小し、余った分は画面の形に合わせて広げる(すき間を作らない)
// 縦向き・幅の狭い画面(スマホ):縦1列の簡易表示(おすすめはしない)
function fit() {
  const top = $('sai').offsetHeight || 0, w = innerWidth, h = innerHeight - top;
  const portrait = w < h || w < 760;
  document.body.classList.toggle('portrait', portrait);
  const st = $('stage');
  if (portrait) { st.style.transform = ''; st.style.width = ''; st.style.height = ''; }
  else {
    const s = Math.min(w / 1180, h / 820);
    st.style.width = (w / s) + 'px'; st.style.height = (h / s) + 'px';
    st.style.transform = `translate(0px,${top}px) scale(${s})`;
  }
  if (typeof fitClock === 'function') requestAnimationFrame(fitClock);
}
addEventListener('resize', fit);

/* ================= テーマ ================= */
function applyTheme() {
  let light = cfg.theme === 'light';
  if (cfg.theme === 'auto') { const m = minOfDay(now()), a = toMin(cfg.lightFrom) ?? 390, b = toMin(cfg.darkFrom) ?? 1080; light = a < b ? m >= a && m < b : m >= a || m < b; }
  document.body.classList.toggle('light', light);
  document.querySelector('meta[name=theme-color]').content = light ? '#eceeef' : '#141413';
}

/* ================= 学校の1日 ================= */
const rng = (s, e) => [toMin(s), toMin(e)];
function periodsMin(d) { const dc = dayCfg(d); return dc ? dc.p.map(([s, e]) => rng(s, e)).filter(([s, e]) => s != null && e != null && e > s) : []; }
function preMin(d) { const dc = dayCfg(d); return dc && dc.pre ? dc.pre.map(([n, s, e]) => [n, ...rng(s, e)]).filter(x => x[1] != null && x[2] > x[1]) : []; }
function postMin(d) { const dc = dayCfg(d); if (!dc || !dc.post) return null; const [n, s, e] = dc.post; const r = rng(s, e); return r[0] != null && r[1] > r[0] ? [n || 'HR', ...r] : null; }
function schoolState(d) {
  const ps = periodsMin(d), pre = preMin(d), post = postMin(d), m = minOfDay(d);
  if (!isSchoolDay(d) || !ps.length) return { mode: 'off', ps, pre, post };
  const base = { ps, pre, post };
  const start = pre.length ? pre[0][1] : ps[0][0];
  if (m < start) return { ...base, mode: 'before', left: start - m, label: pre.length ? pre[0][0] : '1限' };
  for (const [n, s, e] of pre) if (m >= s && m < e) return { ...base, mode: 'pre', name: n, left: e - m };
  if (m < ps[0][0]) return { ...base, mode: 'break', next: 0, left: ps[0][0] - m };
  for (let i = 0; i < ps.length; i++) {
    if (m >= ps[i][0] && m < ps[i][1]) return { ...base, mode: 'class', i, left: ps[i][1] - m };
    if (i + 1 < ps.length && m >= ps[i][1] && m < ps[i + 1][0]) return { ...base, mode: 'break', next: i + 1, left: ps[i + 1][0] - m };
  }
  if (post && m < post[1]) return { ...base, mode: 'break', next: -1, left: post[1] - m };
  if (post && m < post[2]) return { ...base, mode: 'shr', name: post[0], left: post[2] - m };
  return { ...base, mode: 'after' };
}
const ttOf = d => (cfg.tt[d.getDay()] || []);
const subjOf = (d, i) => (ttOf(d)[i] || {}).s || '';
const roomOf = (d, i) => (ttOf(d)[i] || {}).r || '';
const dayLabel = (base, d) => { const k = dayDiff(base, d); return k === 0 ? '今日' : k === 1 ? '明日' : `${md(d)}(${WD[d.getDay()]})`; };

function renderClock() {
  const d = now();
  $('date').innerHTML = `<b>${d.getMonth() + 1}月${d.getDate()}日</b>　${WD[d.getDay()]}曜日${HOLIDAYS[ymd(d)] ? '　' + esc(HOLIDAYS[ymd(d)]) : ''}`;
  $('clock').innerHTML = `${d.getHours()}<span class="colon">:</span>${pad(d.getMinutes())}${cfg.showSec ? `<span class="sec">${pad(d.getSeconds())}</span>` : ''}`;
  const st = schoolState(d);
  let t = '';
  const sub = (dd, i) => { const s = subjOf(dd, i); return s ? `<b>${esc(s)}</b>${roomOf(dd, i) ? `(${esc(roomOf(dd, i))})` : ''}` : `<b>${i + 1}限</b>`; };
  const left = m => `<span class="n">${Math.ceil(m)}</span> 分`;
  const postName = st.post ? esc(st.post[0]) : '帰り';
  if (st.mode === 'before') t = `${esc(st.label)}まで ${left(st.left)}　／　1限は ${sub(d, 0)} <span class="n" style="color:var(--sub);font-size:20px">${fmtMin(st.ps[0][0])}</span>`;
  else if (st.mode === 'pre') t = `${esc(st.name)}　あと ${left(st.left)}　／　1限は ${sub(d, 0)} <span class="n" style="color:var(--sub);font-size:20px">${fmtMin(st.ps[0][0])}</span>`;
  else if (st.mode === 'class') t = `${st.i + 1}限 終わりまで ${left(st.left)}　／　次は ${st.i + 1 < st.ps.length ? sub(d, st.i + 1) : `<b>${postName}</b>`}`;
  else if (st.mode === 'break') t = st.next >= 0 ? `${st.next + 1}限まで ${left(st.left)}　／　${sub(d, st.next)}` : `${postName}まで ${left(st.left)}`;
  else if (st.mode === 'shr') t = `${postName}　あと ${left(st.left)}`;
  else {
    const nd = st.mode === 'after' ? nextSchoolDay(d) : (isSchoolDay(d) ? d : nextSchoolDay(d));
    const s0 = subjOf(nd, 0), p0 = periodsMin(nd)[0];
    t = `${st.mode === 'after' ? '今日の授業はおわり' : '今日はお休み'}　／　${dayLabel(d, nd)} 1限は ${s0 ? `<b>${esc(s0)}</b>` : '—'} ${p0 ? `<span class="n" style="color:var(--sub);font-size:20px">${fmtMin(p0[0])}</span>` : ''}`;
  }
  $('next').innerHTML = t;
  // 時限バー(授業がある日の昼間だけ)
  const show = st.mode !== 'off' && st.mode !== 'after';
  $('pbar').hidden = $('ticks').hidden = !show;
  if (show) {
    const ps = st.ps, m = minOfDay(d);
    const seg = (s, e, lab, flex) => m >= e ? `<div class="done" style="flex:${flex}">${lab}</div>` : m >= s ? `<div class="cur" style="flex:${flex}"><i style="width:${((m - s) / (e - s) * 100).toFixed(1)}%"></i><span>${lab}</span></div>` : `<div style="flex:${flex}">${lab}</div>`;
    let h = st.pre.length ? seg(st.pre[0][1], st.pre[st.pre.length - 1][2], '朝', .6) : '';
    ps.forEach(([s, e], i) => {
      if (i > 0 && s - ps[i - 1][1] >= 30) h += '<div class="brk"></div>';
      if (m >= e) h += `<div class="done">${i + 1}</div>`;
      else if (m >= s) h += `<div class="cur"><i style="width:${((m - s) / (e - s) * 100).toFixed(1)}%"></i><span>${i + 1}</span></div>`;
      else h += `<div>${i + 1}</div>`;
    });
    if (st.post) h += seg(st.post[1], st.post[2], 'HR', .6);
    $('pbar').innerHTML = h;
    const lunch = ps.findIndex((p, i) => i > 0 && p[0] - ps[i - 1][1] >= 30);
    const t0 = st.pre.length ? st.pre[0][1] : ps[0][0], t1 = st.post ? st.post[2] : ps[ps.length - 1][1];
    $('ticks').innerHTML = `<span class="n">${fmtMin(t0)}</span>${lunch > 0 ? `<span><span class="n">${fmtMin(ps[lunch - 1][1])}</span> 昼休み</span>` : ''}<span class="n">${fmtMin(t1)}</span>`;
  }
  return st;
}

/* ================= 時間割タイル ================= */
function renderTT(st) {
  if (editing) return; // 並べ替え中は中身を描き直さない(× ボタンが消えないように)
  const d = now();
  let day = d, title = '今日の時間割';
  if (st.mode === 'after' || st.mode === 'off') { day = st.mode === 'off' && isSchoolDay(d) ? d : nextSchoolDay(d); title = `${dayLabel(d, day) === '明日' ? '明日' : dayLabel(d, day)}の時間割`; }
  const ps = periodsMin(day), list = ttOf(day), m = minOfDay(d), today = day === d;
  let h = `<h3>${title} <span>${WD[day.getDay()]}曜</span></h3>`;
  if (!list.some(x => x && x.s)) h += `<p class="empty">時間割がまだありません。<br>右上の「設定」→「時間割」で入れてください。</p>`;
  else {
    h += '<ul>';
    ps.forEach(([s, e], i) => {
      const it = list[i] || {};
      const cls = today && st.mode !== 'off' ? (m >= e ? 'past' : m >= s ? 'now' : '') : '';
      h += `<li class="${cls}"><span class="p n">${i + 1}</span><span class="s">${esc(it.s || '—')}${it.r ? `<span class="rm">${esc(it.r)}</span>` : ''}</span><span class="t n">${fmtMin(s)}</span></li>`;
    });
    h += '</ul>';
  }
  $('ttTile').innerHTML = h;
}

/* ================= やること ================= */
function dueInfo(t) {
  if (!t.due) return { label: '', hot: false, ord: 9e9 };
  const d = parseYmd(t.due), k = dayDiff(now(), d);
  return { label: k < 0 ? '期限切れ' : k === 0 ? '今日' : k === 1 ? '明日' : md(d), hot: k <= 0 || (k === 1 && t.bring), ord: d.getTime() };
}
function cleanTodos() {
  const t0 = new Date(now().getFullYear(), now().getMonth(), now().getDate()).getTime();
  const before = todos.length;
  todos = todos.filter(t => !t.done || (t.doneAt || 0) >= t0);
  if (todos.length !== before) saveTodos();
}
function renderTodo() {
  if (editing) return; // 並べ替え中は中身を描き直さない(× ボタンが消えないように)
  cleanTodos();
  const list = [...todos].sort((a, b) => (a.done - b.done) || (dueInfo(a).ord - dueInfo(b).ord));
  const open = todos.filter(t => !t.done).length;
  let h = `<h3>やること <span>${open}件 <button class="add" id="todoAdd" aria-label="追加">+</button></span></h3>`;
  if (!list.length) h += '<p class="empty">課題や持ちものを「+」で追加できます。</p>';
  else h += '<ul>' + list.slice(0, 9).map(t => { const di = dueInfo(t); return `<li class="${t.done ? 'd' : ''}" data-id="${esc(t.id)}"><span class="box"></span><span class="tx">${t.bring ? '<em class="kd">持</em>' : ''}${esc(t.text)}</span><span class="due ${di.hot && !t.done ? 'h' : ''}">${t.done ? '済' : di.label}</span></li>`; }).join('') + '</ul>';
  $('todoTile').innerHTML = h;
}
$('todoTile').addEventListener('click', e => {
  if (e.target.closest('#todoAdd')) { openSettings('s-todo'); return; }
  const li = e.target.closest('li[data-id]');
  if (!li) return;
  const t = todos.find(x => x.id === li.dataset.id);
  if (!t) return;
  t.done = !t.done; t.doneAt = t.done ? nowMs() : null;
  saveTodos(); renderTodo();
});

/* ================= 天気(Open-Meteo) ================= */
const DEFAULT_LOC = { lat: 35.681, lon: 139.767, pref: '東京都', how: 'default' };
const loc = () => cfg.loc || DEFAULT_LOC;
let wx = store.get('wx'), wxFail = false; // 最後に取れた天気
const WCODE = c => c === 0 ? ['快晴', 'sun'] : c <= 2 ? ['晴れ', 'sunc'] : c === 3 ? ['くもり', 'cloud'] : c <= 48 ? ['霧', 'fog'] : c <= 67 ? ['雨', 'rain'] : c <= 77 ? ['雪', 'snow'] : c <= 82 ? ['にわか雨', 'rain'] : c <= 86 ? ['にわか雪', 'snow'] : ['雷雨', 'thunder'];
function wxIcon(kind, night) {
  const sun = night ? '<path d="M26 6a12 12 0 1 0 8 20 10 10 0 0 1-8-20z"/>' : '<circle cx="20" cy="17" r="8"/><path d="M20 3v3M20 28v3M6 17h3M34 17h-2M10 7l2 2M30 7l-2 2M10 27l2-2"/>';
  const cloud = '<path d="M24 40h20a7 7 0 0 0-1-14 10 10 0 0 0-19 3 6 6 0 0 0 0 11z" style="fill:var(--bg)"/>';
  const cloudBig = '<path d="M12 36h30a8 8 0 0 0-1-16 12 12 0 0 0-23 4 6 6 0 0 0-6 12z" style="fill:var(--bg)"/>';
  const inner = { sun, sunc: sun + cloud, cloud: cloudBig, fog: cloudBig + '<path d="M8 42h36M12 46h28"/>', rain: cloudBig + '<path d="M18 40l-3 6M28 40l-3 6M38 40l-3 6" style="stroke:var(--blue)"/>', snow: cloudBig + '<path d="M18 42h.1M28 44h.1M38 42h.1" stroke-width="4" stroke-linecap="round"/>', thunder: cloudBig + '<path d="M28 36l-5 8h6l-4 7" style="stroke:var(--yel)"/>' }[kind] || cloudBig;
  return `<svg width="54" height="50" viewBox="0 0 54 52" fill="none" stroke-width="1.8" style="stroke:var(--ink)">${inner}</svg>`;
}
async function loadWeather() {
  const L = loc();
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${L.lat}&longitude=${L.lon}&current=temperature_2m,weather_code,is_day&hourly=temperature_2m,precipitation_probability,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=3`;
    const r = await fetch(u, { cache: 'no-store' });
    const j = await r.json();
    if (!j.current) throw new Error(j.reason || 'no data');
    wx = { at: Date.now(), cur: j.current, hourly: j.hourly, daily: j.daily, pref: L.pref };
    store.set('wx', wx);
  } catch (e) { if (wx) wx.err = true; else wxFail = true; }
  renderWeather();
}
function renderWeather() {

}

/* ================= 受験の語句 ================= */
let terms = [], termCur = null, termAt = 0, termShown = false;
// 前に無かった科目(情報・数学・英単語など)が増えたら、最初は表示する科目に入れておく
const TERM_CATS_V1 = ['日本史', '古文単語', '化学', '物理', '現代文', '四字熟語'];
fetch('terms.json', { cache: 'no-store' }).then(r => r.json()).then(j => {
  terms = j;
  const cats = [...new Set(terms.map(t => t.cat))], known = Array.isArray(cfg.termKnown) ? cfg.termKnown : TERM_CATS_V1;
  const fresh = cats.filter(c => !known.includes(c));
  if (fresh.length || !Array.isArray(cfg.termKnown)) { cfg.termCats = [...new Set([...cfg.termCats, ...fresh])]; cfg.termKnown = cats; saveCfg(); }

// 直前と同じ語句が続かないように選ぶ

}

/* ================= カウントダウン・次の休み・カレンダー ================= */
function cdList() { return cfg.countdowns.filter(c => c.name && c.date).map(c => ({ ...c, days: dayDiff(now(), parseYmd(c.date)) })).filter(c => c.days >= 0); }
function renderCount() {
  const l = cdList();
  if (!l.length) return '<h3>カウントダウン</h3><p class="empty">設定で日付を入れてください。</p>';
  return `<h3>カウントダウン</h3><div class="big2">${l.slice(0, 2).map(c => `<div><div class="k">${esc(c.name)}まで</div><div class="v n">${c.days}<small>日</small></div><div class="d">${md(parseYmd(c.date))}(${WD[parseYmd(c.date).getDay()]}) ・ 残り${Math.floor(c.days / 7)}週</div></div>`).join('')}</div>`;
}
function nextOff() {
  const d = now(); let x = d, i = 0;
  if (!isSchoolDay(d)) return { today: true, from: d, len: offLen(d) };
  while (isSchoolDay(x) && i < 60) { x = addDays(x, 1); i++; }
  return { days: dayDiff(d, x), from: x, len: offLen(x) };
}
function offLen(d) { let n = 0, x = d; while (!isSchoolDay(x) && n < 30) { x = addDays(x, 1); n++; } return n; }
function renderHoliday() {
  const o = nextOff(), d = now(), y0 = new Date(d.getFullYear(), 0, 1), y1 = new Date(d.getFullYear() + 1, 0, 1);
  const frac = (nowMs() - y0) / (y1 - y0), left = dayDiff(d, y1) - 1;
  const hol = [...Array(o.len)].map((_, i) => HOLIDAYS[ymd(addDays(o.from, i))]).filter(Boolean);
  let dots = ''; const fw = Math.floor(frac * 52); for (let i = 0; i < 52; i++) dots += `<i class="${i < fw ? 'f' : i === fw ? 'c' : ''}"></i>`;
  return `<h3>次の休み <span>土日・祝日</span></h3><div class="big2">
    <div><div class="k">${o.today ? '今日はお休み' : '次の休みまで'}</div><div class="v n">${o.today ? o.len : o.days}<small>${o.today ? '連休' : '日後'}</small></div><div class="d">${md(o.from)}(${WD[o.from.getDay()]})から ${o.len}連休${hol.length ? ' ・ ' + esc(hol.join('・')) : ''}</div></div>
    <div><div class="k">${d.getFullYear()}年の残り</div><div class="v n">${left}<small>日</small></div><div class="d">${(frac * 100).toFixed(1)}% 経過</div></div></div><div class="dots">${dots}</div>`;
}
function renderCalendar() {
  const d = now(), mon = addDays(d, -((d.getDay() + 6) % 7));
  const evDays = new Set(upcoming().map(e => ymd(new Date(e.start))));
  let h = `<h3>カレンダー <span>${d.getMonth() + 1}月 –</span></h3><div class="cal">` + ['月', '火', '水', '木', '金', '土', '日'].map((w, i) => `<span class="w ${i === 6 ? 'su' : ''}">${w}</span>`).join('');
  for (let i = 0; i < 28; i++) {
    const x = addDays(mon, i), k = ymd(x);
    const cls = [x < new Date(d.getFullYear(), d.getMonth(), d.getDate()) ? 'o' : '', (x.getDay() === 0 || HOLIDAYS[k]) ? 'su' : '', k === ymd(d) ? 'td' : '', evDays.has(k) ? 'ev' : ''].join(' ');
    h += `<span class="${cls}">${x.getDate()}</span>`;

  return h + '</div>';
}

const tabs = (fa, items, cur) => `<div class="fvtabs">${items.map(([v, l]) => `<button data-fa="${fa}" data-v="${esc(v)}" class="${String(v) === String(cur) ? 'on' : ''}">${l}</button>`).join('')}</div>`;

const todosOn = d => todos.filter(t => t.due === ymd(d));

// 予定: この先の予定を日ごとに全部。日付を押すとカレンダーでその日を開く

let demoTimers = [];
function demoEEW(kind) { // 'strong' / 'weak' / 'far'(遠くの地震。「すべて全画面」のときの見え方)
  demoTimers.forEach(clearTimeout); demoTimers = [];
  const L = loc(), o = nowMs() - timeOffset - 3000;
  const ts = ms => { const d = new Date(ms + 9 * 3600e3); return d.toISOString().slice(0, 19).replace('T', ' ').replace(/-/g, '/'); };
  const off = { strong: [.38, .32], weak: [1.6, 1.4], far: [4.5, 3.5] }[kind] || [1.6, 1.4];
  const lat = +(L.lat + off[0]).toFixed(1), lon = +(L.lon + off[1]).toFixed(1);
  const full = Math.max(5, cfg.qFull), beep = 2; // 強い揺れのデモは5弱以上、弱い揺れのデモは震度2
  const steps = kind === 'strong'
    ? [[0, 5.6, '4', false, false, full - 1], [1500, 6.3, '5弱', true, false, full], [4000, 6.6, '5強', true, false, full], [9000, 6.6, '5強', true, true, full]]
    : kind === 'far' ? [[0, 5.2, '4', false, false, 0], [3000, 5.5, '4', false, true, 0]]
      : [[0, 4.6, '3', false, false, beep], [3000, 4.8, '3', false, true, beep]];
  steps.forEach(([at, M, mx, warn, fin, lc], i) => demoTimers.push(setTimeout(() => handleEEW({ _local: lc,
    Title: warn ? '緊急地震速報(警報)' : '緊急地震速報(予報)', EventID: 'DEMO' + o, Serial: i + 1, OriginTime: ts(o), Hypocenter: 'デモ震源', Latitude: lat, Longitude: lon,
    Magnitude: M, Depth: kind === 'strong' ? 40 : 30, MaxIntensity: mx, WarnArea: [], isWarn: warn, isFinal: !!fin, isCancel: false, isTraining: false
  }, true), at)));
}
function demoInfo(full) {
  const L = loc(), t = new Date(nowMs() - timeOffset - 60e3 + 9 * 3600e3).toISOString().slice(0, 19).replace('T', ' ').replace(/-/g, '/');
  // 現在地の県とその周りの県に震度を入れる
  const near = (JAPAN || []).map(p => ({ p, d: (p.c[0] - L.lon) ** 2 + (p.c[1] - L.lat) ** 2 })).sort((a, b) => a.d - b.d).slice(0, 9);
  const sc = [50, 45, 45, 40, 40, 40, 30, 30, 20];
  const points = near.length ? near.map((x, i) => ({ pref: x.p.name, scale: sc[i] })) : [{ pref: L.pref, scale: 45 }];
  showQuakeInfo({ id: 'demo' + Date.now(), earthquake: { time: t, hypocenter: { name: 'デモ震源', magnitude: 6.6, depth: 40, latitude: +(L.lat + .38).toFixed(1), longitude: +(L.lon + .32).toFixed(1) }, maxScale: 50, domesticTsunami: 'None' }, points }, true, !!full);
}

    <p class="note">緊急地震速報は Wolfx、地震情報は P2P地震情報 から受け取ります。どちらも気象庁の発表を中継する無料のサービスで、数秒遅れることがあります。<b>公式の警報の代わりにはなりません。</b>学校の放送や先生の指示を優先してください。<br>現在地の予想震度は、震源・規模・距離からの推定です(気象庁の地域ごとの予想とずれることがあります)。<br>音は、ページを開いたあと画面を一度タップすると鳴らせるようになります。</p>
  </section>

  <section id="s-terms"><h2>受験の語句</h2>
    <div class="row">${[...new Set(terms.map(t => t.cat))].map(c => `<label><input type="checkbox" data-tcat="${esc(c)}" ${cfg.termCats.includes(c) ? 'checked' : ''}>${esc(c)}</label>`).join('')}</div>
  </section>

  <section id="s-about"><h2>このアプリ</h2>
    <p><b>Platform</b> v${APP_VERSION}</p>
    ${changelog.slice(0, 5).map(e => `<p class="note"><b>v${esc(e.version)}</b> ${esc(e.date)}</p><ul class="l note">${(e.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>`).join('')}
    <p class="note" style="margin-top:10px">天気:Open-Meteo / 緊急地震速報:Wolfx / 地震情報:P2P地震情報(どちらも気象庁の発表をもとにしたもの)/ 地図:dataofjapan/land(地球地図日本 ©国土地理院)を簡略化 / 震度の色:気象庁の配色</p>
    <p class="note">StudyLine と記憶回路のデータは、同じ iPad・同じ開き方(どちらも Safari、またはどちらもホーム画面)で使っているときに読めます。</p>
  </section>
  </div>`;
}
const pad5 = s => { const m = toMin(s); return m == null ? '' : `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
const unpad = s => { const m = toMin(s); return m == null ? '' : `${Math.floor(m / 60)}:${pad(m % 60)}`; };
$('settings').addEventListener('click', e => {
  const t = e.target, rs = () => { saveCfg(); renderSettings(); };
  if (t.id === 'sDone') return closeSettings();
  if (t.id === 'editStart') { closeSettings(); enterEdit(); return; }
  if (t.id === 'layoutReset') { cfg.layout = null; fixLayout(); saveCfg(); renderLayout(); renderAll(); t.textContent = '戻しました'; return; }
  if (t.dataset.ttday) { ttDay = +t.dataset.ttday; return renderSettings(); }
  if (t.id === 'pAdd') { const P = cfg.days[ttDay].p, last = P[P.length - 1], e0 = last ? toMin(last[1]) + 10 : 530; P.push([fmtMin(e0), fmtMin(e0 + 50)]); return rs(); }
  if (t.id === 'pDel') { cfg.days[ttDay].p.pop(); return rs(); }
  if (t.id === 'preAdd') { (cfg.days[ttDay].pre = cfg.days[ttDay].pre || []).push(['', '', '']); return rs(); }
  if (t.dataset.predel != null) { cfg.days[ttDay].pre.splice(+t.dataset.predel, 1); return rs(); }
  if (t.id === 'tdAdd') {
    const text = $('tdText').value.trim(); if (!text) return;
    todos.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: text.slice(0, 40), bring: $('tdBring').checked, due: $('tdDue').value || '', done: false });
    saveTodos(); renderSettings(); setTimeout(() => $('tdText').focus(), 0); return;
  }
  if (t.dataset.tddel) { todos = todos.filter(x => x.id !== t.dataset.tddel); saveTodos(); return renderSettings(); }
  if (t.id === 'useGps') {
    $('gpsMsg').textContent = '位置を取得中…';
    if (!navigator.geolocation) { $('gpsMsg').textContent = 'この端末では位置情報を使えません。都道府県を選んでください。'; return; }
    navigator.geolocation.getCurrentPosition(p => {
      const lat = +p.coords.latitude.toFixed(3), lon = +p.coords.longitude.toFixed(3);
      cfg.loc = { lat, lon, pref: prefAt(lat, lon) || '', how: 'gps' }; saveCfg(); loadWeather(); renderSettings();
    }, err => { $('gpsMsg').textContent = '位置を取れませんでした(' + (err.code === 1 ? '許可されていません' : '取得できません') + ')。都道府県を選んでください。'; }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 600000 });
    return;
  }
  if (t.id === 'gasTest') { cfg.gasUrl = $('gasUrl').value.trim(); saveCfg(); $('gasMsg').textContent = '読み込み中…'; loadEvents().then(() => { $('gasMsg').innerHTML = eventsErr ? `<span class="ng">読めませんでした:${esc(eventsErr)}</span>` : `<span class="ok">${events ? events.length : 0}件 読み込みました</span>`; }); return; }
  if (t.id === 'gasCopy') { navigator.clipboard?.writeText(GAS_CODE).then(() => { t.textContent = 'コピーしました'; }, () => { const r = document.createRange(); r.selectNodeContents($('gasCode')); getSelection().removeAllRanges(); getSelection().addRange(r); }); return; }
  if (t.dataset.demo) { const k = t.dataset.demo; try { unlockAudio(); } catch (err) {} closeSettings(); toast(`地震のデモを始めます(${t.textContent})`); setTimeout(() => k === 'info' || k === 'infofull' ? demoInfo(k === 'infofull') : demoEEW(k), 300); return; }
  if (t.id === 'soundTest') { unlockAudio(); setTimeout(soundAlarm, 100); return; }
});
$('settings').addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'theme') cfg.theme = t.value;
  else if (t.id === 'lightFrom') cfg.lightFrom = t.value;
  else if (t.id === 'darkFrom') cfg.darkFrom = t.value;
  else if (t.id === 'showSec') cfg.showSec = t.checked;
  else if (t.dataset.tts != null || t.dataset.ttr != null) {
    const i = +(t.dataset.tts ?? t.dataset.ttr), arr = cfg.tt[ttDay] = cfg.tt[ttDay] || [];
    arr[i] = Object.assign({ s: '', r: '' }, arr[i]); arr[i][t.dataset.tts != null ? 's' : 'r'] = t.value.trim().slice(0, 20);
  }
  else if (t.dataset.ps != null) cfg.days[ttDay].p[+t.dataset.ps][0] = unpad(t.value);
  else if (t.dataset.pe != null) cfg.days[ttDay].p[+t.dataset.pe][1] = unpad(t.value);
  else if (t.dataset.pren != null) cfg.days[ttDay].pre[+t.dataset.pren][0] = t.value.trim().slice(0, 12);
  else if (t.dataset.pres != null) cfg.days[ttDay].pre[+t.dataset.pres][1] = unpad(t.value);
  else if (t.dataset.pree != null) cfg.days[ttDay].pre[+t.dataset.pree][2] = unpad(t.value);
  else if (t.id === 'postN' || t.id === 'postS' || t.id === 'postE') { const P = cfg.days[ttDay].post = cfg.days[ttDay].post || ['', '', '']; if (t.id === 'postN') P[0] = t.value.trim().slice(0, 12); else P[t.id === 'postS' ? 1 : 2] = unpad(t.value); }
  else if (t.dataset.satw) { const n = +t.dataset.satw; cfg.satWeeks = t.checked ? [...new Set([...(cfg.satWeeks || []), n])].sort() : (cfg.satWeeks || []).filter(x => x !== n); }
  else if (t.dataset.cdn != null) cfg.countdowns[+t.dataset.cdn].name = t.value.trim().slice(0, 12);
  else if (t.dataset.cdd != null) cfg.countdowns[+t.dataset.cdd].date = t.value;
  else if (t.id === 'prefSel' && t.value) { const p = JAPAN.find(x => x.name === t.value); cfg.loc = { lat: +p.c[1].toFixed(3), lon: +p.c[0].toFixed(3), pref: p.name, how: 'pref' }; saveCfg(); loadWeather(); renderSettings(); return; }
  else if (t.id === 'qFull') cfg.qFull = +t.value;
  else if (t.id === 'qiPref') cfg.qiPref = +t.value;
  else if (t.id === 'qiMax') cfg.qiMax = +t.value;
  else if (t.id === 'qiMag') cfg.qiMag = +t.value;
  else if (t.id === 'qiTsunami') cfg.qiTsunami = t.checked;
  else if (t.id === 'qBeep') cfg.qBeep = +t.value;
  else if (t.dataset.tcat) { const c = t.dataset.tcat; cfg.termCats = t.checked ? [...new Set([...cfg.termCats, c])] : cfg.termCats.filter(x => x !== c); termCur = null; }
  else return;
  saveCfg(); applyTheme();
});

/* ================= 動かす ================= */
// 思わぬエラーが起きたら画面の下に出す(原因を伝えてもらえるように)
addEventListener('error', e => toast(`エラー: ${e.message || e} (${(e.filename || '').split('/').pop()}:${e.lineno || '?'}) v${APP_VERSION}`));
addEventListener('unhandledrejection', e => { const m = String(e.reason && e.reason.message || e.reason || ''); if (!/fetch|network|Load failed|abort/i.test(m)) toast(`エラー: ${m} v${APP_VERSION}`); });
let lastMin = -1;
function tick(force) {
  const d = now();
  if (eew && $('eew').hidden === false) { /* 地震の全画面は eewTick が描く */ }
  const st = renderClock();
  if (force || d.getMinutes() !== lastMin) {
    lastMin = d.getMinutes();
    applyTheme(); renderTT(st); renderTodo(); renderSched(); renderChips();
    if (slotMode && nowMs() - slotTouched > 60e3) closeSlot();
    if ((fullTile || fullK) && fullKey() !== 'clock' && nowMs() - fullTouched > 180e3) closeFull(); // 時計以外は3分さわらなければ戻る
    else if (fullK && fullK !== 'terms') renderFullView();
    if (!kioku.shown && !editing) { renderSlot(); renderTiles(); requestAnimationFrame(fitClock); }
    if (d.getMinutes() % 30 === 0) loadWeather();
    if (d.getMinutes() % 10 === 5) loadEvents();
    if (d.getMinutes() % 2 === 0) renderWeather();
  }
}
function loop() { tick(false); setTimeout(loop, 1000 - (Date.now() % 1000) + 5); }
setInterval(eewTick, 250);
setInterval(pollQuake, 60e3);

fit(); applyTheme(); renderStatus();
renderLayout(); renderAll();
loadWeather(); loadEvents(); loadVocab(); pollQuake(); checkVersion(); requestWake();
connectEEW();
loop();
// 地震のデモを URL で始められる(確認用): ?demo=strong / weak / far / info / infofull
{ const dm = new URLSearchParams(location.search).get('demo'); if (dm) setTimeout(() => dm === 'info' || dm === 'infofull' ? demoInfo(dm === 'infofull') : demoEEW(dm), 1500); }
</script>
