<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Platform">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="logo-64.png" type="image/png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141413">
<title>Platform</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap">
<style>
/* 1180×820(iPad 第10世代 横向き)の画面を作り、画面サイズに合わせて拡大縮小する */
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#141413;--ink:#ece8df;--sub:#8d8a83;--dim:#4a4844;--rule:#2b2a28;--card:#1b1b19;--track:#2f2e2b;--seg:#24231f;--segdone:#3a3833;
  --red:#ff5b3a;--blue:#6fa8dc;--yel:#e8c65a;--grn:#79c28a;--sl:#f5b301;--onpill:#141413;--lunchbg:#2a2617;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --num:"Barlow Condensed","Helvetica Neue",Arial,sans-serif}
body.light{--bg:#eceeef;--ink:#16181b;--sub:#656a70;--dim:#a6abb0;--rule:#d3d7db;--card:#f7f8f9;--track:#d6dadd;--seg:#dde1e4;--segdone:#c7ccd1;
  --red:#e0431f;--blue:#2f78c4;--yel:#a87a05;--grn:#2f9a55;--sl:#c98a00;--onpill:#fff;--lunchbg:#f0e6c4}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{-webkit-touch-callout:none;color:var(--ink);font-family:var(--jp);font-size:14px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
[hidden]{display:none!important}
#stage{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
/* 縦向き・スマホ(簡易表示) */
.pnote{display:none}
body.portrait{overflow:auto;height:auto}
body.portrait #stage{position:relative;width:auto;height:auto;overflow:visible;padding-top:env(safe-area-inset-top)}
body.portrait .bar{position:sticky;top:0;z-index:5;background:var(--bg);height:auto;min-height:52px;flex-wrap:wrap;padding:8px 12px;gap:6px}
body.portrait .bar .right{gap:8px}
body.portrait #chips{flex-wrap:wrap}
body.portrait .pnote{display:block;font-size:12px;color:var(--sub);padding:8px 16px;border-bottom:1px solid var(--rule)}
body.portrait .page{position:static;display:flex;flex-direction:column}
body.portrait .col{border-left:0!important;border-bottom:1px solid var(--rule)}
body.portrait #colC{order:1}body.portrait #colL{order:2}body.portrait #colR{order:3}
body.portrait .col>.tile.grow{flex:none}
body.portrait .tile{padding:16px}
body.portrait .clockt{padding:22px 12px}
body.portrait .pop{position:fixed;top:60px;width:calc(100% - 24px);left:12px;transform:none}
body.portrait .addp{position:fixed;width:calc(100% - 24px);left:12px;transform:none;max-height:80vh}
body.portrait .qb{position:fixed;height:auto;min-height:52px;flex-wrap:wrap;white-space:normal;padding:8px 12px;gap:6px 10px}
body.portrait #eew{position:fixed;display:block;overflow:auto}
body.portrait #eew .map{height:56vh}
body.portrait #eew canvas{width:100%!important;height:100%!important;object-fit:cover}
body.portrait #eew .p{border-left:0;border-top:4px solid #ff3b3b}
body.portrait #eew .row1{flex-wrap:wrap}
body.portrait #eew .hd{padding:10px 14px;gap:8px;align-items:center}body.portrait #eew .hd b{font-size:22px;white-space:nowrap}body.portrait #eew .hd span{font-size:13px;white-space:nowrap}body.portrait #eew .hd .x{white-space:nowrap}
body.portrait #eew .bd{padding:16px}body.portrait #eew .act div{font-size:20px}
body.portrait #eew .sh{font-size:100px;min-width:110px}
body.portrait #eew .cd .v{font-size:64px}

/* 上のバー */
.bar{position:absolute;left:0;right:0;top:0;height:52px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px;padding:0 16px}
.chip{display:flex;align-items:baseline;gap:7px;border:1px solid var(--rule);padding:5px 12px;font-size:13px;color:var(--sub);white-space:nowrap}
.chip b{font-family:var(--num);font-size:19px;color:var(--ink);font-weight:500}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--card)}
.chip .slc{color:var(--sl);font-weight:700}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--sub);white-space:nowrap}
.bar .right .warn{color:var(--red)}
.logo{display:flex;align-items:center;gap:8px;margin-right:8px;font-family:var(--num);font-size:21px;font-weight:600;letter-spacing:.03em}
.logo img{display:block;border-radius:7px}
.gear{border:1px solid var(--rule);padding:5px 12px;font-size:13px;color:var(--ink)}

.page{position:absolute;left:0;right:0;top:52px;bottom:0;display:grid;grid-template-columns:300px 1fr 300px}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.col+.col{border-left:1px solid var(--rule)}
.tile{padding:20px 24px;border-bottom:1px solid var(--rule);min-height:0;overflow:hidden}
.tile:last-child{border-bottom:0}
.grow{flex:1}
h3{font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:.12em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h3 span{font-weight:400;letter-spacing:0;font-size:12px;white-space:nowrap}
ul{list-style:none}

/* 時間割 */
.tt li{display:grid;grid-template-columns:18px 1fr auto;column-gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.tt li:last-child{border:0}
.tt .p{color:var(--sub);font-size:17px}.tt .s{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .rm{font-size:11px;color:var(--sub);margin-left:6px;font-weight:400}.tt .t{color:var(--sub);font-size:17px}
.tt li.past *{color:var(--dim)!important}
.tt li.now{border-bottom-color:var(--red)} .tt li.now .p,.tt li.now .t{color:var(--red)}
.tt li.now .s::after{content:"  いま";color:var(--red);font-size:11px;font-weight:700}
.empty{color:var(--sub);font-size:13px;line-height:1.7}
.ql li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule)}.ql li:last-child{border:0}
.ql .si{flex:none;min-width:62px;text-align:center;font-size:13px;padding:3px 6px;font-weight:700}
.ql .qn{flex:1;min-width:0;font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ql .qd{display:block;font-size:11.5px;color:var(--sub);font-weight:400;overflow:hidden;text-overflow:ellipsis}
#eewPanel .steps{display:flex;align-items:center;gap:8px;margin:10px 0 2px;font-size:14px;color:#8d939b;flex-wrap:wrap}
#eewPanel .steps span{border:1px solid #3a3f47;padding:3px 10px}#eewPanel .steps span.on{color:#fff;border-color:#fff;font-weight:700}#eewPanel .steps i{font-style:normal}

/* やること */
.todo li{display:grid;grid-template-columns:16px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);font-size:15px}
.todo li:last-child{border:0}
.box{width:15px;height:15px;border:1.5px solid var(--sub)}
.todo li.d{color:var(--dim);text-decoration:line-through}.todo li.d .box{background:var(--dim);border-color:var(--dim)}
.todo .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due{font-size:11.5px;color:var(--sub);white-space:nowrap} .due.h{color:var(--red)}
.kd.g{border-color:var(--blue);color:var(--blue)}
.kd{font-style:normal;font-size:10px;border:1px solid var(--yel);color:var(--yel);padding:0 3px;margin-right:7px;vertical-align:2px}
.add{font-size:16px;color:var(--sub);border:1px solid var(--rule);width:24px;height:24px;line-height:20px;text-align:center}

/* 時計 */
.clockt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 30px}
.date{font-size:16px;letter-spacing:.06em;color:var(--sub)} .date b{color:var(--ink);font-weight:500}
.clock{font-size:220px;font-weight:300;line-height:.88;letter-spacing:-2px;margin-top:10px;display:flex;align-items:flex-start;white-space:nowrap}
.clock .colon{color:var(--red);margin:0 2px;position:relative;top:-6px}
.clock .sec{font-size:44px;color:var(--sub);margin:18px 0 0 8px;font-weight:400;width:1.1em}
.next{margin-top:14px;font-size:16px;color:var(--sub);text-align:center} .next b{color:var(--ink)} .next .n{font-size:24px;color:var(--red);font-weight:500}
/* 路線図(共通):授業 = 太い線、10分休み = 駅の丸、昼休み = ホームの箱 */
.rmw{width:100%;margin-top:14px}
.rml{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--sub);margin-bottom:6px;white-space:nowrap}
.rml span{display:inline-flex;align-items:center;gap:6px}.rml b{font-size:12.5px;letter-spacing:.12em;margin-right:auto}
.rml i{display:inline-block;flex:none}
.rm{position:relative;height:92px}
.rm>*{position:absolute}
.rm .rl{top:0;height:20px;display:flex;gap:5px;align-items:center;justify-content:center;font-size:13px;white-space:nowrap;overflow:hidden;color:var(--ink)}
.rm .rl.done{color:var(--dim)}.rm .rl.cur{font-weight:700}
.rm .rl.sm{font-size:11px;color:var(--sub)}.rm .rl.sm.done{color:var(--dim)}
.rm .rn{flex:none;font-family:var(--num);font-size:12px;font-weight:700;width:17px;height:17px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg)}
.rm .rl.done .rn{background:var(--dim)}.rm .rl.cur .rn{background:var(--rc,var(--red));color:var(--onpill)}
.rm .rb{top:28px;height:12px;background:var(--rc,var(--red));overflow:hidden;border-right:2px solid var(--bg)}
.rm .rb.sm{background:var(--track)}
.rm .rb.done{background:var(--segdone)}
.rm .rb i{position:absolute;left:0;top:0;bottom:0;background:var(--segdone)}
.rm .rd{top:24px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:4px solid var(--ink);transform:translateX(-50%)}
.rm .rd.done{border-color:var(--dim)}
.rm .rdl{top:50px;transform:translateX(-50%);font-size:11px;color:var(--sub);white-space:nowrap}
.rm .rlu{top:20px;height:28px;border:1px solid var(--yel);background:var(--lunchbg);color:var(--yel);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.rm .rlu.done{opacity:.55}
.rm .rlus{top:52px;text-align:center;font-size:11px;color:var(--yel)}
.rm .rmn{top:18px;width:34px;height:32px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;clip-path:polygon(0 0,78% 0,100% 50%,78% 100%,0 100%);z-index:2}
.rm .rt{top:72px;font-family:var(--num);font-size:15px;color:var(--sub);white-space:nowrap}

/* 時計の下の枠 */
.col>.tile{flex:none}
.col>.tile.grow{flex:1 1 0;min-height:150px}
/* タイルが多くて入りきらない列は、その列だけスクロール */
.col{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}.col::-webkit-scrollbar{display:none}
.col.over{box-shadow:inset 0 -14px 10px -10px rgba(0,0,0,.45)}
.pop{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:620px;max-height:320px;background:var(--bg);border:1px solid var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.45);z-index:4;padding:18px 26px;display:flex;flex-direction:column}
.pop .back{font-size:11px;color:var(--dim);text-align:right;margin-top:auto;padding-top:6px}
.slhead{display:flex;align-items:baseline;gap:12px;min-width:0}
.pill{font-size:11.5px;font-weight:700;padding:1px 8px;background:var(--sl);color:var(--onpill);white-space:nowrap}
.pill.g{background:transparent;border:1px solid var(--sub);color:var(--sub);font-weight:500}
.slname{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slremain{margin-left:auto;font-size:15px;color:var(--sub);white-space:nowrap} .slremain .n{font-size:40px;color:var(--sl);font-weight:500;line-height:1}
.slsub{font-size:13px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.late{color:var(--red)} .okc{color:var(--grn)}
.slfoot{display:flex;gap:18px;margin-top:4px;font-size:12.5px;color:var(--sub);border-top:1px solid var(--rule);padding-top:8px}
.slfoot b{color:var(--ink);font-weight:500}

/* 記憶回路・語句のカード */
.card{border:1px solid var(--rule);background:var(--card);padding:14px 18px;display:flex;align-items:center;gap:22px;min-height:118px}
.ctag{font-size:10.5px;color:var(--yel);border:1px solid var(--yel);padding:0 6px;white-space:nowrap}
.cside{display:flex;flex-direction:column;gap:6px;align-items:flex-start;flex:none}
.cw{font-family:var(--num);font-size:46px;font-weight:500;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cw.jp{font-family:var(--jp);font-size:34px;font-weight:700}
.cans{min-width:0;flex:1}
.cans .a{font-size:20px;font-weight:700}
.cans .def{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5;max-height:3em;overflow:hidden}
.flip{margin-left:auto;font-size:12px;border:1px solid var(--dim);padding:3px 10px;color:var(--sub);white-space:nowrap}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.grade button{font-size:13px;border:1px solid var(--rule);padding:7px 0;color:var(--sub)}
.subj3{display:flex;gap:16px;font-size:12.5px;color:var(--sub);margin-bottom:10px}.subj3 b{color:var(--ink);font-size:17px;font-weight:500;margin-left:3px}
.term .tw{font-size:30px;font-weight:700;letter-spacing:.02em}
/* 語句のカード(めくる) */
.tnext{border:1px solid var(--rule);padding:2px 10px;font-size:12px;color:var(--ink)}
.termcard.fc{perspective:1200px;min-height:150px;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;min-height:inherit;transition:transform .5s;transform-style:preserve-3d}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;border:1px solid var(--rule);background:var(--card);padding:14px 18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.fc-front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.fc-front .tcat{position:absolute;left:14px;top:12px}.fc-front .flip{position:absolute;right:12px;bottom:10px}
.fc-front .tw{font-size:38px;font-weight:700;line-height:1.2}
.fc-back{transform:rotateY(180deg)}
.fc-back .tw2{font-size:22px;font-weight:700;margin-top:8px}.fc-back .tw2 .tr{font-size:13px;color:var(--sub);font-weight:400;margin-left:10px}
.fc-back .td2{font-size:14.5px;line-height:1.65;margin-top:6px}
.mini .termcard.fc{min-height:130px}.mini .fc-front .tw{font-size:26px}.mini .fc-back .tw2{font-size:17px}.mini .fc-back .td2{font-size:12.5px}
/* タイルの全画面 */
#full{position:absolute;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column}
#full[hidden]{display:none}
.fhead{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--rule)}
.fhead b{font-size:17px;margin-right:auto}.fhead .fhint{font-size:12px;color:var(--sub)}
.fbody{flex:1;min-height:0;display:flex;overflow:auto}
#full .tile{flex:1;border:0;zoom:1.6;padding:20px 28px;overflow:auto;display:flex;flex-direction:column}
#full .clockt{zoom:1;align-items:center;justify-content:center}
#full .clockt .date{font-size:26px}#full .clockt .next{font-size:24px}#full .clockt .next .n{font-size:36px}#full .clockt .rmw{zoom:1.5}
#full .termcard.fc{flex:1;min-height:220px}
#full .fc-front .tw{font-size:52px}#full .fc-back .tw2{font-size:28px}#full .fc-back .td2{font-size:18px}
body.portrait #full .tile{zoom:1.15}
/* 全画面の詳しい画面 */
.fv{flex:1;min-width:0;padding:14px 22px 18px;display:flex;flex-direction:column;font-size:16px;overflow:auto}
.fvbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:12px}
.fvbar>b{font-size:20px}.fvbar>button,.fvtabs button{border:1px solid var(--rule);padding:7px 14px;font-size:15px;color:var(--ink);min-width:44px}
.fvbar>button:disabled{opacity:.3}
.fvnote{font-size:12.5px;color:var(--sub)}.fvbar .fvnote{margin-left:auto}
.fvtabs{display:flex;gap:6px;flex-wrap:wrap}.fvtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.fvtabs.multi button.on{background:transparent;color:var(--ink);border-color:var(--yel);box-shadow:inset 0 0 0 1px var(--yel)}
.fvtabs.multi button{color:var(--sub)}.fvtabs small{font-size:11px;color:var(--sub)}
.fv h4{font-size:13px;color:var(--sub);letter-spacing:.1em;margin:14px 0 6px}
.calwrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr 340px;gap:18px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(0,1fr);grid-template-rows:auto;gap:3px;min-height:0}
.cw2{text-align:center;font-size:13px;color:var(--sub);padding:2px 0}.cw2.su,.cc.su .cn{color:var(--red)}.cw2.sa,.cc.sa .cn{color:var(--blue)}
.cc{border:1px solid var(--rule);text-align:left;padding:4px 6px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;align-items:stretch}
.cc .cn{font-size:18px}.cc.out{opacity:.35}.cc.past{opacity:.6}.cc.td{border-color:var(--red)}.cc.td .cn{color:var(--red);font-weight:700}
.cc.sel{background:var(--card);box-shadow:inset 0 0 0 2px var(--ink)}
.ch{font-size:10px;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ce{font-size:11px;border-left:3px solid var(--blue);padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm,.ct{font-size:10.5px;color:var(--sub)}.ct{color:var(--yel)}
.dp{border-left:1px solid var(--rule);padding-left:18px;overflow:auto;min-height:0}
.dph{font-size:24px;font-weight:700}.dph span{font-size:13px;color:var(--red);margin-left:8px}
.dpt{font-size:13px;color:var(--sub);margin-top:2px}.dpt.su{color:var(--red)}
.dpl li{display:grid;grid-template-columns:4px 92px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);font-size:15px}
.dpl li i{height:18px;background:var(--rule)}.dpl li .n{color:var(--sub);font-size:14px}.dpl li small{color:var(--sub)}
.dpl li.d{color:var(--dim);text-decoration:line-through}
.sgroups{columns:2;column-gap:28px}.sg{break-inside:avoid;margin-bottom:12px}
.sgh{display:flex;justify-content:space-between;width:100%;font-size:17px;font-weight:700;padding:6px 0;border-bottom:1px solid var(--ink);text-align:left}.sgh span{font-weight:400;font-size:13px;color:var(--sub)}.sgh.su{color:var(--red)}
.ttt{width:100%;border-collapse:collapse;font-size:20px}
.ttt th{font-size:12.5px;color:var(--sub);text-align:left;font-weight:400;padding:4px 10px;border-bottom:1px solid var(--rule)}
.ttt td{padding:11px 10px;border-bottom:1px solid var(--rule)}.ttt td.sj{font-weight:700}.ttt td.pno{color:var(--sub)}
.ttt tr.sub td{font-size:15px;color:var(--sub);padding:6px 10px}
.ttt tr.past td{color:var(--dim)}.ttt tr.now td{color:var(--red)}.ttt tr.now td.sj::after{content:"  いま";font-size:12px}
.wxbig{display:flex;gap:18px;align-items:center;margin-bottom:12px}.wxbig svg{width:80px;height:74px}

<script>
'use strict';
const APP_VERSION = '2.13.0'; // 変えたら changelog.json の先頭も同じ番号にする

/* ================= 基本 ================= */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PREFIX = 'home:';
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(PREFIX + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); return true; } catch (e) { if (!store.warned && typeof toast === 'function') { store.warned = true; toast('この端末に保存できませんでした(容量がいっぱい・プライベートブラウズなど)。変更は読み直すと消えます'); } return false; } }
};
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()); // その日の0時
const toMin = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : null; };
const fmtMin = m => { m = Math.round(m); return `${Math.floor(m / 60)}:${pad(m % 60)}`; }; // 先に丸める(21:59:40 が 21:00 にならないように)
const fmtDay = m => fmtMin(m > 1440 ? m - 1440 : m); // 24:00 はそのまま、それより後は 0:10 のように
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
const minOfDay = d => d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
const dayDiff = (a, b) => Math.round((new Date(b.getFullYear(), b.getMonth(), b.getDate()) - new Date(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
const hm = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60 ? pad(m % 60) + '分' : ''}` : `${m}分`; };

// ?at=2026-10-29T20:18 で時刻をずらして確認できる(進み続ける)
let timeOffset = 0;
{ const at = new URLSearchParams(location.search).get('at'); if (at) { const t = new Date(at).getTime(); if (!isNaN(t)) timeOffset = t - Date.now(); } }
const nowMs = () => Date.now() + timeOffset;
const now = () => new Date(nowMs());

const SHIFTS = [[0, 0], [2, 1], [3, 3], [1, 3], [-1, 2], [-3, 1], [-2, -1], [-1, -3], [1, -2], [3, -1]];
function fit() {
  const top = $('sai').offsetHeight || 0, w = innerWidth, h = innerHeight - top;
  const portrait = w < h || w < 760;

  const st = $('stage');
  if (portrait) { st.style.transform = ''; st.style.width = ''; st.style.height = ''; }
  else {
    const s = Math.min(w / 1180, h / 820);
    st.style.width = (w / s) + 'px'; st.style.height = (h / s) + 'px';
    const [sx, sy] = cfg.shift ? SHIFTS[Math.floor(Date.now() / 180e3) % SHIFTS.length] : [0, 0]; // 焼き付き防止:3分ごとに数ピクセルずらす
    st.style.transform = `translate(${sx}px,${top + sy}px) scale(${s})`;

}

  if (cfg.theme === 'auto') { const m = minOfDay(now()), a = toMin(cfg.lightFrom) ?? 390, b = toMin(cfg.darkFrom) ?? 1080; light = a < b ? m >= a && m < b : m >= a || m < b; }

/* ================= 学校の1日 ================= */
const rng = (s, e) => [toMin(s), toMin(e)];
function periodsMin(d) { const dc = dayCfg(d); return dc ? dc.p.map(([s, e]) => rng(s, e)).filter(([s, e]) => s != null && e != null && e > s) : []; }
function preMin(d) { const dc = dayCfg(d); return dc && dc.pre ? dc.pre.map(([n, s, e]) => [n, ...rng(s, e)]).filter(x => x[1] != null && x[2] > x[1]) : []; }
function postMin(d) { const dc = dayCfg(d); if (!dc || !dc.post) return null; const [n, s, e] = dc.post; const r = rng(s, e); return r[0] != null && r[1] > r[0] ? [n || 'HR', ...r] : null; }
function schoolState(d) {
  const ps = periodsMin(d), pre = preMin(d), post = postMin(d), m = minOfDay(d);
  if (!isSchoolDay(d) || !ps.length) return { mode: 'off', ps, pre, post };
  const base = { ps, pre, post };
  const start = pre.length ? pre[0][1] : ps[0][0];
  if (m < start) return { ...base, mode: 'before', left: start - m, label: pre.length ? pre[0][0] : '1限' };
  for (const [n, s, e] of pre) if (m >= s && m < e) return { ...base, mode: 'pre', name: n, left: e - m };
  if (m < ps[0][0]) return { ...base, mode: 'break', next: 0, left: ps[0][0] - m };
  for (let i = 0; i < ps.length; i++) {
    if (m >= ps[i][0] && m < ps[i][1]) return { ...base, mode: 'class', i, left: ps[i][1] - m };
    if (i + 1 < ps.length && m >= ps[i][1] && m < ps[i + 1][0]) return { ...base, mode: 'break', next: i + 1, left: ps[i + 1][0] - m };
  }
  if (post && m < post[1]) return { ...base, mode: 'break', next: -1, left: post[1] - m };
  if (post && m < post[2]) return { ...base, mode: 'shr', name: post[0], left: post[2] - m };
  return { ...base, mode: 'after' };
}
const ttOf = d => (cfg.tt[d.getDay()] || []);
const subjOf = (d, i) => (ttOf(d)[i] || {}).s || '';
const roomOf = (d, i) => (ttOf(d)[i] || {}).r || '';
const dayLabel = (base, d) => { const k = dayDiff(base, d); return k === 0 ? '今日' : k === 1 ? '明日' : `${md(d)}(${WD[d.getDay()]})`; };

/* ================= 路線図(共通) =================
   授業 = 太い線の区間(幅は時刻の割合)/ 10分休み = 駅の丸 / 昼休み = ホームの箱 / いま = 矢印形のマーカー
   items: [{k:'cls'|'sm', a, b, n, name, st?}]  a,b = 分。st を渡さなければ o.now から 済/いま/これから を決める
   o: { t0, t1, now(分 or null), w(描く幅のおおよそ px), legend, gaps(休みの駅・昼休みを描く。既定 true), c(未来の線の色), ticks:[分,…] } */
function routeMap(items, o) {
  const t0 = o.t0, span = Math.max(1, o.t1 - t0), W = o.w || 520, now0 = o.now == null ? null : o.now;
  const X = m => Math.max(0, Math.min(100, (m - t0) / span * 100));
  const stOf = it => it.st || (now0 == null ? 'wait' : now0 >= it.b ? 'done' : now0 >= it.a ? 'cur' : 'wait');
  let h = o.legend ? '<div class="rml"><b>今日の流れ</b><span><i style="width:22px;height:8px;background:var(--red)"></i>授業</span><span><i style="width:12px;height:12px;border-radius:50%;border:3px solid var(--ink)"></i>10分休み</span><span><i style="width:24px;height:12px;border:1px solid var(--yel);background:var(--lunchbg)"></i>昼休み</span></div>' : '';
  h += `<div class="rm"${o.c ? ` style="--rc:${o.c}"` : ''}>`;
  items.forEach((it, i) => {
    const x = X(it.a), w = X(it.b) - x, px = w / 100 * W, st = stOf(it);
    if (it.k === 'sm') {
      const nm = Math.floor(px / 12) >= 1 ? esc(String(it.name || '').slice(0, Math.floor(px / 12))) : '';
      h += `<div class="rl sm ${st}" style="left:${x.toFixed(2)}%;width:${w.toFixed(2)}%">${nm}</div><div class="rb sm ${st}" style="left:${x.toFixed(2)}%;width:${w.toFixed(2)}%">${st === 'cur' ? `<i style="width:${((now0 - it.a) / (it.b - it.a) * 100).toFixed(1)}%"></i>` : ''}</div>`;
      return;
    }
    const mx = Math.floor((px - 22) / 13), nm = mx >= 1 ? esc(String(it.name || '').slice(0, mx)) : '';
    h += `<div class="rl ${st}" style="left:${x.toFixed(2)}%;width:${w.toFixed(2)}%" title="${esc(it.name || '')}">${it.n != null ? `<span class="rn">${it.n}</span>` : ''}${nm}</div>`;
    h += `<div class="rb ${st}" style="left:${x.toFixed(2)}%;width:${w.toFixed(2)}%">${st === 'cur' ? `<i style="width:${Math.max(0, Math.min(100, (now0 - it.a) / (it.b - it.a) * 100)).toFixed(1)}%"></i>` : ''}</div>`;
    const prev = items[i - 1];
    if (o.gaps !== false && prev && prev.k === 'cls' && it.a > prev.b) { // 授業と授業のあいだ
      const gap = it.a - prev.b, done = now0 != null && now0 >= it.a;
      if (gap >= 30) { const gx = X(prev.b), gw = X(it.a) - gx; h += `<div class="rlu ${done ? 'done' : ''}" style="left:${gx.toFixed(2)}%;width:${gw.toFixed(2)}%">昼休み</div><div class="rlus" style="left:${gx.toFixed(2)}%;width:${gw.toFixed(2)}%">${gap}分</div>`; }
      else { const gx = X((prev.b + it.a) / 2); h += `<div class="rd ${done ? 'done' : ''}" style="left:${gx.toFixed(2)}%"></div><div class="rdl" style="left:${gx.toFixed(2)}%">休 ${gap}分</div>`; }
    }
  });
  if (now0 != null && now0 >= t0 && now0 <= o.t1) h += `<div class="rmn" style="left:${X(now0).toFixed(2)}%">いま</div>`;
  const tk = [...new Set(o.ticks || [])].sort((a, b) => a - b).filter((m, i, a) => i === 0 || X(m) - X(a[i - 1]) > 8);
  tk.forEach((m, i) => { h += `<div class="rt n" style="left:${X(m).toFixed(2)}%;transform:translateX(${i === 0 ? '0' : i === tk.length - 1 ? '-100%' : '-50%'})">${fmtDay(m)}</div>`; });
  return h + '</div>';
}
// 学校の1日(朝 → 1〜6限 → 帰り)を路線図にする
function schoolRoute(d, st, w) {
  const m = minOfDay(d), it = [];
  if (st.pre.length) it.push({ k: 'sm', a: st.pre[0][1], b: st.pre[st.pre.length - 1][2], name: '朝' });
  st.ps.forEach(([a, b], i) => it.push({ k: 'cls', a, b, n: i + 1, name: subjOf(d, i) }));
  if (st.post) it.push({ k: 'sm', a: st.post[1], b: st.post[2], name: 'HR' });
  const t0 = it[0].a, t1 = it[it.length - 1].b, lunch = st.ps.findIndex((p, i) => i > 0 && p[0] - st.ps[i - 1][1] >= 30);
  return routeMap(it, { t0, t1, now: m, w, legend: true, ticks: [t0, t1, ...(lunch > 0 ? [st.ps[lunch - 1][1]] : [])] });
}

function renderClock() {
  const d = now();
  $('date').innerHTML = `<b>${d.getMonth() + 1}月${d.getDate()}日</b>　${WD[d.getDay()]}曜日${HOLIDAYS[ymd(d)] ? '　' + esc(HOLIDAYS[ymd(d)]) : ''}`;
  $('clock').innerHTML = `${d.getHours()}<span class="colon">:</span>${pad(d.getMinutes())}${cfg.showSec ? `<span class="sec">${pad(d.getSeconds())}</span>` : ''}`;
  const st = schoolState(d);
  let t = '';
  const sub = (dd, i) => { const s = subjOf(dd, i); return s ? `<b>${esc(s)}</b>${roomOf(dd, i) ? `(${esc(roomOf(dd, i))})` : ''}` : `<b>${i + 1}限</b>`; };
  const left = m => { m = Math.ceil(m); return m >= 60 ? `<span class="n">${Math.floor(m / 60)}</span> 時間 <span class="n">${m % 60}</span> 分` : `<span class="n">${m}</span> 分`; };
  const postName = st.post ? esc(st.post[0]) : '帰り';
  if (st.mode === 'before') t = `${esc(st.label)}まで ${left(st.left)}　／　1限は ${sub(d, 0)} <span class="n" style="color:var(--sub);font-size:20px">${fmtMin(st.ps[0][0])}</span>`;
  else if (st.mode === 'pre') t = `${esc(st.name)}　あと ${left(st.left)}　／　1限は ${sub(d, 0)} <span class="n" style="color:var(--sub);font-size:20px">${fmtMin(st.ps[0][0])}</span>`;
  else if (st.mode === 'class') t = `${st.i + 1}限 終わりまで ${left(st.left)}　／　次は ${st.i + 1 < st.ps.length ? sub(d, st.i + 1) : `<b>${postName}</b>`}`;
  else if (st.mode === 'break') t = st.next >= 0 ? `${st.next + 1}限まで ${left(st.left)}　／　${sub(d, st.next)}` : `${postName}まで ${left(st.left)}`;
  else if (st.mode === 'shr') t = `${postName}　あと ${left(st.left)}`;
  else {
    const nd = st.mode === 'after' ? nextSchoolDay(d) : (isSchoolDay(d) ? d : nextSchoolDay(d));
    const s0 = subjOf(nd, 0), p0 = periodsMin(nd)[0];
    t = `${st.mode === 'after' ? '今日の授業はおわり' : '今日はお休み'}　／　${dayLabel(d, nd)} 1限は ${s0 ? `<b>${esc(s0)}</b>` : '—'} ${p0 ? `<span class="n" style="color:var(--sub);font-size:20px">${fmtMin(p0[0])}</span>` : ''}`;
  }
  $('next').innerHTML = t;
  // 路線図(授業がある日の昼間だけ)
  const show = st.mode !== 'off' && st.mode !== 'after';
  $('rmap').hidden = !show;
  if (show) $('rmap').innerHTML = schoolRoute(d, st, $('rmap').clientWidth || 520);
  return st;
}

/* ================= 時間割タイル ================= */
function renderTT(st) {
  if (editing) return; // 並べ替え中は中身を描き直さない(× ボタンが消えないように)
  const d = now();
  let day = d, title = '今日の時間割';
  if (st.mode === 'after' || st.mode === 'off') { day = st.mode === 'off' && isSchoolDay(d) ? d : nextSchoolDay(d); title = `${dayLabel(d, day) === '明日' ? '明日' : dayLabel(d, day)}の時間割`; }
  const ps = periodsMin(day), list = ttOf(day), m = minOfDay(d), today = day === d;
  let h = `<h3>${title} <span>${WD[day.getDay()]}曜</span></h3>`;
  if (!list.some(x => x && x.s)) h += `<p class="empty">時間割がまだありません。<br>右上の「設定」→「時間割」で入れてください。</p>`;
  else {

      h += `<li class="${cls}"><span class="p n">${i + 1}</span><span class="s">${esc(it.s || '—')}${it.r ? `<span class="rm">${esc(it.r)}</span>` : ''}</span><span class="t n">${fmtMin(s)}</span></li>`;

    h += '</ul>';
  }

function dueInfo(t) {
  if (!t.due) return { label: '', hot: false, ord: 9e15 }; // 期限なしは期限ありのあと
  const d = parseYmd(t.due), k = dayDiff(now(), d);
  return { label: k < 0 ? '期限切れ' : k === 0 ? '今日' : k === 1 ? '明日' : md(d), hot: k <= 0 || (k === 1 && t.bring), ord: d.getTime() };
}
/* ---- Google ToDo(Apps Script を通して読む・完了にする) ---- */
let gtasks = store.get('gtasks') || [], gtErr = '', gtLoading = false;
const gtOn = () => !!cfg.gtUrl;
const allTodos = () => gtOn() ? [...todos, ...gtasks.filter(t => !(cfg.gtHide || []).includes(t.list))] : todos;
const findTodo = id => allTodos().find(x => x.id === id);
function gtKey() { if (!cfg.gtKey) { const a = new Uint8Array(12); crypto.getRandomValues(a); cfg.gtKey = [...a].map(x => x.toString(16).padStart(2, '0')).join(''); saveCfg(); } return cfg.gtKey; }
async function gtCall(params) {
  const u = (cfg.gtUrl || '').trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) throw new Error('URL が Apps Script のものではありません');
  let r;
  try { r = await fetch(u + (u.includes('?') ? '&' : '?') + new URLSearchParams({ key: gtKey(), ...params }), { cache: 'no-store' }); }
  catch (e) { throw new Error('つながりませんでした(「アクセスできるユーザー」が「全員」か確かめてください)'); }
  const text = await r.text();
  if (/^\s*</.test(text)) throw new Error(/accounts\.google|Sign in|ログイン/i.test(text) ? 'Google のログイン画面が返ってきました。「アクセスできるユーザー」を「全員」にしてデプロイし直してください' : 'ページが返ってきました。デプロイの種類が「ウェブアプリ」か確かめてください');
  let j; try { j = JSON.parse(text); } catch (e) { throw new Error('返ってきた内容が読めませんでした'); }
  if (j && j.error) throw new Error(/Tasks is not defined|ReferenceError/.test(j.error) ? '「サービス」に Tasks API が追加されていません' : j.error);
  return j;
}
async function loadGt() {
  if (!gtOn() || gtLoading) return;
  gtLoading = true;
  try {
    const j = await gtCall({});
    if (!Array.isArray(j.lists)) throw new Error('形式が違います。コードを貼り付け直してください');

function prefAt(lat, lon) {

      const [xi, yi] = r[i], [xj, yj] = r[j];

  let best = null, bd = 1e9; for (const p of JAPAN) { const d = (p.c[0] - lon) ** 2 + (p.c[1] - lat) ** 2; if (d < bd) { bd = d; best = p.name; } }

  const prefs = JAPAN ? JAPAN.map(p => p.name) : [];
  const dc = cfg.days[ttDay] = cfg.days[ttDay] || { pre: [], p: [], post: ['HR', '', ''] };
  const tt = cfg.tt[ttDay] || [];
  const opt = (v, cur, lab) => `<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${esc(lab)}</option>`;
  $('settings').innerHTML = `<div class="sx">
  <header><h1>設定</h1><div class="stabs">${STABS.map(t => `<button data-stab="${t[0]}" class="${t[0] === sTab ? 'on' : ''}">${t[1]}</button>`).join('')}</div><button class="done" id="sDone">完了</button></header>
  <div class="sbody">

  <section id="s-view"><h2>表示</h2>
    <div class="row">${['dark', 'light', 'auto'].map(v => `<label><input type="radio" name="theme" value="${v}" ${cfg.theme === v ? 'checked' : ''}>${{ dark: 'ダーク', light: 'ライト', auto: '時間で自動' }[v]}</label>`).join('')}</div>
    <div class="row">自動のとき:ライトは <input type="time" id="lightFrom" value="${esc(cfg.lightFrom)}"> から、ダークは <input type="time" id="darkFrom" value="${esc(cfg.darkFrom)}"> から</div>
    <div class="row"><label><input type="checkbox" id="showSec" ${cfg.showSec ? 'checked' : ''}>秒を表示</label></div>
    <h4 style="margin-top:14px">焼き付き防止</h4>
    <div class="row"><label><input type="checkbox" id="shiftOn" ${cfg.shift ? 'checked' : ''}>3分ごとに画面を数ピクセルずらす</label></div>
    <div class="row"><label><input type="checkbox" id="dimOn" ${cfg.dimOn ? 'checked' : ''}>夜は暗くする</label><input type="time" id="dimFrom" value="${esc(pad5(cfg.dimFrom))}"> 〜 <input type="time" id="dimTo" value="${esc(pad5(cfg.dimTo))}"></div>
    <div class="row">暗さ <select id="dimLv">${[[50, '少し'], [70, 'ふつう'], [85, 'かなり']].map(([v, l]) => opt(v, cfg.dimLv, l)).join('')}</select></div>
    <p class="note">暗いときに画面をさわると、1分だけ明るく戻ります。地震の表示が出たら、すぐ明るくなります。</p>
    <p class="note">置きっぱなしにするときは、充電しながら使ってください。開いている間は画面が自動で消えないようにしています(iPadOS 16.4 以降)。</p>
  </section>

  <section id="s-chips" style="border:0">${tileBoard()}</section>

  <section id="s-tt"><h2>時間割</h2>
    <div class="tabs">${[1, 2, 3, 4, 5, 6].map(d => `<button data-ttday="${d}" class="${d === ttDay ? 'on' : ''}">${WD[d]}</button>`).join('')}</div>
    ${ttDay === 6 ? `<div class="row">授業がある週:${[1, 2, 3, 4, 5].map(n => `<label><input type="checkbox" data-satw="${n}" ${(cfg.satWeeks || []).includes(n) ? 'checked' : ''}>第${n}</label>`).join('')}</div>` : ''}
    <div class="cols c2"><div>
    <h4>授業</h4>
    <table><tr><th style="width:2.5em">時限</th><th>教科</th><th style="width:22%">教室(空でOK)</th><th style="width:7.5em">はじまり</th><th style="width:7.5em">おわり</th></tr>
    ${dc.p.map((p, i) => `<tr><td class="n">${i + 1}</td><td><input type="text" data-tts="${i}" value="${esc((tt[i] || {}).s || '')}" placeholder="教科"></td><td><input type="text" data-ttr="${i}" value="${esc((tt[i] || {}).r || '')}"></td><td><input type="time" data-ps="${i}" value="${esc(pad5(p[0]))}"></td><td><input type="time" data-pe="${i}" value="${esc(pad5(p[1]))}"></td></tr>`).join('')}</table>
    <div class="row"><button class="btn sub" id="pAdd">時限を増やす</button><button class="btn sub" id="pDel" ${dc.p.length ? '' : 'disabled'}>時限を減らす</button></div>
    </div><div>
    <h4>朝</h4>
    <table>${(dc.pre || []).map((x, i) => `<tr><td><input type="text" data-pren="${i}" value="${esc(x[0])}"></td><td style="width:8em"><input type="time" data-pres="${i}" value="${esc(pad5(x[1]))}"></td><td style="width:8em"><input type="time" data-pree="${i}" value="${esc(pad5(x[2]))}"></td><td style="width:3em"><button class="btn sub" data-predel="${i}">×</button></td></tr>`).join('')}</table>
    <button class="btn sub" id="preAdd">朝の予定を足す</button>
    <h4 style="margin-top:16px">帰り</h4>
    <div class="row"><input type="text" id="postN" value="${esc((dc.post || [])[0] || '')}" placeholder="掃除・HR"><input type="time" id="postS" value="${esc(pad5((dc.post || [])[1]))}"> 〜 <input type="time" id="postE" value="${esc(pad5((dc.post || [])[2]))}"></div>
    <p class="note">30分以上あいたところは昼休みとして表示します。時限を0にすると、その曜日は授業なしになります。祝日はお休みとして扱います。</p>
    </div></div>
  </section>

  <section id="s-todo"><h2>やること</h2>
    <div class="cols"><div><h4>追加する</h4>
    <div class="row"><input type="text" id="tdText" placeholder="例:英作文 添削提出" style="flex:1;min-width:200px"><label><input type="checkbox" id="tdBring">持ちもの</label><input type="date" id="tdDue"><button class="btn" id="tdAdd">追加</button></div>
    <p class="note">画面のやることをタップすると済になります。済にしたものは次の日に消えます。</p>
    </div><div><h4>一覧</h4>
    <table>${todos.map(t => `<tr><td>${t.bring ? '<span class="kd">持</span>' : ''}${esc(t.text)}${t.done ? ' <span class="note">(済)</span>' : ''}</td><td class="n" style="width:6em">${t.due ? md(parseYmd(t.due)) : ''}</td><td style="width:4em"><button class="btn sub" data-tddel="${esc(t.id)}">削除</button></td></tr>`).join('') || '<tr><td class="note">まだありません</td></tr>'}</table></div></div>
  </section>

  <section id="s-cd"><h2>カウントダウン</h2>
    <div class="cols c2"><div><h4>カウントダウン</h4>
    <div class="cdl">${cfg.countdowns.map((c, i) => `<div class="row"><input type="text" data-cdn="${i}" value="${esc(c.name)}" placeholder="名前(例:期末考査)" style="flex:1"><input type="date" data-cdd="${i}" value="${esc(c.date)}"><button class="btn sub" data-cddel="${i}">×</button></div>`).join('')}</div>
    <button class="btn sub" id="cdAdd" style="margin-top:8px">手で追加</button>
    <p class="note">近い順に、タイルには2つまで出ます。過ぎた日は出ません。</p>
    </div><div><details class="gcadd"><summary><b>Googleカレンダーから追加</b> <span class="note">(押して開く)</span></summary>
    ${!cfg.gasUrl ? '<p class="note">「連携」タブで Googleカレンダーをつなぐと、ここに予定が出て、押すだけで追加できます。</p>'
      : !events || !events.length ? '<p class="note">この先の予定がありません(読み込み中のこともあります)。</p>'
      : `<table>${events.filter(ev => new Date(ev.start) >= addDays(now(), -1)).slice(0, 30).map((ev, i) => { const d = new Date(ev.start), y = ymd(d), on = cfg.countdowns.some(c => c.date === y && c.name === String(ev.title).slice(0, 12)); return `<tr><td class="n" style="width:6.5em">${md(d)}(${WD[d.getDay()]})</td><td>${esc(ev.title)}</td><td style="width:5.5em">${on ? '<span class="note">追加済み</span>' : `<button class="btn sub" data-cdev="${esc(String(ev.title).slice(0, 12))}" data-cdd2="${y}">追加</button>`}</td></tr>`; }).join('')}</table>`}
    </details>
    </div></div>
  </section>

  <section id="s-soon"><h2>予定のお知らせ</h2>
    <div class="row"><label><input type="checkbox" id="soonOn" ${cfg.soonOn ? 'checked' : ''}>Googleカレンダーの予定が近づいたら、10秒だけ全画面で知らせる</label></div>
    <div class="row">知らせるとき(いくつでも。× で外す):</div>
    <div class="row">${(cfg.soonLeads || []).length ? cfg.soonLeads.map(v => `<span class="leadc">${leadLabel(v)}前<button data-leaddel="${v}" aria-label="外す">×</button></span>`).join('') : '<span class="note">まだありません</span>'}</div>
    <div class="row">よく使う:${LEADS.filter(([v]) => !(cfg.soonLeads || []).includes(v)).map(([v, l]) => `<button class="btn sub" data-leadadd="${v}">+ ${l}前</button>`).join('')}</div>
    <div class="row">自分で決める:<input type="number" id="leadN" min="1" max="999" inputmode="numeric" style="width:6em" placeholder="数"><select id="leadU"><option value="1">分前</option><option value="60">時間前</option><option value="1440">日前</option></select><button class="btn" id="leadAdd">追加</button></div>
    <div class="row"><label><input type="checkbox" id="soonStart" ${cfg.soonStart ? 'checked' : ''}>始まる時刻にも「始まります」を5秒出す</label><label><input type="checkbox" id="soonBeep" ${cfg.soonBeep ? 'checked' : ''}>音を鳴らす</label></div>
    <div class="row"><button class="btn" id="soonTest">テスト表示</button>${Object.keys(soonMuted).length ? `<button class="btn sub" id="soonUnmute">「知らせない」にした予定を戻す(${Object.keys(soonMuted).length}件)</button>` : ''}</div>
    <p class="note">終日の予定は、始まる時刻がないので知らせません。地震の表示が出ているときは出しません。タイマーは「タイマー」タイル(または上のバー)から使えます。</p>
  </section>

  <section id="s-loc"><h2>場所</h2>
    <p>いまの設定:<b>${L ? esc(L.pref || '') + (L.how === 'gps' ? '(現在地)' : '') : '未設定(東京)'}</b>${L ? ` <span class="note mono">${L.lat}, ${L.lon}</span>` : ''}</p>
    <div class="row"><button class="btn" id="useGps">現在地を使う</button><span id="gpsMsg" class="note"></span></div>
    <div class="row">または都道府県を選ぶ <select id="prefSel"><option value="">—</option>${prefs.map(p => opt(p, L && L.how === 'pref' ? L.pref : '', p)).join('')}</select></div>
    <p class="note">天気と、地震の予想震度・揺れまでの秒数に使います。位置は最初に一度だけ取り、この iPad の中にだけ保存します。</p>
  </section>

  <section id="s-gcal"><h2>Googleカレンダー</h2>
    <div class="row"><input type="url" id="gasUrl" value="${esc(cfg.gasUrl)}" placeholder="https://script.google.com/macros/s/…/exec" style="flex:1;min-width:260px"><button class="btn" id="gasTest">保存して読み込む</button></div>
    ${cfg.gasUrl ? `<p class="note">うまくいかないときは <a href="${esc(cfg.gasUrl)}" target="_blank" rel="noopener" style="color:var(--blue)">このURLを直接開いて</a>、[{"title": … のような文字が出るか見てください。ログイン画面や「権限が必要」が出たら、デプロイの設定が原因です。</p>` : ''}
    <p id="gasMsg" class="note">${cfg.gasUrl ? (eventsErr ? `<span class="ng">読めませんでした:${esc(eventsErr)}</span>` : events ? `<span class="ok">${events.length}件 読み込み済み</span>` : '') : ''}</p>
    <ol class="note" style="margin-top:8px">
      <li>パソコンかiPadで <span class="mono">script.google.com</span> を開き、「新しいプロジェクト」を作る</li>
      <li>中身を全部消して、下のコードを貼り付けて保存</li>
      <li>「デプロイ」→「新しいデプロイ」→ 左の歯車で種類「<b>ウェブアプリ</b>」を選ぶ(「ライブラリ」ではありません)。実行するユーザー「自分」、アクセスできるユーザー「<b>全員</b>」にしてデプロイ</li>
      <li>カレンダーへのアクセスを許可する(「安全ではないページ」と出たら「詳細」→「移動」)</li>
      <li>表示された「ウェブアプリのURL」を上に貼り付けて「保存して読み込む」</li>
    </ol>
    <pre id="gasCode">${esc(GAS_CODE)}</pre><button class="btn sub" id="gasCopy">コードをコピー</button>
    <p class="note">このURLを知っている人は予定を読めるので、人に教えないでください。URLはこの iPad の中にだけ保存します。</p>
  </section>

  <section id="s-quake"><h2>地震</h2>
    <div class="cols"><div>
    <h4>緊急地震速報</h4>
    <div class="row">全画面で知らせる:<select id="qFull">${opt(0, cfg.qFull, 'すべて(予報も、どこの地震でも)')}${[3, 4, 5, 6, 7].map(i => opt(i, cfg.qFull, `現在地の予想震度が ${SHINDO[i]} 以上`)).join('')}</select></div>
    <div class="row">音を鳴らす:<select id="qBeep">${[1, 2, 3, 4, 5, 10].map(i => opt(i, cfg.qBeep, i === 10 ? '鳴らさない' : SHINDO[i] + ' 以上')).join('')}</select></div>
    <p class="note">現在地の予想震度は、震源・規模・距離からの推定です(気象庁の地域ごとの予想とずれることがあります)。</p>
    </div><div>
    <h4>地震情報(揺れたあと)</h4>
    <div class="row">全画面で知らせる(どれか1つに当てはまったら):</div>
    <div class="row">${esc(loc().pref || '現在地の県')}の震度が <select id="qiPref">${opt(0, cfg.qiPref, '使わない')}${[1, 2, 3, 4, 5, 6, 7].map(i => opt(i, cfg.qiPref, SHINDO[i] + ' 以上')).join('')}</select></div>
    <div class="row">全国のどこかの最大震度が <select id="qiMax">${opt(0, cfg.qiMax, '使わない')}${[4, 5, 6, 7, 8, 9].map(i => opt(i, cfg.qiMax, SHINDO[i] + ' 以上')).join('')}</select></div>
    <div class="row">マグニチュードが <select id="qiMag">${opt(0, cfg.qiMag, '使わない')}${[5, 5.5, 6, 6.5, 7, 7.5].map(m => opt(m, cfg.qiMag, 'M' + m.toFixed(1) + ' 以上')).join('')}</select></div>
    <div class="row"><label><input type="checkbox" id="qiTsunami" ${cfg.qiTsunami ? 'checked' : ''}>津波注意報・津波警報が出たとき</label></div>
    </div><div>
    <h4>デモ</h4>
    <div class="row"><button class="btn red" data-demo="strong">強い揺れ(全画面)</button><button class="btn" data-demo="weak">弱い揺れ(上の帯)</button><button class="btn" data-demo="far">遠くの地震</button><button class="btn" data-demo="infofull">地震情報(全画面)</button><button class="btn sub" data-demo="info">地震情報(上の帯)</button><button class="btn sub" id="soundTest">音のテスト</button></div>
    <p class="note">「遠くの地震」は、現在地ではほぼ揺れない予報です。「すべて」にしていると全画面、そうでなければ何も出ません。</p>
    <p class="note">緊急地震速報は Wolfx、地震情報は P2P地震情報 から受け取ります。どちらも気象庁の発表を中継する無料のサービスで、数秒遅れることがあります。<b>公式の警報の代わりにはなりません。</b>学校の放送や先生の指示を優先してください。<br>音は、ページを開いたあと画面を一度タップすると鳴らせるようになります。</p>
    </div></div>
  </section>

  <section id="s-terms"><h2>受験の語句</h2>
    <div class="row">${[...new Set(terms.map(t => t.cat))].map(c => `<label><input type="checkbox" data-tcat="${esc(c)}" ${cfg.termCats.includes(c) ? 'checked' : ''}>${esc(c)}</label>`).join('')}</div>
  </section>

  <section id="s-gtodo"><h2>Google ToDo</h2>
    <p class="note" style="margin-top:0">Google ToDo(Google Tasks)のまだ終わっていないタスクを「やること」に出します(<span class="kd g" style="font-size:11px">G</span> の印)。押すと Google ToDo でも完了になります。カレンダーとは別に、Apps Script をもう1つ置きます。</p>
    <div class="row"><input type="url" id="gtUrl" value="${esc(cfg.gtUrl || '')}" placeholder="https://script.google.com/macros/s/…/exec" style="flex:1;min-width:240px"><button class="btn" id="gtSave">保存して読み込む</button>${cfg.gtUrl ? '<button class="btn sub" id="gtOff">つなぐのをやめる</button>' : ''}</div>
    <div class="row">合言葉 <input type="text" id="gtKeyIn" value="${esc(gtKey())}" class="mono" style="width:16em" autocomplete="off" spellcheck="false"><span class="note" style="margin:0">別の端末・開き方で同じ Apps Script を使うときは、URL とこの合言葉を同じにする</span></div>
    <p id="gtMsg" class="note">${cfg.gtUrl ? (gtErr ? `<span class="ng">読めませんでした:${esc(gtErr)}</span>` : `<span class="ok">${gtasks.filter(t => !t.done).length}件 読み込み済み</span>`) : ''}</p>
    ${cfg.gtUrl && (cfg.gtListNames || []).length > 1 ? `<div class="row">出すリスト:${cfg.gtListNames.map(([id, n]) => `<label><input type="checkbox" data-gtl="${esc(id)}" ${(cfg.gtHide || []).includes(id) ? '' : 'checked'}>${esc(n)}</label>`).join('')}</div>` : ''}
    <ol class="note" style="margin-top:8px">
      <li><span class="mono">script.google.com</span> で「新しいプロジェクト」を作る</li>
      <li>左の「サービス」の「＋」から <b>Tasks API</b> を選んで「追加」</li>
      <li>中身を全部消して、下のコードを貼り付けて保存</li>
      <li>「デプロイ」→「新しいデプロイ」→ 種類「<b>ウェブアプリ</b>」、実行するユーザー「自分」、アクセスできるユーザー「<b>全員</b>」でデプロイ(許可の画面が出たら許可)</li>
      <li>出てきた「ウェブアプリの URL」(…/exec)を上に貼って「保存して読み込む」</li>
    </ol>
    <pre id="gtCode">${esc(GT_CODE())}</pre><button class="btn sub" id="gtCopy">コードをコピー</button>
    <p class="note">コードの中の「合言葉」を知らないと読めないようにしてあります。URL とコードは人に教えないでください。URL はこの iPad の中にだけ保存します。</p>
  </section>

  <section id="s-apps"><h2>StudyLine・記憶回路</h2>
    <p>ホーム画面に追加したアプリは、アプリごとにデータの保存場所が分かれます。<b>StudyLine と記憶回路は、Platform の中の「開く」から使ってください。</b>そうすると、ダイヤや復習の記録がそのまま Platform に出ます。</p>
    <div class="row"><button class="btn" data-openapp="studyline">StudyLine を開く</button><button class="btn" data-openapp="kioku">記憶回路を開く</button></div>
    <p class="note">いま Platform から見えているデータ:StudyLine ${slDaysCount()}日分 ・ 記憶回路 ${vocabRecCount()}語の記録</p>
    <p class="note">ホーム画面の StudyLine アプリで使っていたデータを移すには:そのアプリの「データの書き出し」で書き出す → Platform の中で StudyLine を開いて「読み込む」でそのファイルを選ぶ。</p>
  </section>

  <section id="s-about"><h2>このアプリ</h2>
    <p><b>Platform</b> v${APP_VERSION}</p>
    ${changelog.slice(0, 3).map(e => `<p class="note"><b>v${esc(e.version)}</b> ${esc(e.date)}</p><ul class="l note">${(e.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>`).join('')}
    ${changelog.length > 3 ? `<details><summary class="note" style="cursor:pointer">前のバージョン(${changelog.length - 3}件)を見る</summary>${changelog.slice(3).map(e => `<p class="note"><b>v${esc(e.version)}</b> ${esc(e.date)}</p><ul class="l note">${(e.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>`).join('')}</details>` : ''}
    <p class="note" style="margin-top:10px">天気:Open-Meteo / 緊急地震速報:Wolfx / 地震情報:P2P地震情報(どちらも気象庁の発表をもとにしたもの)/ 地図:dataofjapan/land(地球地図日本 ©国土地理院)を簡略化 / 震度の色:気象庁の配色</p>
  </section>
  </div></div>`;
  const tab = STABS.find(t => t[0] === sTab) || STABS[0];
  $('settings').querySelectorAll('.sbody>section').forEach(sec => { sec.hidden = !tab[2].includes(sec.id); });
  $('settings').querySelector('.sbody').style.setProperty('--n', tab[3] || tab[2].length);
}
function slDaysCount() { let n = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('ttable:day:')) n++; } } catch (e) {} return n; }
function vocabRecCount() { let n = 0; for (const v of VOCAB) { try { n += Object.keys(JSON.parse(localStorage.getItem('vocabTest.srs.' + v.id)) || {}).length; } catch (e) {} } return n; }
const pad5 = s => { const m = toMin(s); return m == null ? '' : `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
const unpad = s => { const m = toMin(s); return m == null ? '' : `${Math.floor(m / 60)}:${pad(m % 60)}`; };
$('settings').addEventListener('click', e => {
  const t = e.target, rs = () => { saveCfg(); renderSettings(); };
  if (t.id === 'sDone') return closeSettings();
  if (t.id === 'gtSave') { cfg.gtUrl = $('gtUrl').value.trim(); const k = $('gtKeyIn').value.trim(); if (!/^[\w-]{6,64}$/.test(k)) { $('gtMsg').innerHTML = '<span class="ng">合言葉は、英数字・_・- の6〜64文字にしてください</span>'; return; } cfg.gtKey = k; saveCfg(); $('gtMsg').textContent = '読み込み中…'; loadGt().then(() => renderSettings()); return; }
  if (t.id === 'gtOff') { cfg.gtUrl = ''; gtasks = []; store.set('gtasks', gtasks); saveCfg(); renderTodo(); return rs(); }
  if (t.id === 'gtCopy') { navigator.clipboard?.writeText(GT_CODE()).then(() => { t.textContent = 'コピーしました'; }, () => { const r = document.createRange(); r.selectNodeContents($('gtCode')); getSelection().removeAllRanges(); getSelection().addRange(r); }); return; }
  if (t.id === 'soonTest') { closeSettings(); const st = nowMs() + 5 * 60e3; setTimeout(() => showSoon({ kind: 'lead', demo: true, lead: 5, ev: { title: 'テストの予定', start: new Date(st).toISOString(), end: new Date(st + 30 * 60e3).toISOString() }, until: nowMs() + 10e3 }), 300); return; }
  if (t.dataset.leaddel) { cfg.soonLeads = (cfg.soonLeads || []).filter(x => x !== +t.dataset.leaddel); return rs(); }
  if (t.dataset.leadadd) { cfg.soonLeads = [...new Set([...(cfg.soonLeads || []), +t.dataset.leadadd])].sort((a, b) => a - b); return rs(); }
  if (t.id === 'leadAdd') { const n = +$('leadN').value, m = Math.round(n * +$('leadU').value); if (!(n > 0) || m > 7 * 1440) { toast('1分〜7日前の間で入れてください'); return; } cfg.soonLeads = [...new Set([...(cfg.soonLeads || []), m])].sort((a, b) => a - b); return rs(); }
  if (t.id === 'soonUnmute') { soonMuted = {}; store.set('soonMute', soonMuted); return rs(); }
  if (t.id === 'cdAdd') { cfg.countdowns.push({ name: '', date: '' }); return rs(); }
  if (t.dataset.cddel != null) { cfg.countdowns.splice(+t.dataset.cddel, 1); return rs(); }
  if (t.dataset.cdev != null) { cfg.countdowns = cfg.countdowns.filter(c => c.name || c.date); cfg.countdowns.push({ name: t.dataset.cdev, date: t.dataset.cdd2 }); return rs(); }
  if (t.dataset.stab) { sTab = t.dataset.stab; sPlus = null; renderSettings(); $('settings').scrollTop = 0; return; }
  if (t.dataset.boff) { const k = t.dataset.boff; for (const side in cfg.layout) cfg.layout[side] = cfg.layout[side].filter(x => x !== k); saveCfg(); renderLayout(); return renderSettings(); }
  if (t.dataset.bplus) { sPlus = sPlus === t.dataset.bplus ? null : t.dataset.bplus; return renderSettings(); }
  if (t.dataset.bput && sPlus) { const k = sPlus; sPlus = null; cfg.bar = cfg.bar.filter(x => x !== k); cfg.layout[t.dataset.bput].push(k); saveCfg(); renderLayout(); renderChips(); return renderSettings(); }
  if (t.dataset.bbar) { const k = t.dataset.bbar; cfg.bar = cfg.bar.includes(k) ? cfg.bar.filter(x => x !== k) : [...cfg.bar, k]; saveCfg(); renderChips(); return renderSettings(); }
  if (t.dataset.bmv) { const i = cfg.bar.indexOf(t.dataset.k), j = i + +t.dataset.bmv; if (i >= 0 && j >= 0 && j < cfg.bar.length) { [cfg.bar[i], cfg.bar[j]] = [cfg.bar[j], cfg.bar[i]]; saveCfg(); renderChips(); } return renderSettings(); }
  if (t.dataset.openapp) { closeSettings(); openApp(t.dataset.openapp); return; }
  if (t.id === 'editStart') { closeSettings(); enterEdit(); return; }
  if (t.id === 'layoutReset') { if (!confirm('タイルの並びを最初に戻しますか?')) return; cfg.layout = null; fixLayout(); saveCfg(); renderLayout(); renderAll(); return renderSettings(); }
  if (t.dataset.ttday) { ttDay = +t.dataset.ttday; return renderSettings(); }
  if (t.id === 'pAdd') { const P = cfg.days[ttDay].p, last = P[P.length - 1], e0 = last ? toMin(last[1]) + 10 : 530; P.push([fmtMin(e0), fmtMin(e0 + 50)]); return rs(); }
  if (t.id === 'pDel') { cfg.days[ttDay].p.pop(); return rs(); }
  if (t.id === 'preAdd') { (cfg.days[ttDay].pre = cfg.days[ttDay].pre || []).push(['', '', '']); return rs(); }
  if (t.dataset.predel != null) { cfg.days[ttDay].pre.splice(+t.dataset.predel, 1); return rs(); }
  if (t.id === 'tdAdd') {
    const text = $('tdText').value.trim(); if (!text) return;
    todos.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: text.slice(0, 40), bring: $('tdBring').checked, due: $('tdDue').value || '', done: false });
    saveTodos(); renderSettings(); setTimeout(() => $('tdText').focus(), 0); return;
  }
  if (t.dataset.tddel) { todos = todos.filter(x => x.id !== t.dataset.tddel); saveTodos(); return renderSettings(); }
  if (t.id === 'useGps') {
    $('gpsMsg').textContent = '位置を取得中…';
    if (!navigator.geolocation) { $('gpsMsg').textContent = 'この端末では位置情報を使えません。都道府県を選んでください。'; return; }
    navigator.geolocation.getCurrentPosition(p => {
      const lat = +p.coords.latitude.toFixed(3), lon = +p.coords.longitude.toFixed(3);
      cfg.loc = { lat, lon, pref: prefAt(lat, lon) || '', how: 'gps' }; saveCfg(); loadWeather(); renderSettings();
    }, err => {
      // iPad の Safari は、一度「許可しない」にしたり端末の設定でオフだったりすると、確認の画面を出さずにすぐ失敗する
      const why = err.code === 1 ? '位置情報が許可されていません。iPad の「設定」→「プライバシーとセキュリティ」→「位置情報サービス」をオンにして、その中の「Safari Webサイト」を「使用中のみ」にしてください。それでも出ないときは、Safari のアドレスバーの「ぁあ」(または「AA」)→「Webサイトの設定」→「位置情報」を「確認」か「許可」にして、ページを読み直してください。ホーム画面から開いている場合は、Safari で開き直すと確認が出ることがあります。'
        : err.code === 3 ? '位置を取るのに時間がかかりすぎました。もう一度押してみてください。' : '位置を取得できませんでした(位置情報サービスがオフ、または電波・Wi-Fi の状態が悪いことがあります)。';
      $('gpsMsg').textContent = why + ' うまくいかないときは、下で都道府県を選んでください。';
    }, { enableHighAccuracy: false, timeout: 20000, maximumAge: 600000 });
    return;
  }
  if (t.id === 'gasTest') { cfg.gasUrl = $('gasUrl').value.trim(); saveCfg(); $('gasMsg').textContent = '読み込み中…'; loadEvents().then(() => { $('gasMsg').innerHTML = eventsErr ? `<span class="ng">読めませんでした:${esc(eventsErr)}</span>` : `<span class="ok">${events ? events.length : 0}件 読み込みました</span>`; }); return; }
  if (t.id === 'gasCopy') { navigator.clipboard?.writeText(GAS_CODE).then(() => { t.textContent = 'コピーしました'; }, () => { const r = document.createRange(); r.selectNodeContents($('gasCode')); getSelection().removeAllRanges(); getSelection().addRange(r); }); return; }
  if (t.dataset.demo) { const k = t.dataset.demo; try { unlockAudio(); } catch (err) {} closeSettings(); toast(`地震のデモを始めます(${t.textContent})`); setTimeout(() => k === 'info' || k === 'infofull' ? demoInfo(k === 'infofull') : demoEEW(k), 300); return; }
  if (t.id === 'soundTest') { unlockAudio(); setTimeout(soundAlarm, 100); return; }
});
$('settings').addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'theme') cfg.theme = t.value;
  else if (t.id === 'lightFrom') cfg.lightFrom = t.value;
  else if (t.id === 'darkFrom') cfg.darkFrom = t.value;
  else if (t.id === 'showSec') cfg.showSec = t.checked;
  else if (t.id === 'shiftOn') { cfg.shift = t.checked; fit(); }
  else if (t.dataset.gtl) { const id = t.dataset.gtl; cfg.gtHide = t.checked ? (cfg.gtHide || []).filter(x => x !== id) : [...(cfg.gtHide || []), id]; saveCfg(); renderTodo(); return; }
  else if (t.id === 'soonOn') cfg.soonOn = t.checked;
  else if (t.id === 'soonStart') cfg.soonStart = t.checked;
  else if (t.id === 'soonBeep') cfg.soonBeep = t.checked;
  else if (t.dataset.lead) { const v = +t.dataset.lead; cfg.soonLeads = t.checked ? [...new Set([...(cfg.soonLeads || []), v])].sort((a, b) => a - b) : (cfg.soonLeads || []).filter(x => x !== v); }
  else if (t.id === 'dimOn') cfg.dimOn = t.checked;
  else if (t.id === 'dimFrom') cfg.dimFrom = unpad(t.value);
  else if (t.id === 'dimTo') cfg.dimTo = unpad(t.value);
  else if (t.id === 'dimLv') cfg.dimLv = +t.value;
  else if (t.dataset.tts != null || t.dataset.ttr != null) {
    const i = +(t.dataset.tts ?? t.dataset.ttr), arr = cfg.tt[ttDay] = cfg.tt[ttDay] || [];
    arr[i] = Object.assign({ s: '', r: '' }, arr[i]); arr[i][t.dataset.tts != null ? 's' : 'r'] = t.value.trim().slice(0, 20);
  }
  else if (t.dataset.ps != null) cfg.days[ttDay].p[+t.dataset.ps][0] = unpad(t.value);
  else if (t.dataset.pe != null) cfg.days[ttDay].p[+t.dataset.pe][1] = unpad(t.value);
  else if (t.dataset.pren != null) cfg.days[ttDay].pre[+t.dataset.pren][0] = t.value.trim().slice(0, 12);
  else if (t.dataset.pres != null) cfg.days[ttDay].pre[+t.dataset.pres][1] = unpad(t.value);
  else if (t.dataset.pree != null) cfg.days[ttDay].pre[+t.dataset.pree][2] = unpad(t.value);
  else if (t.id === 'postN' || t.id === 'postS' || t.id === 'postE') { const P = cfg.days[ttDay].post = cfg.days[ttDay].post || ['', '', '']; if (t.id === 'postN') P[0] = t.value.trim().slice(0, 12); else P[t.id === 'postS' ? 1 : 2] = unpad(t.value); }
  else if (t.dataset.satw) { const n = +t.dataset.satw; cfg.satWeeks = t.checked ? [...new Set([...(cfg.satWeeks || []), n])].sort() : (cfg.satWeeks || []).filter(x => x !== n); }
  else if (t.dataset.cdn != null) cfg.countdowns[+t.dataset.cdn].name = t.value.trim().slice(0, 12);
  else if (t.dataset.cdd != null) cfg.countdowns[+t.dataset.cdd].date = t.value;
  else if (t.id === 'prefSel' && t.value) { const p = JAPAN.find(x => x.name === t.value); cfg.loc = { lat: +p.c[1].toFixed(3), lon: +p.c[0].toFixed(3), pref: p.name, how: 'pref' }; saveCfg(); loadWeather(); renderSettings(); return; }
  else if (t.id === 'qFull') cfg.qFull = +t.value;
  else if (t.id === 'qiPref') cfg.qiPref = +t.value;
  else if (t.id === 'qiMax') cfg.qiMax = +t.value;
  else if (t.id === 'qiMag') cfg.qiMag = +t.value;
  else if (t.id === 'qiTsunami') cfg.qiTsunami = t.checked;
  else if (t.id === 'qBeep') cfg.qBeep = +t.value;
  else if (t.dataset.tcat) { const c = t.dataset.tcat; cfg.termCats = t.checked ? [...new Set([...cfg.termCats, c])] : cfg.termCats.filter(x => x !== c); termCur = null; }
  else return;
  saveCfg(); applyTheme();
});

/* ================= 動かす ================= */
// 思わぬエラーが起きたら画面の下に出す(原因を伝えてもらえるように)
addEventListener('error', e => toast(`エラー: ${e.message || e} (${(e.filename || '').split('/').pop()}:${e.lineno || '?'}) v${APP_VERSION}`));
addEventListener('unhandledrejection', e => { const m = String(e.reason && e.reason.message || e.reason || ''); if (!/fetch|network|Load failed|abort/i.test(m)) toast(`エラー: ${m} v${APP_VERSION}`); });
let lastMin = -1;
function tick(force) {
  const d = now();
  if (eew && $('eew').hidden === false) { /* 地震の全画面は eewTick が描く */ }
  const st = renderClock();
  if (force || d.getMinutes() !== lastMin) {
    lastMin = d.getMinutes();
    applyTheme(); renderTT(st); renderTodo(); renderSched(); renderChips();
    if (slotMode && nowMs() - slotTouched > 60e3) closeSlot();
    if ((fullTile || fullK) && fullKey() !== 'clock' && nowMs() - fullTouched > 180e3) closeFull(); // 時計以外は3分さわらなければ戻る
    else if (fullK && !['terms', 'kioku', 'timer'].includes(fullK) && !(fullK === 'weather' && fs.wmode === 'radar') && !$('fullBody').contains(document.activeElement)) renderFullView();
    if (!kioku.shown && !editing) { renderSlot(); renderTiles(); requestAnimationFrame(fitClock); }
    if (d.getMinutes() % 30 === 0) loadWeather();
    if (d.getMinutes() % 10 === 5) loadEvents();
    if (d.getMinutes() % 5 === 2) loadGt();
    if (d.getMinutes() % 2 === 0) renderWeather();
  }
}
// 夜は暗くする(焼き付き防止・節電)。さわると1分だけ明るく戻る。地震の表示中は暗くしない
let dimWake = 0;
function inDim() {
  if (!cfg.dimOn) return false;
  const m = minOfDay(now()), a = toMin(cfg.dimFrom), b = toMin(cfg.dimTo);
  if (a == null || b == null || a === b) return false;
  return a < b ? m >= a && m < b : m >= a || m < b;
}
function updateDim() {
  const on = inDim() && nowMs() > dimWake && !fullMode && !soonCur && $('qb').hidden && $('settings').hidden && $('appView').hidden;
  const D = $('dim'); D.hidden = !on; if (on) D.style.opacity = (cfg.dimLv || 70) / 100;
}
addEventListener('pointerdown', () => { if (!$('dim').hidden || inDim()) { dimWake = nowMs() + 60e3; updateDim(); } }, { capture: true });
setInterval(() => { updateDim(); if (!document.body.classList.contains('portrait') && cfg.shift && Math.floor(Date.now() / 1000) % 180 === 0) fit(); }, 1000);
function loop() { tick(false); setTimeout(loop, 1000 - (Date.now() % 1000) + 5); }
setInterval(eewTick, 250);
setInterval(pollQuake, 60e3);

fit(); applyTheme(); renderStatus();
renderLayout(); renderAll();
loadWeather(); loadEvents(); loadGt(); loadVocab(); pollQuake(); checkVersion(); requestWake();
connectEEW();
loop();
// 地震のデモを URL で始められる(確認用): ?demo=strong / weak / far / info / infofull
{ const dm = new URLSearchParams(location.search).get('demo'); if (dm) setTimeout(() => dm === 'info' || dm === 'infofull' ? demoInfo(dm === 'infofull') : demoEEW(dm), 1500); }
</script>
</body>
</html>
