<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyLine 音のお試し</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --panel-2: #eef0f3; --text: #16181d; --sub: #646b76; --line: #e1e4e9;
  --accent: #0b7a53; --accent-text: #fff; --board: #12161c; --board-text: #f5b301;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1013; --panel: #171a1f; --panel-2: #20242b; --text: #e9ecf1; --sub: #9aa3af; --line: #2a2f37; --accent: #2fb57f; --accent-text: #06140e; --board: #080a0d; }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-tap-highlight-color: transparent;
}
header { background: var(--board); color: #e8ecf2; padding: calc(14px + env(safe-area-inset-top)) 16px 14px; }
header h1 { margin: 0; font-size: 18px; letter-spacing: 0.06em; }
header p { margin: 4px 0 0; font-size: 13px; color: #9aa6b4; }
main { max-width: 720px; margin: 0 auto; padding: 12px 16px 40px; display: grid; gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.card h2 { margin: 0 0 8px; font-size: 14px; color: var(--sub); letter-spacing: 0.06em; }
button, input { font: inherit; color: inherit; }
button {
  min-height: 44px; min-width: 44px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel-2); padding: 0 14px; touch-action: manipulation; cursor: pointer;
}
button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 700; }
.sound { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px dashed var(--line); }
.sound:first-of-type { border-top: none; }
.sound button { grid-row: span 2; min-width: 64px; }
.sound b { font-size: 16px; }
.sound span { font-size: 13px; color: var(--sub); }
.sound.playing button { background: var(--board-text); color: #2a1f00; border-color: transparent; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.note { font-size: 13px; color: var(--sub); margin: 8px 0 0; }
.filebox { margin-top: 8px; padding: 10px; border-radius: 10px; background: var(--panel-2); font-size: 14px; word-break: break-all; }
.filebox:empty { display: none; }
#trim { margin-top: 10px; display: grid; gap: 10px; }
#trim[hidden] { display: none; }
#wave { width: 100%; height: 90px; border-radius: 10px; background: var(--panel-2); touch-action: manipulation; cursor: pointer; display: block; }
.trim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.trim-grid label { display: grid; gap: 4px; font-size: 13px; color: var(--sub); }
.trim-grid b { color: var(--text); font-size: 16px; }
.trim-grid input { width: 100%; min-width: 0; }
.num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>StudyLine 音のお試し</h1>
  <p>区切りの音の候補です。気に入った番号を教えてください(休憩に入る・作業再開・時間切れで別々でもOK)</p>
</header>
<main>
  <section class="card">
    <h2>音量</h2>
    <div class="row">
      <span>🔈</span><input type="range" id="vol" min="0" max="100" value="70" aria-label="音量"><span>🔊</span>
      <button id="stop">■ 止める</button>
    </div>
    <p class="note">iPhone・iPad は消音モード(サイレント)だと鳴らないことがあります。</p>
  </section>

  <section class="card" id="timerList">
    <h2>⏱ タイマー系の音(新しく追加)</h2>
  </section>

  <section class="card" id="list">
    <h2>その他の音(前回の候補。番号は 9 から)</h2>
  </section>

  <section class="card">
    <h2>手持ちの音声ファイルを使う(試作)</h2>
    <div class="row">
      <button class="primary" id="pick">🎵 ファイルを選ぶ</button>
    </div>
    <input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg" hidden>
    <div class="filebox" id="fileInfo"></div>
    <div id="trim" hidden>
      <canvas id="wave" height="90" aria-label="波形。タップした場所から使う"></canvas>
      <div class="trim-grid">
        <label>使い始め <b class="num" id="startTxt">0:00.0</b>
          <input type="range" id="startR" min="0" max="0" step="0.1" value="0"></label>
        <label>長さ <b class="num" id="lenTxt">5.0 秒</b>
          <input type="range" id="lenR" min="1" max="10" step="0.5" value="5"></label>
      </div>
      <div class="row">
        <button id="nudgeBack">−0.5秒</button>
        <button id="nudgeFwd">+0.5秒</button>
        <button class="primary" id="playRange" style="flex:1">▶ 範囲を再生</button>
      </div>
      <div class="filebox num" id="rangeTxt"></div>
    </div>
    <p class="note">波形をタップすると、その場所から使います。長さは最大10秒です。iPhone・iPad では「ファイル」アプリの中の mp3 / m4a / wav などを選べます。ここでは試しに鳴らすだけで、どこにも保存・送信しません。</p>
  </section>
</main>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
let ctx = null, master = null, playingEl = null, stopTimer = null;
const live = []; // 鳴っている音(止めるため)

function audio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.connect(ctx.destination);
  }
  if (ctx.state !== 'running') ctx.resume();
  master.gain.value = Math.pow($('vol').value / 100, 2);
  return ctx;
}
// 1音: f=周波数, t=開始(秒), d=長さ, type=波形, v=音量, partials=倍音 [倍率, 音量]
function tone({ f, t, d, type = 'sine', v = 0.35, attack = 0.01, partials = [[1, 1]] }) {
  const c = audio(), st = c.currentTime + 0.05 + t;
  for (const [mul, pv] of partials) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f * mul;
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v * pv), st + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, st + d);
    o.connect(g); g.connect(master);
    o.start(st); o.stop(st + d + 0.05);
    live.push(o);
  }
}
const BELL = [[1, 1], [2.76, 0.45], [5.4, 0.25], [8.9, 0.12]];
const SOFT = [[1, 1], [2, 0.3], [3, 0.12]];
const N = { C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880, B5: 987.77, C6: 1046.5, D6: 1174.7, E6: 1318.5, G4: 392, A4: 440, B4: 493.88, E4: 329.63, C4: 261.63 };

// 候補(長さ=秒)。group: 'timer' はタイマーらしい音、'other' はその他
const BEEP = (f, t, d, v = 0.14, type = 'square') => tone({ f, t, d, type, v, attack: 0.004 });
const TIMER_SOUNDS = [
  { name: 'キッチンタイマー', desc: 'ピピピピッ × 3セット', len: 2.6,
    play: () => { for (let r = 0; r < 3; r++) for (let i = 0; i < 4; i++) BEEP(2400, r * 0.85 + i * 0.1, 0.07); } },
  { name: 'デジタル腕時計', desc: 'ピピッ・ピピッ × 4', len: 2.2,
    play: () => { for (let r = 0; r < 4; r++) { BEEP(4000, r * 0.5, 0.05, 0.1); BEEP(4000, r * 0.5 + 0.09, 0.05, 0.1); } } },
  { name: '時報', desc: 'ピッ・ピッ・ピッ・ポーン', len: 4.0,
    play: () => { [0, 1, 2].forEach(i => tone({ f: 440, t: i, d: 0.15, v: 0.4 })); tone({ f: 880, t: 3, d: 1.0, v: 0.4 }); } },
  { name: '試験終了ブザー', desc: 'ブーーッ(低くて長い)', len: 1.8,
    play: () => { tone({ f: 220, t: 0, d: 1.5, type: 'sawtooth', v: 0.16, attack: 0.02 }); tone({ f: 223, t: 0, d: 1.5, type: 'square', v: 0.08, attack: 0.02 }); } },
  { name: '電子レンジ風', desc: 'ピー・ピー・ピー(長め)', len: 2.2,
    play: () => [0, 0.7, 1.4].forEach(t => BEEP(1600, t, 0.45, 0.12)) },
  { name: 'ストップウォッチ', desc: 'ピッ×4 → ピーーッ', len: 2.2,
    play: () => { [0, 0.3, 0.6, 0.9].forEach(t => BEEP(3000, t, 0.06, 0.12)); BEEP(3000, 1.2, 0.8, 0.12); } },
  { name: 'アラーム(連続)', desc: 'ピピピピ…を速く長めに(気づきやすい)', len: 3.2,
    play: () => { for (let r = 0; r < 4; r++) for (let i = 0; i < 6; i++) BEEP(2600, r * 0.8 + i * 0.075, 0.05, 0.13); } },
  { name: 'カウントダウン', desc: 'ピッ×5(1秒ごと)→ ピーー', len: 6.5,
    play: () => { for (let i = 0; i < 5; i++) BEEP(1000, i, 0.12, 0.13, 'sine'); BEEP(1000, 5, 1.2, 0.13, 'sine'); } }
];
const SOUNDS = [
  { name: '今の音(作業再開)', desc: 'ド・ミ・ソ・ドの上昇4音', len: 1.4,
    play: () => [N.C5, N.E5, N.G5, N.C6].forEach((f, i) => tone({ f, t: i * 0.3, d: 0.26, v: 0.4 })) },
  { name: '今の音(休憩)', desc: '高・低の交互4音', len: 1.4,
    play: () => [880, 660, 880, 660].forEach((f, i) => tone({ f, t: i * 0.3, d: 0.26, v: 0.4 })) },
  { name: '発車ベル', desc: '駅のジリジリ鳴るベル風(2秒)', len: 2.2,
    play: () => { for (let i = 0; i < 40; i++) tone({ f: 2100 + (i % 2) * 90, t: i * 0.05, d: 0.06, type: 'square', v: 0.12, attack: 0.003 }); } },
  { name: '発車メロディ風', desc: '明るい短いメロディ', len: 2.4,
    play: () => [[N.E5, 0], [N.G5, 0.2], [N.C6, 0.4], [N.B5, 0.7], [N.G5, 0.9], [N.A5, 1.1], [N.C6, 1.4]].forEach(([f, t]) => tone({ f, t, d: 0.6, v: 0.3, partials: SOFT })) },
  { name: '車内チャイム', desc: 'ピン・ポン・パン(上昇3音)', len: 1.8,
    play: () => [N.G5, N.C6, N.E6].forEach((f, i) => tone({ f, t: i * 0.32, d: 1.0, v: 0.3, partials: BELL })) },
  { name: '学校チャイム', desc: 'キーンコーンカーンコーン', len: 3.4,
    play: () => [N.E5, N.C5, N.D5, N.G4, N.G4, N.D5, N.E5, N.C5].forEach((f, i) => tone({ f, t: i * 0.42 - (i >= 4 ? 0 : 0), d: 0.9, v: 0.28, partials: BELL })) },
  { name: 'ピンポン', desc: '玄関チャイムの2音', len: 1.6,
    play: () => { tone({ f: N.E5, t: 0, d: 1.0, v: 0.35, partials: SOFT }); tone({ f: N.C5, t: 0.45, d: 1.2, v: 0.35, partials: SOFT }); } },
  { name: '電子アラーム', desc: 'ピピピピッ×2(時間切れ向き)', len: 1.6,
    play: () => { for (let r = 0; r < 2; r++) for (let i = 0; i < 4; i++) tone({ f: 2000, t: r * 0.8 + i * 0.12, d: 0.08, type: 'square', v: 0.12, attack: 0.003 }); } },
  { name: '目覚まし', desc: '高低を速く繰り返す(強め)', len: 2.0,
    play: () => { for (let i = 0; i < 16; i++) tone({ f: i % 2 ? 1400 : 1800, t: i * 0.11, d: 0.1, type: 'triangle', v: 0.3, attack: 0.003 }); } },
  { name: '木琴', desc: 'ポロロン(やわらかい)', len: 1.6,
    play: () => [N.C5, N.E5, N.G5, N.C6, N.E6].forEach((f, i) => tone({ f, t: i * 0.09, d: 0.7, type: 'triangle', v: 0.35, attack: 0.004 })) },
  { name: 'ソフトベル', desc: 'チーン(静かな部屋向き)', len: 2.6,
    play: () => tone({ f: N.A5, t: 0, d: 2.5, v: 0.35, partials: BELL }) },
  { name: 'ファンファーレ', desc: '全部終わったとき向き', len: 2.0,
    play: () => [[N.C5, 0, 0.15], [N.C5, 0.17, 0.15], [N.C5, 0.34, 0.15], [N.G5, 0.55, 0.9]].forEach(([f, t, d]) => { tone({ f, t, d: d + 0.2, type: 'sawtooth', v: 0.12 }); tone({ f: f * 1.5, t, d: d + 0.2, type: 'sawtooth', v: 0.06 }); }) }
];

function stopAll() {
  while (live.length) { try { live.pop().stop(); } catch (e) {} }
  if (playingEl) playingEl.classList.remove('playing');
  playingEl = null; clearTimeout(stopTimer);
}

// 番号は タイマー系 1〜8、その他 9〜(前回のお試しの番号 1〜12 は 9〜20 になる)
const ALL = [...TIMER_SOUNDS, ...SOUNDS];
const item = (s, i) => `<div class="sound" id="s${i}"><button data-i="${i}" aria-label="${s.name}を再生">▶ ${i + 1}</button><b>${i + 1}. ${s.name}</b><span>${s.desc}</span></div>`;
$('timerList').insertAdjacentHTML('beforeend', TIMER_SOUNDS.map((s, i) => item(s, i)).join(''));
$('list').insertAdjacentHTML('beforeend', SOUNDS.map((s, i) => item(s, i + TIMER_SOUNDS.length)).join(''));
document.addEventListener('click', e => {
  const b = e.target.closest('[data-i]');
  if (!b) return;
  stopAll();
  const s = ALL[+b.dataset.i];
  s.play();
  playingEl = b.parentElement; playingEl.classList.add('playing');
  stopTimer = setTimeout(() => { if (playingEl) playingEl.classList.remove('playing'); playingEl = null; }, s.len * 1000);
});
$('stop').addEventListener('click', stopAll);
$('vol').addEventListener('input', () => { if (master) master.gain.value = Math.pow($('vol').value / 100, 2); });

// 手持ちのファイル: その場で読み込み、選んだ範囲(最大10秒)だけ鳴らす。保存・送信はしない
let buf = null, peaks = null;
const fmtT = x => `${Math.floor(x / 60)}:${(x % 60).toFixed(1).padStart(4, '0')}`;
function decode(arr) {
  const c = audio();
  return new Promise((res, rej) => { const pr = c.decodeAudioData(arr, res, rej); if (pr && pr.then) pr.then(res, rej); });
}
function range() {
  const len = Math.min(+$('lenR').value, buf.duration);
  const start = Math.min(+$('startR').value, Math.max(0, buf.duration - len));
  return { start, len };
}
function drawWave() {
  const cv = $('wave'), dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  if (!buf) return;
  const { start, len } = range(), dur = buf.duration;
  const css = getComputedStyle(document.documentElement);
  g.fillStyle = css.getPropertyValue('--board-text') || '#f5b301'; g.globalAlpha = 0.25;
  g.fillRect(start / dur * w, 0, len / dur * w, h); g.globalAlpha = 1;
  g.fillStyle = css.getPropertyValue('--sub') || '#888';
  const n = peaks.length;
  for (let i = 0; i < n; i++) { const x = i / n * w, ph = Math.max(1, peaks[i] * (h - 8)); g.fillRect(x, (h - ph) / 2, Math.max(1, w / n - 0.5), ph); }
  g.fillStyle = css.getPropertyValue('--accent') || '#0b7a53';
  g.fillRect(start / dur * w - 1, 0, 3, h); g.fillRect((start + len) / dur * w - 1, 0, 3, h);
}
function update() {
  if (!buf) return;
  const { start, len } = range();
  $('startR').value = start;
  $('startTxt').textContent = fmtT(start);
  $('lenTxt').textContent = len.toFixed(1) + ' 秒';
  $('rangeTxt').textContent = `使う範囲: ${fmtT(start)} 〜 ${fmtT(start + len)}(${len.toFixed(1)} 秒)`;
  drawWave();
}
$('pick').addEventListener('click', () => { $('file').value = ''; $('file').click(); });
$('file').addEventListener('change', async () => {
  const f = $('file').files[0];
  if (!f) return;
  stopAll(); buf = null; $('trim').hidden = true;
  $('fileInfo').textContent = `${f.name} を読み込み中…`;
  try {
    buf = await decode(await f.arrayBuffer());
    const ch = buf.getChannelData(0), n = 300, step = Math.floor(ch.length / n) || 1;
    peaks = new Float32Array(n); let mx = 0;
    for (let i = 0; i < n; i++) { let m = 0; for (let j = i * step; j < Math.min(ch.length, (i + 1) * step); j += 16) m = Math.max(m, Math.abs(ch[j])); peaks[i] = m; mx = Math.max(mx, m); }
    if (mx > 0) for (let i = 0; i < n; i++) peaks[i] /= mx;
    $('fileInfo').textContent = `${f.name}(${(f.size / 1024 / 1024).toFixed(2)} MB・${buf.duration.toFixed(1)} 秒)`;
    $('startR').max = Math.max(0, buf.duration - 1).toFixed(1); $('startR').value = 0;
    $('lenR').max = Math.min(10, Math.max(1, Math.floor(buf.duration * 2) / 2)); $('lenR').value = Math.min(5, $('lenR').max);
    $('trim').hidden = false; update();
  } catch (e) { $('fileInfo').textContent = `${f.name}: この端末では読み込めない形式でした`; }
});
$('startR').addEventListener('input', update);
$('lenR').addEventListener('input', update);
$('nudgeBack').addEventListener('click', () => { $('startR').value = Math.max(0, +$('startR').value - 0.5); update(); });
$('nudgeFwd').addEventListener('click', () => { $('startR').value = Math.min(+$('startR').max, +$('startR').value + 0.5); update(); });
$('wave').addEventListener('click', e => {
  if (!buf) return;
  const r = $('wave').getBoundingClientRect();
  $('startR').value = ((e.clientX - r.left) / r.width * buf.duration).toFixed(1);
  update();
});
window.addEventListener('resize', drawWave);
$('playRange').addEventListener('click', () => {
  if (!buf) return;
  stopAll();
  const c = audio(), { start, len } = range();
  const src = c.createBufferSource(), g = c.createGain(), t0 = c.currentTime + 0.03;
  src.buffer = buf; src.connect(g); g.connect(master);
  // 切り口で「プツッ」と鳴らないよう、最初と最後を少しだけフェード
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(1, t0 + 0.03);
  g.gain.setValueAtTime(1, t0 + len - 0.08); g.gain.linearRampToValueAtTime(0, t0 + len);
  src.start(t0, start, len);
  live.push(src);
});
})();
</script>
</body>
</html>
