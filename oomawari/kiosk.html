<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>大回りジェネレータ 券売機モード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500&display=swap">
<style>
/* 券売機モード(あそび): 1280×1024 の画面を作り、端末の大きさに合わせて拡大縮小する */
html,body{height:100%;margin:0;background:#000;overflow:hidden}
html,body{position:fixed;left:0;top:0;width:100%} /* 1280px の画面がはみ出しても、スマホが表示を広げないようにする */
#rot{position:fixed;right:8px;bottom:8px;z-index:9;display:none;padding:8px 12px;border:1px solid #666;border-radius:18px;background:#222;color:#EEE;font-size:13px;opacity:.8}
body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:1280px;height:1024px;transform-origin:0 0}
@keyframes prt{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.prt{animation:prt 2.2s steps(22) both}
</style>
</head>
<body>
<div id="stage"></div>
<button type="button" id="rot" aria-label="画面の向きを切りかえる">↻ 画面を回す</button>
<!-- 画面のひな形。{{名前}} に下の renderVals() の値が入り、sc-if は出す/出さない、sc-for はくり返し。 -->
<template id="tpl">
<div style="position: relative; isolation: isolate; width: 1280px; height: 1024px; overflow: hidden; background: #DCDCDC; color: #111111; font-family: 'BIZ UDPGothic', sans-serif; line-height: 1.35; display: flex; flex-direction: column; filter: {{root}}">

<sc-if value="{{grayTop}}">
<div style="height: 140px; flex-shrink: 0; padding: 0 40px; background: #ABABAB; display: flex; align-items: center; justify-content: space-between"><span style="font-size: 20px; font-weight: 700; color: #333333">大回りジェネレータ　券売機モード（あそび）<span style="margin-left: 12px; font-size: 16px; font-weight: 400">v{{ver}}</span></span><a href="index.html" style="height: 64px; padding: 0 20px; box-sizing: border-box; background: linear-gradient(#6E6E6E 0%, #4A4A4A 8%, #3C3C3C 50%, #2E2E2E 90%, #0A0A0A 100%); border: 2px solid #000000; border-radius: 10px; color: #FFFFFF; font-size: 22px; text-decoration: none; display: flex; align-items: center">アプリに戻る</a></div>
</sc-if>
<sc-if value="{{blackTop}}">
<div style="height: 140px; flex-shrink: 0; padding: 0 20px 0 12px; background: repeating-linear-gradient(#000000 0 2px, #1C1C1C 2px 4px); color: #FFFFFF; display: flex; align-items: center; gap: 20px; box-shadow: 0 2px 0 #9A9A9A">
<h1 style="flex-grow: 1; margin: 0; font-size: 44px; font-weight: 400; line-height: 1.2">{{h1}}<span style="color: #FFF27A; font-weight: 700">{{h2}}</span>{{h3}}<br>{{h4}}</h1>
<sc-if value="{{showSumBtn}}"><button type="button" sc-camel-on-click="{{openSum}}" style="width: 118px; height: 68px; border: 3px solid #FFFFFF; border-radius: 12px; background: #3C3C3C; color: #FFFFFF; font-size: 16px; line-height: 1.2">ここまでの<br>入力内容</button></sc-if>
</div>
<p style="height: 34px; flex-shrink: 0; margin: 0; padding: 4px 6px 0; box-sizing: border-box; color: #E00000; font-size: 20px">{{note}}</p>
</sc-if>

<div style="flex-grow: 1; min-height: 0; position: relative; display: flex; flex-direction: column">

<sc-if value="{{s0}}">
<div style="flex-grow: 1; background: #FFFFFF; padding: 50px 74px 0; display: flex; flex-direction: column; gap: 56px">
<button type="button" sc-camel-on-click="{{buy0}}" style="height: 204px; background: linear-gradient(#6E6E6E 0%, #4A4A4A 8%, #3C3C3C 50%, #2E2E2E 90%, #0A0A0A 100%); border: 2px solid #000000; border-radius: 10px; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px"><span style="font-size: 60px; font-weight: 700">きっぷを買う</span><span style="width: 88%; height: 1px; background: #CCCCCC"></span><span style="font-size: 34px">大回り用の乗車券・特急券</span></button>
<a href="index.html#/saved" style="width: 550px; height: 118px; box-sizing: border-box; background: linear-gradient(#FFFFFF 0%, #F4F4F4 55%, #DADADA 90%, #B4B4B4 100%); border: 3px solid #111111; border-radius: 12px; color: #111111; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 32px; font-weight: 700">保存したルートを見る</span><span style="font-size: 22px">アプリで作ったルート</span></a>
</div>
</sc-if>

<sc-if value="{{s1}}">
<div style="flex-grow: 1; background: #FFFFFF; padding: 50px 74px 0; display: flex; flex-direction: column">
<button type="button" sc-camel-on-click="{{search0}}" style="height: 204px; background: linear-gradient(#6E6E6E 0%, #4A4A4A 8%, #3C3C3C 50%, #2E2E2E 90%, #0A0A0A 100%); border: 2px solid #000000; border-radius: 10px; color: #FFFFFF; padding: 0 46px; display: flex; flex-direction: column; justify-content: center; gap: 10px; text-align: left">
<span style="display: flex; align-items: center; gap: 30px"><svg aria-hidden="true" width="64" height="72" sc-camel-view-box="0 0 24 27" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><circle cx="10" cy="10" r="7.5"></circle><path d="M15.5 16l6 8"></path></svg><span style="font-size: 54px; font-weight: 700">大回り検索<span style="font-size: 40px">　から購入</span></span></span>
<span style="width: 100%; height: 1px; background: #CCCCCC"></span>
<span style="padding-left: 94px; font-size: 34px">出発駅・到着駅と条件を指定して検索</span></button>
<p style="margin: 52px 0 10px; width: 840px; padding: 8px 20px; box-sizing: border-box; border-radius: 999px; background: #BEDDE0; font-size: 26px; font-weight: 700">そのほかの買い方</p>
<div style="display: flex; gap: 30px">
<button type="button" sc-camel-on-click="{{saved0}}" style="width: 540px; height: 118px; background: linear-gradient(#FFFFFF 0%, #F4F4F4 55%, #DADADA 90%, #B4B4B4 100%); border: 3px solid #111111; border-radius: 12px; color: #111111; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 32px; font-weight: 700">保存したルートから購入</span><span style="font-size: 20px">アプリで作った大回りルート</span></button>
<button type="button" sc-camel-on-click="{{normal0}}" style="width: 540px; height: 118px; background: linear-gradient(#FFFFFF 0%, #F4F4F4 55%, #DADADA 90%, #B4B4B4 100%); border: 3px solid #111111; border-radius: 12px; color: #111111; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 32px; font-weight: 700">ふつうの経路で購入</span><span style="font-size: 20px">いちばん早い経路で検索（JR線のみ）</span></button>
</div>
</div>
</sc-if>

<sc-if value="{{s2}}">
<div style="flex-grow: 1; padding: 30px 64px 0; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{fromUnset}}"><div style="height: 80px; border: 2px solid #9A9A9A; background: #FFFFFF; display: flex"><span style="width: 196px; flex-shrink: 0; padding: 0 0 6px 8px; box-sizing: border-box; background: #EDEDED; font-size: 32px; display: flex; align-items: flex-end">出発駅</span><span style="flex-grow: 1; padding-left: 40px; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 46px; color: #1450E0; display: flex; align-items: center; gap: 20px">出発駅を指定してください<span aria-hidden="true" style="font-size: 36px; letter-spacing: -0.3em">▶▶▶</span></span></span><span style="width: 166px; flex-shrink: 0; border-left: 2px solid #9A9A9A; background: #DCDCDC; display: flex; align-items: center; justify-content: center"><button type="button" sc-camel-on-click="{{openFrom}}" style="width: 128px; height: 62px; background: linear-gradient(#55A8FF 0%, #1170F0 50%, #0058E0 52%, #0044B8 100%); border: 2px solid #001E60; border-radius: 10px; color: #FFFFFF; font-size: 32px">入 力</button></span></div></sc-if>
<sc-if value="{{fromSet}}"><div style="height: 80px; border: 2px solid #9A9A9A; background: #FFFFFF; display: flex"><span style="width: 196px; flex-shrink: 0; padding: 0 0 6px 8px; box-sizing: border-box; background: #EDEDED; font-size: 32px; display: flex; align-items: flex-end">出発駅</span><span style="flex-grow: 1; padding-left: 40px; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 36px; font-weight: 700; color: #0A6A0A">{{fromName}}</span></span><span style="width: 166px; flex-shrink: 0; border-left: 2px solid #9A9A9A; background: #DCDCDC; display: flex; align-items: center; justify-content: center"><button type="button" sc-camel-on-click="{{openFrom}}" style="width: 128px; height: 62px; background: linear-gradient(#6E6E6E 0%, #4A4A4A 8%, #3C3C3C 50%, #2E2E2E 90%, #0A0A0A 100%); border: 2px solid #000000; border-radius: 10px; color: #FFFFFF; font-size: 32px">変 更</button></span></div></sc-if>
<sc-if value="{{toUnset}}"><div style="height: 80px; border: 2px solid #9A9A9A; background: #FFFFFF; display: flex"><span style="width: 196px; flex-shrink: 0; padding: 0 0 6px 8px; box-sizing: border-box; background: #EDEDED; font-size: 32px; display: flex; align-items: flex-end">到着駅</span><span style="flex-grow: 1; padding-left: 40px; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 46px; color: #1450E0; display: flex; align-items: center; gap: 20px">到着駅を指定してください<span aria-hidden="true" style="font-size: 36px; letter-spacing: -0.3em">▶▶▶</span></span></span><span style="width: 166px; flex-shrink: 0; border-left: 2px solid #9A9A9A; background: #DCDCDC; display: flex; align-items: center; justify-content: center"><button type="button" sc-camel-on-click="{{openKana}}" style="width: 128px; height: 62px; background: linear-gradient(#55A8FF 0%, #1170F0 50%, #0058E0 52%, #0044B8 100%); border: 2px solid #001E60; border-radius: 10px; color: #FFFFFF; font-size: 32px">入 力</button></span></div></sc-if>
<sc-if value="{{toSet}}"><div style="height: 80px; border: 2px solid #9A9A9A; background: #FFFFFF; display: flex"><span style="width: 196px; flex-shrink: 0; padding: 0 0 6px 8px; box-sizing: border-box; background: #EDEDED; font-size: 32px; display: flex; align-items: flex-end">到着駅</span><span style="flex-grow: 1; padding-left: 40px; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 36px; font-weight: 700; color: #0A6A0A">{{toName}}</span></span><span style="width: 166px; flex-shrink: 0; border-left: 2px solid #9A9A9A; background: #DCDCDC; display: flex; align-items: center; justify-content: center"><button type="button" sc-camel-on-click="{{openKana}}" style="width: 128px; height: 62px; background: linear-gradient(#6E6E6E 0%, #4A4A4A 8%, #3C3C3C 50%, #2E2E2E 90%, #0A0A0A 100%); border: 2px solid #000000; border-radius: 10px; color: #FFFFFF; font-size: 32px">変 更</button></span></div></sc-if>
<div style="height: 80px; border: 2px solid #9A9A9A; background: #FFFFFF; display: flex"><span style="width: 196px; flex-shrink: 0; padding: 0 0 6px 8px; box-sizing: border-box; background: #EDEDED; font-size: 32px; display: flex; align-items: flex-end">利用日時</span><span style="flex-grow: 1; padding-left: 40px; display: flex; flex-direction: column; justify-content: center"><span style="display: flex; align-items: baseline; gap: 40px"><span style="font-size: 32px; font-weight: 700; color: #0A6A0A">{{dateW}}</span><span style="font-size: 32px; font-weight: 700; color: #0A6A0A">{{timeLabel}}</span><span style="display: flex; gap: 6px"><span style="padding: 2px 10px; border: 2px solid; border-radius: 12px; font-size: 26px; font-weight: 700; {{depStyle}}">出発</span><span style="padding: 2px 10px; border: 2px solid; border-radius: 12px; font-size: 26px; font-weight: 700; {{arrStyle}}">到着</span></span></span></span><span style="width: 166px; flex-shrink: 0; border-left: 2px solid #9A9A9A; background: #DCDCDC; display: flex; align-items: center; justify-content: center"><button type="button" sc-camel-on-click="{{openTime}}" style="width: 128px; height: 62px; background: linear-gradient(#6E6E6E 0%, #4A4A4A 8%, #3C3C3C 50%, #2E2E2E 90%, #0A0A0A 100%); border: 2px solid #000000; border-radius: 10px; color: #FFFFFF; font-size: 32px">変 更</button></span></div>
<div style="height: 80px; border: 2px solid #9A9A9A; background: #FFFFFF; display: flex"><span style="width: 196px; flex-shrink: 0; padding: 0 0 6px 8px; box-sizing: border-box; background: #EDEDED; font-size: 32px; display: flex; align-items: flex-end">人数</span><span style="flex-grow: 1; padding-left: 40px; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 32px; font-weight: 700; color: #0A6A0A">{{ppl}}</span></span><span style="width: 166px; flex-shrink: 0; border-left: 2px solid #9A9A9A; background: #DCDCDC; display: flex; align-items: center; justify-content: center"><button type="button" sc-camel-on-click="{{openPpl}}" style="width: 128px; height: 62px; background: linear-gradient(#6E6E6E 0%, #4A4A4A 8%, #3C3C3C 50%, #2E2E2E 90%, #0A0A0A 100%); border: 2px solid #000000; border-radius: 10px; color: #FFFFFF; font-size: 32px">変 更</button></span></div>
<sc-if value="{{showCond}}"><p style="margin: 30px 0 0; font-size: 22px">▼追加条件を指定する場合は入力してください。</p>
<div style="height: 80px; border: 2px solid #9A9A9A; background: #FFFFFF; display: flex"><span style="width: 196px; flex-shrink: 0; padding: 0 0 6px 8px; box-sizing: border-box; background: #EDEDED; font-size: 32px; display: flex; align-items: flex-end">条件</span><span style="flex-grow: 1; padding-left: 40px; display: flex; flex-direction: column; justify-content: center"><span style="display: flex; gap: 46px"><span style="display: flex; flex-direction: column"><span style="font-size: 20px">方面を</span><span style="font-size: 30px; color: #0A6A0A">{{condDir}}</span></span><span style="display: flex; flex-direction: column"><span style="font-size: 20px">長さを</span><span style="font-size: 30px; color: #0A6A0A">{{condLen}}</span></span><span style="display: flex; flex-direction: column"><span style="font-size: 20px">グレーなルートを</span><span style="font-size: 30px; color: #0A6A0A">{{condGray}}</span></span></span></span><span style="width: 166px; flex-shrink: 0; border-left: 2px solid #9A9A9A; background: #DCDCDC; display: flex; align-items: center; justify-content: center"><button type="button" sc-camel-on-click="{{openCond}}" style="width: 128px; height: 62px; background: linear-gradient(#6E6E6E 0%, #4A4A4A 8%, #3C3C3C 50%, #2E2E2E 90%, #0A0A0A 100%); border: 2px solid #000000; border-radius: 10px; color: #FFFFFF; font-size: 32px">変 更</button></span></div></sc-if>
<div style="margin-top: auto; padding-bottom: 14px; display: flex; align-items: center; justify-content: flex-end; gap: 14px"><span style="font-size: 28px">よろしければ</span><span aria-hidden="true" style="color: #0A7A0A; font-size: 30px">▶</span><button type="button" sc-camel-on-click="{{search}}" style="width: 196px; height: 78px; background: linear-gradient(#2FA82F 0%, #0E800E 50%, #006A00 52%, #005200 100%); border: 3px solid #B6F06A; border-radius: 10px; color: #FFFFFF; opacity: {{searchOpacity}}; {{searchRing}}; font-size: 38px; font-weight: 700">検 索</button></div>
</div>
</sc-if>

<sc-if value="{{s3}}">
<div style="flex-grow: 1; padding: 10px 80px 0; display: flex; gap: 42px">
<sc-for list="{{cards}}" as="c">
<div style="width: 540px; height: 720px; box-sizing: border-box; border: 3px solid #555555; border-radius: 14px; background: #FFFFFF; overflow: hidden; display: flex; flex-direction: column">
<div style="height: 60px; flex-shrink: 0; padding: 0 20px; background: #EDEDED; border-bottom: 2px solid #8A8A8A; display: flex; align-items: center; gap: 12px"><span style="font-size: 18px">{{c.headL}}：</span><span style="font-size: 28px; font-weight: 700">{{c.headV}}</span><span style="margin-left: auto; font-size: 18px; font-weight: 700">{{c.headR}}</span></div>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; padding: 10px 0 0"><p style="margin: 0 0 6px 20px; font-size: 17px; font-weight: 700; color: #C00000">{{c.tag}}</p><sc-for list="{{c.rows}}" as="t">
<sc-if value="{{t.isSt}}"><div style="height: 28px; display: flex; align-items: center"><span style="width: 78px; flex-shrink: 0; text-align: right; padding-right: 8px; font-size: 15px">{{t.km}}</span><span style="width: 16px; height: 16px; flex-shrink: 0; margin-left: -9px; box-sizing: border-box; border: 2px solid #000000; border-radius: {{t.node}}; background: #FFFFFF; position: relative; z-index: 1"></span><span style="padding-left: 12px; font-size: 22px; font-weight: 700">{{t.name}}</span></div></sc-if>
<sc-if value="{{t.isLn}}"><div style="height: 26px; display: flex; align-items: center; background: {{t.band}}"><span style="width: 78px; flex-shrink: 0; align-self: stretch; display: flex; align-items: center; justify-content: flex-start"><span style="width: 28px; height: 100%; background: {{t.tabBg}}; color: #FFFFFF; font-size: 11px; display: flex; align-items: center; justify-content: center">{{t.tab}}</span></span><span style="width: 4px; align-self: stretch; margin-left: -3px; background: #000000"></span><span style="padding-left: 21px; font-size: 16px; font-weight: 700">{{t.name}}</span></div></sc-if>
</sc-for></div>
<div style="height: 96px; flex-shrink: 0; padding: 0 16px; border-top: 2px solid #CCCCCC; background: #F4F4F4; display: flex; align-items: center; gap: 14px"><span style="font-size: 16px; line-height: 1.5">運賃（大人1人）<strong style="font-size: 28px; margin-left: 10px">{{c.fareTxt}}</strong></span><span style="flex-grow: 1"></span><sc-if value="{{c.hasMap}}"><button type="button" sc-camel-on-click="{{c.detail}}" style="height: 58px; padding: 0 14px; background: linear-gradient(#6E6E6E 0%, #4A4A4A 8%, #3C3C3C 50%, #2E2E2E 90%, #0A0A0A 100%); border: 2px solid #000000; border-radius: 10px; color: #FFFFFF; font-size: 20px">路線図で見る</button></sc-if><button type="button" sc-camel-on-click="{{c.pick}}" style="width: 140px; height: 62px; background: linear-gradient(#2FA82F 0%, #0E800E 50%, #006A00 52%, #005200 100%); border: 3px solid #B6F06A; border-radius: 10px; color: #FFFFFF; {{c.ring}}; font-size: 30px">選 択</button></div>
</div>
</sc-for>
<sc-if value="{{noRoute}}"><p style="margin: 80px auto 0; font-size: 30px; line-height: 1.6; text-align: center">{{noRouteMsg}}<br><span style="font-size: 22px; color: #E00000">{{noRouteSub}}</span></p></sc-if>
</div>
</sc-if>

<sc-if value="{{s4}}">
<div style="flex-grow: 1; min-height: 0; display: flex">
<div style="width: 556px; flex-shrink: 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; padding-top: 20px; background: #FFFFFF"><sc-for list="{{cRows}}" as="t">
<sc-if value="{{t.isSt}}"><div style="height: 28px; display: flex; align-items: center"><span style="width: 76px; flex-shrink: 0; text-align: right; padding-right: 8px; font-size: 15px">{{t.km}}</span><span style="width: 16px; height: 16px; flex-shrink: 0; margin-left: -9px; box-sizing: border-box; border: 2px solid #000000; border-radius: {{t.node}}; background: #FFFFFF; position: relative; z-index: 1"></span><span style="padding-left: 12px; font-size: 22px; font-weight: 700">{{t.name}}</span></div></sc-if>
<sc-if value="{{t.isLn}}"><div style="height: 26px; display: flex; align-items: center; background: {{t.band}}"><span style="width: 76px; flex-shrink: 0; align-self: stretch; display: flex; align-items: center; justify-content: flex-start"><span style="width: 28px; height: 100%; background: {{t.tabBg}}; color: #FFFFFF; font-size: 11px; display: flex; align-items: center; justify-content: center">{{t.tab}}</span></span><span style="width: 4px; align-self: stretch; margin-left: -3px; background: #000000"></span><span style="padding-left: 21px; font-size: 16px; font-weight: 700">{{t.name}}</span></div></sc-if>
</sc-for></div>
<div style="flex-grow: 1; padding: 30px 26px 0">
<div style="background: #FFFFFF; border: 2px solid #5A5A5A">
<div style="height: 120px; background: #5A5A5A; color: #FFF27A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px"><span style="font-size: 34px; font-weight: 700">{{here}}　⇒　{{toLabel}}</span><span style="font-size: 24px">出発日：{{dateW}}</span></div>
<div style="padding: 40px 26px 30px; display: flex; flex-direction: column; gap: 14px">
<button type="button" sc-camel-on-click="{{buyOnly}}" style="height: 136px; background: linear-gradient(#6E6E6E 0%, #4A4A4A 8%, #3C3C3C 50%, #2E2E2E 90%, #0A0A0A 100%); border: 2px solid #000000; border-radius: 10px; color: #FFFFFF; font-size: 40px"><span style="font-weight: 700">乗車券</span>のみ購入する</button>
<span style="text-align: center; font-size: 19px">大回りはこちら</span>
<div style="margin-top: 26px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px">
<div style="display: flex; flex-direction: column; gap: 8px"><button type="button" sc-camel-on-click="{{buyExp}}" style="height: 136px; background: linear-gradient(#6E6E6E 0%, #4A4A4A 8%, #3C3C3C 50%, #2E2E2E 90%, #0A0A0A 100%); border: 2px solid #000000; border-radius: 10px; color: #FFFFFF; font-size: 30px; line-height: 1.3"><span style="color: #FFF27A; font-weight: 700">特急券</span>＋乗車券</button><span style="text-align: center; font-size: 19px">特急に乗る</span></div>

      adjLineOpts: adjLines.map((n) => ({ label: (adjOn && s.noL.includes(n) ? '× ' : '') + n, style: adjOn && s.noL.includes(n) ? 'color: #FFF27A; ' + RING : 'color: #FFFFFF; ' + NORING, pick: () => set({ rpage: 0, adjKey: s.from + '>' + s.to, noL: adjOn && s.noL.includes(n) ? s.noL.filter((x) => x !== n) : (adjOn ? s.noL : []).concat(n), noS: adjOn ? s.noS : [] }) })),
      adjStOpts: adjSts.map((n) => ({ label: (adjOn && s.noS.includes(n) ? '× ' : '') + n, style: adjOn && s.noS.includes(n) ? 'color: #FFF27A; ' + RING : 'color: #FFFFFF; ' + NORING, pick: () => set({ rpage: 0, adjKey: s.from + '>' + s.to, noS: adjOn && s.noS.includes(n) ? s.noS.filter((x) => x !== n) : (adjOn ? s.noS : []).concat(n), noL: adjOn ? s.noL : [] }) })),
      adjNote: ok ? '押すと、その路線・駅を使わない候補に組み直します。もう一度押すと元に戻ります。「やめる」は変更を保存せずに閉じ、「リセット」は手直しをすべて外します。' : 'この手直しでは候補が見つかりませんでした。「リセット」か、別の組み合わせを選んでください。',
      mAdj: s.modal === 'adj',
      adult: String(s.adult), child: String(s.child),
      sumRows: [{ k: '区間', v: (HERE || '－') + ' ⇒ ' + (to || '－') }, { k: '利用日時', v: MDW + String(s.hour).padStart(2, '0') + ':' + String(s.min).padStart(2, '0') + (s.tmode === 'dep' ? ' 出発' : ' 到着') }, { k: '人数', v: ppl }, { k: '経路', v: rr ? (rr.normal ? rr.via : rr.km + 'km') : '－' }, { k: 'きっぷ', v: { only: '乗車券のみ', exp: '特急券＋乗車券', green: 'グリーン券＋乗車券' }[s.buy] }],
      // handlers
      buy0: () => set({ step: 1 }),
      search0: () => set({ step: 2, mode: 'oo', to: null, route: null }), normal0: () => set({ step: 2, mode: 'normal', to: null, route: null }), saved0: () => set({ step: 3, mode: 'saved', to: null, route: null }),
      showCond: !isN,
      openKana: () => set({ modal: 'kana', kana: '', kmode: !isN && !s.from ? 'from' : 'to' }), openFrom: () => set({ modal: 'kana', kana: '', kmode: 'from' }),
      kanaTitle: forFrom ? '出発駅名' : '到着駅名（目的地）', candTitle: forFrom ? '出発駅' : '到着駅（目的地）', fix: () => set({ kana: s.kana.slice(0, -1) }),
      show: () => { if (hits.length) set({ modal: 'cand', cpage: 0 }); }, redo: () => set({ modal: 'kana', kana: '', cpage: 0 }),
      pgPrev: () => set({ cpage: Math.max(0, cpg - 1) }), pgNext: () => set({ cpage: Math.min(nPg - 1, cpg + 1) }), pgTxt: cpg + 1 + '/' + nPg, pgMulti: nPg > 1, pgPrevOp: cpg > 0 ? '1' : '.35', pgNextOp: cpg < nPg - 1 ? '1' : '.35',
      closeModal: () => set({ modal: null }), openTime: () => set({ modal: 'time' }),
      openPpl: () => set({ modal: 'ppl' }), openCond: () => set({ modal: 'cond' }), openSum: () => set({ modal: 'sum' }),
      aMinus: () => set({ adult: Math.max(s.child ? 0 : 1, s.adult - 1) }), aPlus: () => set({ adult: Math.min(9, s.adult + 1) }),
      cMinus: () => set({ child: Math.max(s.adult ? 0 : 1, s.child - 1) }), cPlus: () => set({ child: Math.min(9, s.child + 1) }),
      search: () => { if (s.from && to) set({ step: 3 }); },
      buyOnly: () => set({ buy: 'only', exp: {}, step: 6, retOpen: false }), buyExp: () => set({ buy: 'exp', exp: {}, step: 6, retOpen: false }), buyGr: () => set({ buy: 'green', exp: {}, step: 6, retOpen: false }),
      retOne: () => set({ ret: 'one', retOpen: false, step: buyEx ? 5 : 7 }), retRound: () => (isN ? set({ ret: 'round', rdir: 'both', retOpen: false, step: buyEx ? 5 : 7 }) : set({ retOpen: true })),
      rGo: () => set({ ret: 'round', rdir: 'go', retOpen: false, step: buyEx ? 5 : 7 }), rBack: () => set({ ret: 'round', rdir: 'back', retOpen: false, step: buyEx ? 5 : 7 }), rBoth: () => set({ ret: 'round', rdir: 'both', retOpen: false, step: buyEx ? 5 : 7 }),
      expNext: () => set({ step: 7 }),
      confirm: () => set({ step: 8, paid: 0, card: false }),
      p10: pay(10), p50: pay(50), p100: pay(100), p500: pay(500), p1000: pay(1000), payCard: () => set({ card: true, step: 9 }), toggleRcpt: () => set({ rcpt: !s.rcpt }),
      toggleMono: () => set({ mono: !s.mono }),
      back: () => { if (s.step === 6 && s.retOpen) return set({ retOpen: false }); const p = backMap[s.step]; set({ step: p === undefined ? 0 : p, modal: null }); },
      cancel: () => set({ ...this.init(), mono: s.mono }), home: () => set({ ...this.init(), mono: s.mono })
    };
    for (let i = 0; i <= 9; i++) v['s' + i] = s.step === i;

  }
