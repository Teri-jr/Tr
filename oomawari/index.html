<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大回り">
<meta name="theme-color" content="#F6F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
<title>大回りジェネレータ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* 大回りジェネレータ: 1ファイル完結。画面は下の JS が #app に描く。
   幅 760px 未満はスマホの画面、760px 以上は上にナビが付き、検索結果とルートを横に並べる(1200px 以上は3列)。 */
*{box-sizing:border-box}
:root{--bg:#F6F7F5;--sf:#FFFFFF;--tx:#15181C;--sub:#5C636B;--bd:#DDE0DC;--ink:#15181C;--it:#FFFFFF;--tk:#E4EFE2;--tkt:#1F5A33;--wn:#A84B06;--ok:#1B7A45;
  --jp:'Zen Kaku Gothic New','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;--num:Barlow,'Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#101214;--sf:#181B1F;--tx:#F1F3F1;--sub:#A4ABB3;--bd:#2C3136;--ink:#F1F3F1;--it:#101214;--tk:#1D2A20;--tkt:#A9DDB6;--wn:#F2B25C;--ok:#7FD6A0}}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--jp);line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
button{cursor:pointer;margin:0}
h1,h2,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
[hidden]{display:none!important}
.n{font-family:var(--num)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
:focus-visible{outline:2px solid var(--tkt);outline-offset:2px}

.scr{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.wide .scr{min-height:0}
.col{width:100%;max-width:480px;margin:0 auto;flex-grow:1;display:flex;flex-direction:column}
.wide .col{padding-top:16px;min-height:calc(100vh - 57px)}
.grow{flex-grow:1}

/* 上の帯 */
.hd{padding:10px 12px 0;display:flex;align-items:center;justify-content:space-between;min-height:54px}
.hd.pad{padding:10px 24px 0}
.hd strong{font-size:17px;font-weight:900;letter-spacing:.04em}
.back{min-height:44px;padding:0 12px;display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;border:0;background:none;color:var(--tx)}
.hl{min-height:44px;padding:0 12px;display:flex;align-items:center;font-size:13px;font-weight:700;color:var(--sub);border:0;background:none}
.hd.pad .hl{padding:0}
.icon-b{width:44px;height:44px;border:0;background:transparent;color:var(--tx);display:flex;align-items:center;justify-content:center}
.pc-h{border-bottom:1px solid var(--bd);padding:6px 32px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 32px}
.pc-h strong{font-size:18px;font-weight:900;letter-spacing:.04em}
.pc-h nav{display:flex;flex-wrap:wrap;gap:4px}
.pc-h nav a{min-height:44px;padding:0 14px;border-radius:999px;color:var(--sub);font-size:13px;font-weight:700;display:flex;align-items:center}
.pc-h nav a[aria-current]{background:var(--ink);color:var(--it)}

/* きっぷ */
.tkw{container-type:inline-size}
.ticket{--u:1px;position:relative;overflow:hidden;aspect-ratio:1.5;padding:calc(14*var(--u)) calc(22*var(--u)) calc(12*var(--u));border-radius:4px;background-color:#CDEDE2;
  background-image:radial-gradient(circle,rgba(255,255,255,0) 4px,rgba(255,255,255,.6) 4px,rgba(255,255,255,.6) 5px,rgba(255,255,255,0) 5px),radial-gradient(circle,rgba(255,255,255,0) 8px,rgba(255,255,255,.45) 8px,rgba(255,255,255,.45) 9px,rgba(255,255,255,0) 9px);
  background-size:22px 22px;color:#3A2230;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.2);font-weight:500;width:100%;border:0;text-align:left;font-family:inherit}
@supports (width:1cqw){.ticket{--u:calc(100cqw / 342)}}
.ticket>*{position:relative}
.ticket .band{position:absolute;left:0;right:0;top:60%;height:15%;background:rgba(70,200,170,.3)}
.ticket .t1{align-self:center;padding:0 2px 2px .6em;border-bottom:2px solid #3A2230;font-size:calc(15*var(--u));letter-spacing:.6em}
.ticket .t2{margin-top:calc(12*var(--u));display:flex;align-items:center;justify-content:space-between;font-size:calc(30*var(--u));line-height:1.3}
.ticket .t2 svg{width:calc(26*var(--u));height:calc(14*var(--u));flex-shrink:0}
.ticket .t3{font-size:calc(12*var(--u));letter-spacing:.08em}
.ticket .t4{display:flex;align-items:baseline;justify-content:space-between;font-size:calc(13*var(--u));line-height:1.3}
.ticket .t4 b{font-weight:500;font-size:calc(21*var(--u))}
.ticket .t4 .yen{font-size:calc(22*var(--u));letter-spacing:.04em}
.ticket .t5{padding-left:calc(22*var(--u));font-size:calc(13*var(--u));letter-spacing:.08em}
.ticket .t6{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:calc(11*var(--u));line-height:1.35;letter-spacing:.04em}
.ticket .t6 b{font-weight:500;font-size:calc(14*var(--u))}

/* 使える時間 */
.lab{font-size:12px;font-weight:700;color:var(--sub)}
.timeR{display:flex;align-items:baseline;gap:10px}
.timeB{position:relative;min-height:52px;padding:0;border:none;border-bottom:2px solid var(--tx);background:transparent;color:var(--tx);font-family:var(--num);font-size:40px;font-weight:600;line-height:1.1}
.timeB input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;font-size:16px}
.timeR span{font-size:13px;font-weight:700}
.timeR .dur{margin-left:auto;color:var(--sub)}

/* 方面 */
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;padding:2px;gap:2px}
.seg button{min-height:40px;padding:0 12px;border:none;border-radius:8px;background:transparent;color:var(--sub);font-size:13px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--it)}
.seg.big{border-radius:12px;padding:3px;gap:3px}
.seg.big button{flex:1 1 auto;min-height:44px;border-radius:9px;padding:0 4px}
.map{position:relative;width:100%;aspect-ratio:342/300}
.map svg{position:absolute;left:0;top:0;width:100%;height:100%}
.chip{position:absolute;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px;font-weight:700;white-space:nowrap}
.tkl{margin:8px 0 0;font-size:12px;color:var(--sub)}.tkst{display:contents;color:inherit;text-decoration:none}.ver{margin-left:6px;font-size:11px;font-weight:600;color:var(--sub)}
#toast button{white-space:nowrap;flex-shrink:0}
.it-ln .gr{display:block;margin-top:4px;font-size:12px;font-weight:700;color:#1F7A3A}
.nori-l{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}.nori-l li{display:grid;grid-template-columns:7em 1fr auto;align-items:center;gap:10px}.nori-l .bar{display:block;height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.nori-l .bar i{display:block;height:100%;background:var(--tx)}.nori-l .d{font-variant-numeric:tabular-nums;color:var(--sub)}
.mk-map{display:block;width:100%;height:auto;border:1px solid var(--bd);border-radius:12px;background:var(--sf);touch-action:manipulation}
.mk-map text{font-weight:700;fill:var(--tx);stroke:var(--sf);paint-order:stroke;cursor:pointer}.mk-map .c{cursor:pointer}.mk-map .x{opacity:.35}
.mk-l{display:flex;flex-direction:column}.mk-l button{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding:8px 0;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.mk-l button strong{font-size:16px;font-weight:900}.mk-l button small{display:block;font-size:12px;color:var(--sub)}.mk-l button .r{font-size:14px;font-weight:700;white-space:nowrap}
.mk-l button:disabled{opacity:.45;cursor:default}.mk-l button.end strong{color:var(--ok)}
.mk-bar{display:flex;gap:8px}.mk-bar button{flex:1;height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;font-size:14px;font-weight:700;cursor:pointer}.mk-bar button:disabled{opacity:.4}
.adj{display:flex;flex-direction:column;gap:10px}.adj h2{font-size:15px;font-weight:900}.adj .row{display:flex;flex-wrap:wrap;gap:8px}.adj button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.adj button.on{background:var(--ink);color:var(--it);border-color:var(--ink)}.adj small{font-size:12px;color:var(--sub)}
.chip.want{border-color:var(--ink);background:var(--ink);color:var(--it)}
.chip.avoid{border:1px dashed var(--sub);color:var(--sub);text-decoration:line-through}
.map .here{position:absolute;font-size:13px;font-weight:900}
.rowlink{min-height:60px;border-top:2px solid var(--tx);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:12px}
.rowlink>span:first-child{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.rowlink strong{font-size:15px}
.rowlink small{font-size:12px;color:var(--sub)}
.rowlink .ch{font-size:18px;color:var(--sub)}
.cta{height:56px;border-radius:14px;border:0;background:var(--ink);color:var(--it);font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.cta .n{font-size:22px;font-weight:700}
.btn2{height:56px;border:1px solid var(--bd);border-radius:14px;background:transparent;color:var(--tx);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.foot{padding:16px 24px 24px}
.note{font-size:12px;color:var(--sub)}

/* PCの条件画面 */
.pc-cond{max-width:1120px;margin:0 auto;padding:40px 32px 48px;display:flex;flex-wrap:wrap;gap:40px 64px}
.pc-cond .left{flex:1 1 360px;max-width:420px;display:flex;flex-direction:column}
.pc-cond .right{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:14px}
.pc-cond .map{max-width:560px;margin:0 auto;aspect-ratio:560/491}
.wide .pc-cond .chip{height:44px;padding:0 18px;font-size:15px}
.wide .pc-cond .seg button{min-height:44px;padding:0 16px;font-size:14px}
.wide .pc-cond .here{font-size:15px}
.wide .pc-cond .cta{height:60px;font-size:17px}
.wide .pc-cond .cta .n{font-size:24px}

/* 検索結果 */
.sum{padding:12px 16px;background:var(--tk);border-radius:10px;display:flex;align-items:center;gap:12px}
.sum>span:first-child{flex-grow:1;display:flex;flex-direction:column;line-height:1.4;min-width:0}
.sum strong{font-size:17px;font-weight:900}
.sum small{font-size:12px;font-weight:500;color:var(--tkt)}
.sum .chg{font-size:13px;font-weight:700;color:var(--tkt);flex-shrink:0}
.lh{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:6px;border-bottom:2px solid var(--tx)}
.lh h1,.lh h2{font-size:15px;font-weight:900}
.lh button{min-height:44px;padding:0;border:none;background:transparent;color:var(--sub);font-size:12px;font-weight:700}
.card{padding:16px 0;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px}
.card svg{flex-shrink:0}
.card>span{flex-grow:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .tag{font-size:11px;font-weight:700;color:var(--ok)}
.card .tag.t{color:var(--tkt)}
.card .km{display:flex;align-items:baseline;gap:4px}
.card .km b{font-family:var(--num);font-size:30px;font-weight:700;line-height:1.1}
.card .km i{font-style:normal;font-size:12px;font-weight:700}
.card .meta{font-size:12px;font-weight:500;color:var(--sub)}
.card .via{font-size:13px;font-weight:500}
.wide .card[aria-current]{margin:0 -12px;padding:16px 12px;border-radius:10px;background:var(--sf)}
.more{padding:18px 0 0;display:flex;flex-direction:column}
.more button{min-height:48px;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--tx);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:space-between;padding:0;text-align:left}
.more button:last-child{border-bottom:0}
.more button b{font-weight:700;flex-shrink:0}
.empty{padding:28px 0 8px;font-size:14px;font-weight:500;color:var(--sub)}

/* ルート */
.okline{font-size:13px;font-weight:700;color:var(--ok);display:flex;align-items:center;gap:6px}
.rt-h1{font-size:24px;font-weight:900;line-height:1.35}
.rt-km{margin:4px 0 0;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.rt-km b{font-family:var(--num);font-size:44px;font-weight:700;line-height:1}
.rt-km i{font-style:normal;font-size:14px;font-weight:900}
.rt-km small{margin-left:8px;font-size:12px;font-weight:500;color:var(--sub)}
.rt-meta{font-size:13px;font-weight:500;color:var(--sub)}
.rmap{display:block;width:100%;height:auto}
.rmap text{font-weight:700;fill:var(--tx);stroke:none}
.rmap text.e{font-weight:900}
.itin{border-top:2px solid var(--tx);display:flex;flex-direction:column}
.it-h{display:flex;gap:10px;padding:8px 0 2px;font-size:11px;font-weight:700;color:var(--sub)}
.it-h>span:nth-child(1){width:44px;text-align:right}
.it-h>span:nth-child(2){width:14px}
.it-h>span:nth-child(3){flex-grow:1;display:flex;justify-content:space-between}
.it-r{display:flex;gap:10px;min-height:44px}
.it-r.l{min-height:40px}
.it-r.l.w{min-height:56px}
.it-km{width:44px;flex-shrink:0;align-self:center;text-align:right;font-family:var(--num);font-size:18px;font-weight:700}
.it-rail{position:relative;width:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.it-rail i{position:absolute;left:4px;width:6px;height:50%}
.it-rail i.u{top:0}.it-rail i.d{bottom:0}
.it-rail b{position:relative;width:6px;height:6px;border-radius:999px;background:var(--bg);border:3px solid var(--tx);box-sizing:content-box}
.it-rail b.s{width:14px;height:14px;background:var(--tx);border:0}
.it-rail b.g{border-width:4px}
.it-r.l .it-rail{align-items:stretch}
.it-r.l .it-rail i{position:static;height:auto}
.it-st{flex-grow:1;align-self:center;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.it-st strong{font-size:17px;font-weight:700}
.it-st strong.e{font-weight:900}
.it-st span{font-size:12px;color:var(--sub)}
.it-st span.k{font-size:11px;font-weight:700;color:var(--tkt)}
.it-ln{flex-grow:1;align-self:center;display:flex;flex-direction:column;font-size:13px}
.it-ln>span:first-child{display:flex;justify-content:space-between;gap:8px}
.it-ln .m{color:var(--sub);flex-shrink:0}
.it-ln .w{font-size:12px;font-weight:700;color:var(--wn)}
.it-ln .t{font-size:12px;font-weight:700;color:var(--tkt);padding:2px 0 6px}
.it-r.l.tb{min-height:0}
.it-ln>span:first-child{flex-wrap:wrap}
.it-ln .m{margin-left:auto}
.tt.rode{width:100%;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--tx);padding:0;text-align:left}
.tt.rode span{font-size:12px;color:var(--sub)}
.tt{min-height:48px;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.sq{width:56px;height:56px;flex-shrink:0;border:1px solid var(--bd);border-radius:14px;background:transparent;color:var(--tx);display:flex;align-items:center;justify-content:center}
.sq[aria-pressed=true] svg{fill:currentColor}

/* 検索結果とルートを並べる(タブレット・PC) */
.res{display:flex;align-items:stretch;min-height:calc(100vh - 57px)}
.res .ls{flex:0 0 320px;padding:16px 24px 32px;border-right:1px solid var(--bd);display:flex;flex-direction:column}
.res .mn{flex:1 1 0;min-width:0;padding:28px 36px 40px;display:flex;flex-direction:column}
.res .rs{flex:0 0 340px;padding:28px 28px 32px;border-left:1px solid var(--bd);display:flex;flex-direction:column}
.w3 .res .ls{flex-basis:340px;padding:16px 28px 32px}
.w3 .res .mn{padding:28px 40px 40px}
.res .ls .back{align-self:flex-start;padding:0}
.res .sum{flex-direction:column;align-items:stretch;gap:0;line-height:1.4}
.res .rt-h1{margin-top:4px;font-size:28px}
.stats{margin-top:14px;display:flex;flex-wrap:wrap;gap:12px 36px}
.stats div{display:flex;flex-direction:column;line-height:1.3}
.stats small{font-size:11px;font-weight:700;color:var(--sub)}
.stats b{font-family:var(--num);font-size:30px;font-weight:700}
.stats i{font-style:normal;font-size:13px;font-weight:900}
.res .rmap{max-width:640px;align-self:center;margin-top:12px}
.acts{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px}
.acts button,.acts a{height:52px;border-radius:14px;font-size:14px;font-weight:700}
.acts button{padding:0 22px;border:1px solid var(--bd);background:transparent;color:var(--tx)}
.acts a{flex:1 1 200px;background:var(--ink);color:var(--it);font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center}
.sec-h{font-size:15px;font-weight:900;margin:0 0 10px}

/* 乗車中 */
.pill{margin-right:12px;padding:4px 12px;border-radius:999px;background:var(--tk);color:var(--tkt);font-size:12px;font-weight:700}
.now{padding:10px 24px 0;display:flex;align-items:center;gap:10px}
.bar{width:6px;height:36px;flex-shrink:0}
.now>span:last-child,.nx>div>span:nth-child(2){display:flex;flex-direction:column;line-height:1.3}
.now small{font-size:11px;font-weight:700;color:var(--sub)}
.now strong{font-size:16px}
.next{padding:26px 24px 0;display:flex;flex-direction:column}
.next>span{font-size:14px;font-weight:700}
.next>span strong{font-size:22px;font-weight:900}
.next>div{display:flex;align-items:baseline;gap:8px}
.next .ato{font-size:18px;font-weight:900}
.next .big{font-family:var(--num);font-size:120px;font-weight:700;line-height:1}
.next .u{font-size:22px;font-weight:900}
.next .pace{margin-left:auto;text-align:right;line-height:1.3}
.next .pace small{font-size:12px;color:var(--sub)}
.next .pace b{font-size:18px;font-weight:900}
.nx{margin:18px 24px 0;padding:16px 0;border-top:2px solid var(--tx);border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.nx>div{display:flex;align-items:center;gap:10px}
.nx .bar{height:40px}
.nx>div>span:nth-child(2){flex-grow:1}
.nx small{font-size:12px;font-weight:700;color:var(--sub)}
.nx strong{font-size:18px}
.nx .r{text-align:right;font-size:12px;font-weight:700;color:var(--sub);line-height:1.4}
.nx p{font-size:12px;font-weight:700;color:var(--wn)}
.prog{padding:22px 24px 0;display:flex;flex-direction:column;gap:8px}
.prog .tr{position:relative;padding-top:14px}
.prog .tr>div{display:flex;gap:2px;height:8px}
.prog .tr>b{position:absolute;top:8px;width:12px;height:12px;border-radius:999px;background:var(--bg);border:4px solid var(--tx);box-sizing:content-box;transform:translateX(-50%)}
.prog .lg{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.prog .lg b{font-family:var(--num);font-size:16px;font-weight:700;color:var(--tx)}
.after{margin:22px 24px 0;flex-grow:1;display:flex;flex-direction:column}
.after h2{margin:0 0 4px;font-size:12px;font-weight:700;color:var(--sub)}
.after div{min-height:44px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;font-size:14px}
.after div:last-child{border-bottom:0}
.after strong{width:60px;flex-shrink:0}
.after span{font-size:12px;color:var(--sub)}
.after span.g{flex-grow:1}
.after span b{font-family:var(--num);font-size:16px;font-weight:600;color:var(--tx)}
.two{padding:16px 24px 24px;display:flex;gap:10px}
.two>*{flex:1 1 0;min-width:0;padding:0;height:56px;border-radius:14px;font-size:14px}
.two button{border:1px solid var(--bd);background:transparent;color:var(--tx);font-weight:700}
.two a{background:var(--ink);color:var(--it);font-weight:900;display:flex;align-items:center;justify-content:center}

/* 係員に見せる */
.show{padding:20px 24px 24px;gap:18px}
.show header{display:flex;flex-direction:column;gap:2px}
.show header span{font-size:13px;font-weight:700;color:var(--sub)}
.show h1{font-size:28px;font-weight:900;line-height:1.3}
.stk{background:var(--tk);color:var(--tkt);border-radius:10px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.stk>span:first-child{display:flex;flex-direction:column;line-height:1.35}
.stk small{font-size:11px;font-weight:700;letter-spacing:.2em}
.stk strong{font-size:24px;font-weight:900;color:var(--tx)}
.stk em{font-style:normal;font-size:12px;font-weight:500}
.stk .f{text-align:center;line-height:1.1}
.stk .f b{font-family:var(--num);font-size:32px;font-weight:700;color:var(--tx)}
.stk .f i{font-style:normal;font-size:12px;font-weight:700}
.sh2{padding-bottom:6px;border-bottom:2px solid var(--tx);font-size:13px;font-weight:900}
.sec{display:flex;flex-direction:column;gap:8px}
.via-l{display:flex;flex-direction:column;font-size:17px;font-weight:700}
.via-l li{min-height:36px;display:flex;align-items:center;gap:10px}
.via-l i{width:6px;height:22px;flex-shrink:0}
.via-l i.o{height:6px;margin:0 -3px;border-radius:999px;border:3px solid var(--tx);box-sizing:content-box}
.via-l span{font-size:12px;font-weight:500;color:var(--sub)}
.chk{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:700}
.chk li{display:flex;align-items:center;gap:10px}
.chk svg{color:var(--ok);flex-shrink:0}

/* 駅をえらぶ・保存・詳細条件・使い方 */
.pg-h1{font-size:24px;font-weight:900;line-height:1.35}
.q{height:52px;padding:0 16px;border:none;border-bottom:2px solid var(--tx);border-radius:0;background:transparent;color:var(--tx);font-size:17px;font-weight:500;width:100%}
.q:focus{outline:none;border-bottom-color:var(--tkt)}
.st{min-height:57px;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--tx);display:flex;align-items:center;gap:12px;width:100%;padding:0;text-align:left}
.st>span:first-child{flex-grow:1;display:flex;flex-direction:column;line-height:1.3}
.st strong{font-size:18px;font-weight:700}
.st[aria-current] strong{font-weight:900}
.st small{font-size:11px;font-weight:700;color:var(--tkt)}
.st .d{font-family:var(--num);font-size:14px;font-weight:500;color:var(--sub)}
.st .f{width:60px;text-align:right}
.st .f b{font-family:var(--num);font-size:20px;font-weight:700}
.st .f i{font-style:normal;font-size:11px;font-weight:700}
.opt{min-height:60px;padding:6px 0;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:12px}
.opt.last{border-bottom:0;min-height:56px}
.opt>span:first-child{display:flex;flex-direction:column;line-height:1.4}
.opt>span:first-child>span:first-child{font-size:15px;font-weight:500}
.opt small{font-size:12px;color:var(--sub)}
.opt small.w{font-weight:700;color:var(--wn);line-height:1.45}
.stp{display:flex;align-items:center;gap:8px;flex-shrink:0}
.stp button{width:44px;height:44px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:var(--tx);font-size:20px;font-weight:500}
.stp>span{min-width:52px;text-align:center}
.stp b{font-family:var(--num);font-size:22px;font-weight:700}
.stp i{font-style:normal;font-size:12px;font-weight:700}
.sw{position:relative;width:52px;height:32px;flex-shrink:0;border:none;border-radius:999px;background:var(--bd)}
.sw span{position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:999px;background:var(--sf);transition:left .15s}
.sw[aria-checked=true]{background:var(--ink)}
.sw[aria-checked=true] span{left:23px;background:var(--it)}
.h2r{margin:26px 0 0;padding-bottom:8px;border-bottom:2px solid var(--tx);font-size:13px;font-weight:900}
.pills{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.pl{min-height:44px;padding:0 14px;border:none;border-radius:999px;background:var(--ink);color:var(--it);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.pl i{width:10px;height:10px;border-radius:999px}
.pl.add{border:1px dashed var(--sub);background:transparent;color:var(--sub)}
.guide p{font-size:14px;margin-top:10px}
.guide li{font-size:14px;font-weight:500;padding:10px 0;border-bottom:1px solid var(--bd)}

/* 下から出る選択リスト・お知らせ */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:480px;max-height:70vh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:18px 24px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:15px;font-weight:900;padding-bottom:8px;border-bottom:2px solid var(--tx)}
.sheet button{min-height:52px;width:100%;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--tx);font-size:16px;font-weight:700;text-align:left;padding:0;display:flex;align-items:center;gap:10px}
.sheet button i{width:10px;height:10px;border-radius:999px}
.sheet .x{border-bottom:0;color:var(--sub);font-size:14px;justify-content:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--it);font-size:13px;font-weight:700;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#toast button{border:0;background:none;color:inherit;font-size:13px;font-weight:900;text-decoration:underline;padding:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast" role="status" hidden></div>
<script src="data.js?v=1.6.2"></script>
<script src="engine.js?v=1.6.2"></script>
<script>
'use strict';
const APP_VERSION = '1.6.2'; // 変えたら changelog.json の先頭も同じ番号にする

/* ===== データ =====
   路線データは data.js、ルートの探索は engine.js。画面はここから E.search() などを呼ぶだけ。 */
const E = OOMAWARI;
const NET = E.netPath; // 略図(342×300)の下地の線
// 方面: [名前, チップの中心x,y(342×300の略図の上)]
const REGIONS = [['群馬',58,50],['栃木',150,24],['茨城',248,52],['埼玉',106,96],['成田・銚子',268,120],['房総',214,226],['多摩',56,142],['神奈川',100,204]];
const MAJOR = ['横浜','東神奈川','新横浜','菊名','鶴見','川崎','武蔵小杉','桜木町','大船','戸塚','東京','新宿','渋谷','池袋','上野','品川','神田','秋葉原','御茶ノ水','大宮','千葉','立川','八王子'];
const LENS = ['〜100km','〜300km','300km〜','最長'];
const SORTS = ['長い順','短い順','乗換が少ない順'];

/* ===== 保存するもの ===== */
const LS = { cond:'oomawari.cond', saved:'oomawari.saved', ride:'oomawari.ride', ridden:'oomawari.ridden' };
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const DEF = { from:'横浜', to:'東神奈川', start:'07:00', end:'20:00', want:[], avoid:[], len:2, xfer:8, xmin:15, meal:true, exp:false, rare:true, mustLine:[], noLine:[], mustSt:[], noSt:[], gray:false, ic:true, prev:0 }; // 基本はSuica(IC)
let cond = Object.assign({}, DEF, load(LS.cond, {}));
if (!cond.icV) { cond.ic = true; cond.icV = 1; } // 1.6.1: 基本をSuicaにした(前に紙にしていた端末も一度だけSuicaにもどす)
let saved = load(LS.saved, []);   // [{id, at, date}]
let ridden = load(LS.ridden, []); // 「このルートに乗った」を押したルートの id(端末の中だけに記録)
let ride = load(LS.ride, null);   // {id, at(乗りはじめた時刻ms), to}
const ui = { tap:'want', sort:0, q:'', pos:null, near:null };
const setCond = (o) => { Object.assign(cond, o); fixCond(); save(LS.cond, cond); };
// きっぷの情報 {km, fare, loop}。運賃のわからない組みあわせは null
const tkOf = (from, to) => { const t = E.ticket(from, to, cond.ic); return t && t.fare != null && !(t.loop && cond.ic) ? t : null; };
// 保存してあった条件が、いまの路線データで使えないときは直す
function fixCond() {
  if (!E.has(cond.from)) cond.from = DEF.from;
  if (!E.has(cond.to) || !tkOf(cond.from, cond.to)) { const d = E.dests(cond.from, cond.ic)[0]; cond.to = d ? d.n : cond.from; }
}
fixCond();

/* ===== 計算 ===== */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2, '0');
const toMin = (t) => { const m = /^(\d\d):(\d\d)$/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : NaN; };
const winMin = (c) => toMin(c.end) - toMin(c.start);
const tk = () => tkOf(cond.from, cond.to) || { km: 0, fare: 0 };
const fare = () => tk().fare;
const rtk = (r) => E.ticket(r.from, r.to, cond.ic) || { km: 0, fare: 0 }; // そのルートのきっぷ
const toTxt = (from, to) => from === to ? to + '（一周）' : to;
const PREVS = ['気にしない','なるべく避ける','できるだけ避ける'];
// 前に乗ったルートと重なる区間
const overlap = (r) => E.overlap(r, ridden).list;
const rCache = new Map();
const routeById = (id) => { if (!rCache.has(id)) rCache.set(id, E.routeById(id)); return rCache.get(id); };
const xfers = (r) => r.stops.length - 2;
const rideMin = (r) => r.legs.reduce((a, l) => a + l[2], 0);
const baseMin = (r, c) => rideMin(r) + xfers(r) * c.xmin;
const totalMin = (r, c) => baseMin(r, c) + (c.meal ? 30 : 0);
const durTxt = (m) => '約' + (m >= 60 ? Math.floor(m / 60) + '時間' : '') + (m % 60 ? (m % 60) + '分' : '');
const halfTxt = (m) => { const h = Math.round(m / 30) / 2; return '約' + Math.floor(h) + '時間' + (h % 1 ? '半' : ''); };
const spanTxt = (r, c) => { const a = Math.floor(baseMin(r, c) / 60), b = Math.round(totalMin(r, c) / 60); return b > a ? '約' + a + '〜' + b + '時間' : halfTxt(totalMin(r, c)); };
const winTxt = (c) => { const w = winMin(c); return !(w > 0) ? '－' : Math.floor(w / 60) + '時間' + (w % 60 ? (w % 60) + '分' : ''); };
const today = () => new Date();
const WD = '日月火水木金土';
const dateTxt = (d) => (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）';
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

// 条件に合うルートを返す(同じ条件なら前の結果を使う)
const sCache = new Map();
function searchRoutes(c, budget) {
  const key = JSON.stringify([c.from, c.to, c.ic, c.start, c.end, c.len, c.xfer, c.xmin, c.meal, c.rare, c.want, c.avoid, c.mustLine, c.noLine, c.mustSt, c.noSt, c.prev, c.prev ? ridden : 0, budget || 0]);
  if (!sCache.has(key)) { if (sCache.size > 60) sCache.clear();
    const res = E.find(c, ridden, budget); // 券売機モードも同じ E.find() でさがす
    res.routes.forEach((r) => rCache.set(r.id, r)); sCache.set(key, res.routes); }
  return sCache.get(key);
}
function sorted(rs) {
  const a = rs.slice();
  if (ui.sort === 1) a.sort((x, y) => x.km - y.km);
  if (ui.sort === 2) a.sort((x, y) => xfers(x) - xfers(y) || y.km - x.km);
  return a;
}
// 「条件を変えると、もっと見つかります」の候補
function suggestions(c) {
  const n0 = searchRoutes(c).length, out = [];
  if (n0 >= 8) return out; // もう十分ある
  const tryIt = (label, o) => { const g = searchRoutes(Object.assign({}, c, o), 1500000).length - n0; if (g > 0) out.push({ label, o, g }); };
  const e = toMin(c.end);
  if (e < 24 * 60 - 1) { const t = Math.min(e + 120, 23 * 60 + 59); tryIt(pad(Math.floor(t / 60)) + ':' + pad(t % 60) + ' までにする', { end: pad(Math.floor(t / 60)) + ':' + pad(t % 60) }); }
  [1, 2, 0].forEach((i) => { if (i !== c.len) tryIt('長さを「' + LENS[i] + '」にする', { len: i }); });
  if (c.xfer < 12) tryIt('乗換を' + (c.xfer + 2) + '回までにする', { xfer: c.xfer + 2 });
  if (c.want.length || c.avoid.length) tryIt('方面をおまかせにする', { want: [], avoid: [] });
  if (c.mustLine.length || c.noLine.length || c.mustSt.length || c.noSt.length) tryIt('路線・駅の指定を外す', { mustLine: [], noLine: [], mustSt: [], noSt: [] });
  if (!c.rare) tryIt('本数の少ない路線も使う', { rare: true });
  return out.sort((a, b) => b.g - a.g).slice(0, 2);
}
const detailTxt = (c) => [LENS[c.len], '乗換' + c.xfer + '回まで'].concat(c.mustLine.map((n) => n + 'に乗る'), [c.exp ? '特急あり' : '特急なし']).join('・') + ' ほか';
const sumTxt = (c) => [c.start + '〜' + c.end].concat(c.want.map((g) => g + '方面'), [LENS[c.len], c.exp ? '特急あり' : '特急なし'], c.ic ? ['ICで乗る'] : []).join('・');

/* ===== 部品 ===== */
const CHECK = (s, w) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w || 3}" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`;
function ticketHtml() {
  const d = today(), from = cond.from, to = cond.to, tot = from.length + to.length, big = tot <= 6, fs = big ? 30 : Math.max(11, Math.round(30 * 6.6 / tot));
  const sp = (s) => { const e = !big ? .08 : s.length <= 2 ? 1 : .45; return `<span style="letter-spacing:${e}em;margin-right:-${e}em">${esc(s)}</span>`; };
  return `<section aria-label="きっぷ" class="tkw"><div class="ticket" aria-label="きっぷ ${esc(from)}から${esc(to)} ${fare()}円">
<span class="band" aria-hidden="true"></span><span class="t1">乗車券</span>
<span class="t2"${big ? '' : ` style="font-size:calc(${fs}*var(--u));min-height:calc(39*var(--u))"`}><a href="#/from" class="tkst" aria-label="出発駅 ${esc(from)}（押すと変える）">${sp(from)}</a><svg aria-hidden="true" viewBox="0 0 26 14" fill="currentColor"><path d="M0 5h16V0l10 7-10 7V9H0z"/></svg><a href="#/station" class="tkst" aria-label="到着駅 ${esc(to)}（押すと変える）">${sp(to)}</a></span>
<span class="t3">経由：${from === to ? '一周' : '－－－'}</span>
<span class="t4"><span><b>${d.getMonth() + 1}</b>月<b>${d.getDate()}</b>日当日限り有効</span><span class="yen">￥${fare()}</span></span>
<span class="t5">下車前途無効</span>
<span class="t6"><span>${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}<br><b>00000-00</b></span><span>大回りジェネレータ発行<br>（きっぷのイメージ）</span><b>見本</b></span></div><p class="tkl">駅名を押すと、出発駅・到着駅を変えられます</p></section>`;
}
const timeHtml = () => `<section aria-label="使える時間" style="display:flex;flex-direction:column;gap:2px"><span class="lab">使える時間</span><div class="timeR">
<button type="button" class="timeB" data-time="start" aria-label="出発 ${esc(cond.start)}">${esc(cond.start)}<input type="time" tabindex="-1" aria-hidden="true" value="${esc(cond.start)}" data-tin="start"></button><span>から</span>
<button type="button" class="timeB" data-time="end" aria-label="帰着 ${esc(cond.end)}">${esc(cond.end)}<input type="time" tabindex="-1" aria-hidden="true" value="${esc(cond.end)}" data-tin="end"></button><span>まで</span>
<span class="dur">${winTxt(cond)}</span></div></section>`;
function mapHtml(pc) {
  const o = E.xy(cond.from), hx = Math.max(2, Math.min(80, (o[0] + 7) / 342 * 100)), hy = Math.max(0, (o[1] - 24) / 300 * 100);
  const circles = REGIONS.map((g) => cond.want.includes(g[0]) ? `<circle cx="${g[1]}" cy="${g[2]}" r="40" style="fill:var(--tk)"/>` : cond.avoid.includes(g[0]) ? `<circle cx="${g[1]}" cy="${g[2]}" r="26" stroke-width="${pc ? 1.2 : 1.5}" stroke-dasharray="4 5" style="stroke:var(--sub)"/>` : '').join('');
  const chips = REGIONS.map((g) => { const w = cond.want.includes(g[0]), a = cond.avoid.includes(g[0]);
    return `<button type="button" class="chip${w ? ' want' : a ? ' avoid' : ''}" data-region="${esc(g[0])}" aria-pressed="${w || a}" aria-label="${esc(g[0])}${w ? '（行きたい）' : a ? '（さけたい）' : ''}" style="left:${g[1] / 342 * 100}%;top:${g[2] / 300 * 100}%;transform:translate(-50%,-50%)">${w ? '✓ ' : ''}${esc(g[0])}</button>`; }).join('');
  return `<div class="map"><svg aria-hidden="true" viewBox="0 0 342 300" fill="none" stroke-linecap="round" stroke-linejoin="round">${circles}<path d="${NET}" stroke-width="${pc ? 1.2 : 1.6}" style="stroke:var(--bd)"/><circle cx="${o[0].toFixed(1)}" cy="${o[1].toFixed(1)}" r="${pc ? 5 : 6}" style="fill:var(--tx)"/></svg>${chips}<div class="here" style="left:${hx}%;top:${hy}%">${esc(cond.from)}</div></div>`;
}
const tapSeg = (pc) => `<div role="group" aria-label="${pc ? 'クリック' : 'タップ'}したときの動き" class="seg"><button type="button" data-tap="want" aria-pressed="${ui.tap === 'want'}">行きたい</button><button type="button" data-tap="avoid" aria-pressed="${ui.tap === 'avoid'}">さけたい</button></div>`;
const detailLink = () => `<a href="#/detail" class="rowlink"><span><strong>詳細条件</strong><small>${esc(detailTxt(cond))}</small></span><span class="ch">›</span></a><a href="#/make" class="rowlink" style="border-top-width:1px"><span><strong>ルートを自分で作る</strong><small>路線図をなぞって組み立てる</small></span><span class="ch">›</span></a>`;
const cta = () => `<a href="#/search" class="cta"><span class="n">${searchRoutes(cond).length}</span>ルートを見る</a>`;
const thumb = (r) => `<svg aria-hidden="true" width="92" height="81" viewBox="0 0 342 300" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="${NET}" stroke-width="4" style="stroke:var(--bd)"/>${r.legs.map((l) => `<path d="${l[4]}" stroke="${l[3]}" stroke-width="13"/>`).join('')}<circle cx="${E.xy(r.from)[0].toFixed(1)}" cy="${E.xy(r.from)[1].toFixed(1)}" r="13" style="fill:var(--tx)"/></svg>`;
function cardHtml(r, tag, meta, cur, tagCls) {
  return `<a href="#/route/${esc(r.id)}" class="card"${cur ? ' aria-current="true"' : ''}>${thumb(r)}<span>${tag ? `<span class="tag${tagCls || ''}">${esc(tag)}</span>` : ''}<span class="km"><b>${Math.round(r.km)}</b><i>km</i></span><span class="meta">${esc(meta)}</span><span class="via">${esc(r.via)}</span></span></a>`;
}
function listHtml(rs, curId, H) {
  const sg = suggestions(cond);
  return `<div class="lh"><${H}>${rs.length ? rs.length + 'つのルート' : 'ルートなし'}</${H}><button type="button" data-act="sort" aria-label="並べかえ（いまは${SORTS[ui.sort]}）">${SORTS[ui.sort]}</button></div>
${rs.map((r) => cardHtml(r, rs.length > 1 && r === rs.slice().sort((a, b) => b.km - a.km)[0] ? 'いちばん長い' : '', halfTxt(baseMin(r, cond)) + '・乗換' + xfers(r) + '回', r.id === curId)).join('')}
${rs.length ? '' : `<p class="empty">${winMin(cond) > 0 ? 'この条件に合うルートは見つかりませんでした。' : '使える時間が0分です。出発と帰着の時刻を見直してください。'}</p>`}

  const notes = r.stops.filter((x) => x[2]).map((x) => x[2]);

    if (prev && prev.line === l[0]) prev.mid.push(r.stops[i][0]); else rows.push({ st: r.stops[i][0], line: l[0], c: l[3], sl: l[5] && l[5].sl, mid: [] }); });
  return `<div class="scr"><div class="col show"><header><span>係員の方へ</span><h1>大回り乗車をしています</h1></header>
<section aria-label="乗車券" class="stk"><span><small>乗車券</small><strong>${esc(r.from)} → ${esc(toTxt(r.from, r.to))}</strong><em>${d.getMonth() + 1}月${d.getDate()}日　${esc(r.from)} ${at ? pad(at.getHours()) + ':' + pad(at.getMinutes()) : esc(cond.start)} 入場</em></span><span class="f"><b>${rtk(r).fare}</b><br><i>円</i></span></section>
<section aria-label="経路" class="sec"><h2 class="sh2">乗車経路</h2><ol class="via-l">${rows.map((x) => `<li><i style="background:${x.c}"></i>${esc(x.st)}<span>${esc(x.sl || x.line + (x.mid.length ? `（${x.mid.join('・')} 経由）` : ''))}</span></li>`).join('')}<li><i class="o"></i>${esc(r.to)}<span>ここで出場</span></li></ol>${notes.map((t) => `<p class="note">${esc(t)}</p>`).join('')}</section>
<section aria-label="確認" class="sec grow"><h2 class="sh2">確認</h2><ul class="chk">${['すべて東京近郊区間内', '同じ駅を2度通っていない', '途中で改札を出ていない'].map((t) => `<li>${CHECK(18)}${t}</li>`).join('')}</ul><p class="note" style="margin-top:6px">旅客営業規則 第157条第2項（大都市近郊区間内の選択乗車）</p></section>
<a href="#/ride" class="btn2" data-act="closeShow">閉じる</a></div></div>`; };

V.guide = () => `<div class="scr"><div class="col guide"><header class="hd"><a href="#/" class="back">‹ さがす</a></header><section class="grow" style="margin:4px 24px 24px;display:flex;flex-direction:column">
<h1 class="pg-h1" style="line-height:1.5">使い方</h1><p>大回り乗車は、東京近郊区間の中なら、きっぷの区間をどんな経路で乗ってもよいという決まりを使って、いちばん安いきっぷで遠回りを楽しむ乗り方です。</p>
<h2 class="h2r">守ること</h2><ul><li>すべて東京近郊区間の中を通る</li><li>同じ駅を2度通らない</li><li>途中で改札を出ない</li><li>紙のきっぷで乗る(ICカードは長時間の乗車で改札が閉まることがあります)</li></ul>
<h2 class="h2r">このアプリでできること</h2><ul><li>使える時間と行きたい方面から、回れるルートをさがす</li><li>ルートを保存して、電波のない区間でも開く</li><li>乗っているあいだ、次の乗換までの距離を見る</li><li>係員の方に、経路と決まりを見せる</li></ul>
<p class="note" style="margin-top:16px">関東の輪になっている路線と、神奈川の行き止まりの路線(横須賀線 大船〜久里浜、東海道線 茅ケ崎〜熱海、鶴見線 浜川崎〜扇町)から探します。ほかの行き止まりの路線はまだです。営業キロ・所要時間・本数は手入力の目安です。発車時刻は当日の時刻表で確認してください。</p>
<p class="note" style="margin-top:8px"><a href="kiosk.html" style="text-decoration:underline">券売機モード（あそび）</a>　v${APP_VERSION}</p></section></div></div>`;

/* ===== 画面の切りかえ ===== */
const app = document.getElementById('app');
const mqW = matchMedia('(min-width:760px)'), mq3 = matchMedia('(min-width:1200px)');
let lastHash = null, rideTimer = null, geoId = null;
const scrollMem = { cur: 0 }; // いまのスクロール位置と、一覧のスクロール位置
addEventListener('scroll', () => { scrollMem.cur = scrollY; if (location.hash === '#/search') scrollMem['#/search'] = scrollY; }, { passive: true });
function render() {
  const h = location.hash.replace(/^#\/?/, ''), parts = h.split('/'), wide = mqW.matches, w3 = mq3.matches;
  let rid = parts.slice(1).join('/'); try { rid = decodeURIComponent(rid); } catch (e) {}
  const name = parts[0] || 'cond', r = name === 'route' ? routeById(rid) : null;
  let html;
  if (name === 'search' || name === 'route') html = wide ? V.result(r || sorted(searchRoutes(cond))[0] || null, w3) : (r ? V.route(r) : V.search());
  else if (name === 'cond' || !V[name]) html = V.cond(wide);
  else html = (wide && name !== 'show' ? pcHeader(name === 'saved' ? 'v' : name === 'guide' ? 'g' : name === 'make' ? 'm' : name === 'ride' ? '' : 's') : '') + V[name]();
  document.documentElement.className = (wide ? 'wide' : '') + (w3 ? ' w3' : '');
  const keepQ = (name === 'station' || name === 'from') && document.activeElement && document.activeElement.id === 'q';
  app.innerHTML = html;
  if (keepQ) { const q = document.getElementById('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  if (lastHash !== location.hash) {
    // 画面が変わったときのスクロール: 広い画面で一覧からルートを選んだときはそのまま。一覧に戻ったときは前の位置。それ以外は先頭へ
    const isRes = (h) => /^#\/(search|route)(\/|$)/.test(h || '');
    const y = wide && isRes(lastHash) && isRes(location.hash) ? scrollMem.cur : location.hash === '#/search' && scrollMem['#/search'] != null ? scrollMem['#/search'] : 0;
    scrollTo(0, y); lastHash = location.hash; closeSheet(); }
  if (name !== 'station' && name !== 'from') ui.q = '';
  // 乗車中の画面だけ、位置情報を見て30秒ごとに描きなおす
  const onRide = name === 'ride' && ride;
  if (onRide && !rideTimer) { rideTimer = setInterval(render, 30000);
    if (navigator.geolocation) geoId = navigator.geolocation.watchPosition((p) => { ui.pos = [p.coords.latitude, p.coords.longitude]; if (location.hash === '#/ride') render(); }, () => { ui.pos = null; }, { enableHighAccuracy: false, maximumAge: 30000 }); }
  if (!onRide && rideTimer) { clearInterval(rideTimer); rideTimer = null; if (geoId != null) navigator.geolocation.clearWatch(geoId); geoId = null; }
}
addEventListener('hashchange', render);
mqW.addEventListener('change', render); mq3.addEventListener('change', render);

/* ===== 操作 ===== */
let toastT = null;
function toast(msg, btn, fn) {
  const t = document.getElementById('toast'); t.textContent = msg;
  if (btn) { const b = document.createElement('button'); b.type = 'button'; b.textContent = btn; b.onclick = fn; t.appendChild(b); }
  t.hidden = false; clearTimeout(toastT); if (!btn) toastT = setTimeout(() => { t.hidden = true; }, 3200);
}
function closeSheet() { document.getElementById('sheet').innerHTML = ''; }
function openSheet(title, opts, pick) {
  const s = document.getElementById('sheet');
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div><h2>${esc(title)}</h2>${opts.map((o, i) => `<button type="button" data-i="${i}">${o.c ? `<i style="background:${o.c}"></i>` : ''}${esc(o.n)}</button>`).join('') || '<p class="empty">追加できるものはありません。</p>'}<button type="button" class="x">やめる</button></div></div>`;
  s.firstChild.onclick = (e) => { const b = e.target.closest('button'); if (e.target === s.firstChild || (b && b.classList.contains('x'))) return closeSheet(); if (b) { closeSheet(); pick(opts[+b.dataset.i]); } };
}
// いま表示しているルート(ルートの画面、またはPCの結果画面の中央)
const curRoute = () => { const h = location.hash.replace(/^#\/?/, ''), parts = h.split('/'); let id = parts.slice(1).join('/'); try { id = decodeURIComponent(id); } catch (e) {}
  return parts[0] === 'route' ? routeById(id) : sorted(searchRoutes(cond))[0] || null; };
const toggleIn = (arr, v) => arr.includes(v) ? arr.filter((x) => x !== v) : arr.concat(v);
app.addEventListener('click', (e) => {
  const b = e.target.closest('button,a,[data-mk]'); if (!b) return; const d = b.dataset;
  if (d.time) { const inp = b.querySelector('input'); try { inp.showPicker(); } catch (er) { inp.focus(); } return; }
  if (d.tap) { ui.tap = d.tap; return render(); }
  if (d.region) { const g = d.region, other = ui.tap === 'want' ? 'avoid' : 'want';
    setCond({ [ui.tap]: toggleIn(cond[ui.tap], g), [other]: cond[other].filter((x) => x !== g) }); return render(); }
  if (d.sg) { setCond(suggestions(cond)[+d.sg].o); if (location.hash.startsWith('#/route')) location.hash = '#/search'; else render(); return; }
  if (d.st) { setCond({ to: d.st }); ui.q = ''; location.hash = '#/'; return; }
  if (d.from) { if (d.from !== cond.from) { cond.to = ''; setCond({ from: d.from }); } ui.q = ''; location.hash = '#/station'; return; }
  if (d.len) { setCond({ len: +d.len }); return render(); }
  if (d.ic) { setCond({ ic: d.ic === '1' }); return render(); } // 一周をえらんでいてICにしたら、fixCond がいちばん近い駅に直す
  if (d.prev) { setCond({ prev: +d.prev }); return render(); }
  if (d.stp) { const lim = d.stp === 'xfer' ? [0, 20, 1] : [0, 60, 5]; setCond({ [d.stp]: Math.max(lim[0], Math.min(lim[1], cond[d.stp] + +d.d * lim[2])) }); return render(); }
  if (d.sw) { setCond({ [d.sw]: !cond[d.sw] }); if (d.sw === 'exp' && cond.exp) toast('ルートの画面に、グリーン車の区間と料金の目安を出します(所要時間は普通列車の目安のまま)'); if (d.sw === 'gray' && cond.gray) toast('グレーなルート(6の字など)は、まだ出しません'); return render(); }
  if (d.rm) { setCond({ [d.rm]: cond[d.rm].filter((x) => x !== d.v) }); return render(); }
  if (d.add) { const k = d.add, line = k === 'mustLine' || k === 'noLine', seen = new Set(), opts = [];
    (line ? E.lineOpts : E.nodes.map((n) => ({ n }))).forEach((o) => { if (!seen.has(o.n) && !cond[k].includes(o.n) && o.n !== cond.from && o.n !== cond.to) { seen.add(o.n); opts.push(o); } });
    return openSheet(k === 'mustLine' ? 'かならず乗る路線' : k === 'noLine' ? '乗らない路線' : k === 'mustSt' ? 'かならず通る駅' : '通らない駅', opts, (o) => { const other = { mustSt: 'noSt', noSt: 'mustSt', mustLine: 'noLine', noLine: 'mustLine' }[k];
      setCond({ [k]: cond[k].concat(o.n), [other]: cond[other].filter((x) => x !== o.n) }); render(); }); }
  const mkEl = e.target.closest('[data-mk],[data-mkend]');
  if (mkEl && mkEl.dataset.mk != null) { const m = mkState(), st = E.steps(m.from, m.pcs), c = st && st.cands[+mkEl.dataset.mk]; if (c && c.ok) { m.pcs.push(c.pc); render(); } return; }
  if (mkEl && mkEl.dataset.mkend != null) { const m = mkState(), st = E.steps(m.from, m.pcs), en = st && st.ends[+mkEl.dataset.mkend]; if (!en) return;
    const r = E.buildRoute(m.from, en.n, en.pcs); if (!r) return toast('このルートは組み立てられませんでした'); rCache.set(r.id, r); location.hash = '#/route/' + encodeURIComponent(r.id); return; }
  if (d.adj || d.unadj) { const r = curRoute(); if (!r) return; const k = d.adj || d.unadj, v = d.v;
    if (d.unadj) return adjust(r, { [k]: cond[k].filter((x) => x !== v) }, v + 'の調整を外しました');
    const other = { mustSt: 'noSt', noSt: 'mustSt', noLine: 'mustLine' }[k];
    return adjust(r, { [k]: cond[k].concat(v), [other]: cond[other].filter((x) => x !== v) }, k === 'noLine' ? v + 'に乗らないルートにしました' : v + 'を通らないルートにしました'); }
  const act = d.act; if (!act) return;
  if (act === 'mkUndo') { mkState().pcs.pop(); return render(); }
  if (act === 'mkReset') { mkState().pcs = []; return render(); }
  if (act === 'adjMust') { const r = routeById(d.id); if (!r) return; const yo = {}; E.stations.forEach((x) => { yo[x.n] = x.y; }); const opts = E.nodes.filter((n) => !r.passed.includes(n) && !cond.mustSt.includes(n)).sort((x, y) => (yo[x] < yo[y] ? -1 : 1)).map((n) => ({ n }));
    return openSheet('寄りたい駅', opts, (o) => adjust(r, { mustSt: cond.mustSt.concat(o.n), noSt: cond.noSt.filter((x) => x !== o.n) }, o.n + 'を通るルートにしました')); }
  if (act === 'sort') { ui.sort = (ui.sort + 1) % SORTS.length; return render(); }
  if (act === 'reset') { const keep = { to: cond.to, start: cond.start, end: cond.end, want: cond.want, avoid: cond.avoid }; setCond(Object.assign({}, DEF, keep)); return render(); }
  if (act === 'save') { if (isSaved(d.id)) { saved = saved.filter((s) => s.id !== d.id); toast('保存をやめました'); } else { saved.unshift({ id: d.id, at: Date.now(), date: null }); toast('保存しました'); } save(LS.saved, saved); return render(); }
  if (act === 'share') { const r = routeById(d.id), url = location.href.split('#')[0] + '#/route/' + encodeURIComponent(r.id), text = `${r.from}→${toTxt(r.from, r.to)} ${rtk(r).fare}円で${r.km}km。${r.via}`;
    if (navigator.share) navigator.share({ title: '大回りルート', text, url }).catch(() => {}); else if (navigator.clipboard) navigator.clipboard.writeText(text + ' ' + url).then(() => toast('リンクをコピーしました'), () => toast('コピーできませんでした')); else toast('この端末では共有できません'); return; }
  if (act === 'go') { ride = { id: d.id, at: Date.now() }; save(LS.ride, ride); ui.pos = null;
    const s = saved.find((x) => x.id === d.id); if (s) { s.date = ymd(today()); save(LS.saved, saved); } return; }
  if (act === 'rode') { ridden = ridden.includes(d.id) ? ridden.filter((x) => x !== d.id) : ridden.concat(d.id); save(LS.ridden, ridden); toast(ridden.includes(d.id) ? '乗ったルートとして記録しました' : '記録を取り消しました'); return render(); }
  if (act === 'replan') return toast('ここからの組み直しは、まだ使えません');
  if (act === 'near') { if (!navigator.geolocation) return toast('この端末では位置情報を使えません');
    navigator.geolocation.getCurrentPosition((p) => { ui.near = E.nearest(p.coords.latitude, p.coords.longitude, 5); render(); }, () => toast('現在地を取れませんでした'), { maximumAge: 60000, timeout: 10000 }); return; }
});
app.addEventListener('change', (e) => { const k = e.target.dataset.tin; if (k && toMin(e.target.value) >= 0) { setCond({ [k]: e.target.value }); render(); } });
app.addEventListener('input', (e) => { if (e.target.id === 'q') { ui.q = e.target.value; render(); } });
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

/* ===== 新しい版のお知らせ・オフライン ===== */
const isNewer = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
async function checkVersion() {
  try { const r = await fetch('changelog.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return; const j = await r.json();
    if (j[0] && isNewer(j[0].version, APP_VERSION)) toast('新しいバージョンがあります', '更新', () => location.reload()); } catch (e) {}
}
if (location.protocol.startsWith('http')) { checkVersion(); setInterval(checkVersion, 600000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {}); }

render();
</script>
