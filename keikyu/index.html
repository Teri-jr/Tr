<meta charset="utf-8">
<title>運転士タブレット GPS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 乗務員タブレット画面の再現。左に時計列、右に種別ヘッダ＋駅一覧。下に操作バー。単一ダーク(タブレット画面)で固定 */
:root{
  color-scheme: dark;
  --bg:#0b0f16;          /* 端末ベゼル外 */
  --screen:#000000;      /* 画面地（完全な黒） */
  --panel:#1c2431;       /* 行・パネル */
  --line:#2c3646;        /* 罫線 */
  --fg:#e9eef6;
  --muted:#8b97a8;
  --kind-kaitoku:#00a040; --sub-kaitoku:#00773a; /* 快特：緑 */
  --kind-tokkyu:#8f0012;  --sub-tokkyu:#c40018;  /* 特急：濃いめの赤 */
  --kind-kyuko:#4fb6e8;   --sub-kyuko:#1f6fc4;   /* 急行：薄い水色、次駅は濃い青（実機画面より） */
  --kind-futsu:#111111;   --sub-futsu:#f2f2ee;   /* 普通：黒 */
  --dest:#1f5fbf;
  --dest-hi:#3f86e8;
  --ok:#2bb04a;
  --warn:#e3a323;
  --bad:#e2483d;
  --track:#4b86d6;
  --f-ui:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"BIZ UDGothic","Hiragino Sans","Noto Sans JP",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--dest-hi);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);line-height:1.6}

/* 画面の高さいっぱいに広げ、駅一覧が残りの高さを全部使う */
.device{max-width:1100px;margin:0 auto;height:100%}
.screen{background:var(--screen);border-radius:8px;overflow:auto;height:100%;min-height:520px;display:flex;flex-direction:column}

/* ---- 設定画面 ---- */
.setup{padding:20px;display:grid;gap:18px;max-width:560px;margin:0 auto;width:100%}
.setup h1{font-size:22px;margin:4px 0 0;text-wrap:balance}
.setup p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.field{display:grid;gap:8px}
.field > span{font-size:12px;color:var(--muted);letter-spacing:.06em}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:15px;min-width:72px}
.seg button[aria-pressed="true"]{background:var(--dest);border-color:var(--dest-hi)}
.secpick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.secpick select,.secpick button,.secpick input[type=time]{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;font-family:inherit}
.secpick select{flex:1;min-width:120px}
.secpick input[type=time]{font-family:var(--f-num);flex:1;min-width:140px}
.go{background:var(--ok);border:0;border-radius:10px;padding:14px;font-size:17px;font-weight:700;color:#06130a}
.go:disabled{opacity:.4;cursor:not-allowed}
.upd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#24304a;border:1px solid var(--dest-hi);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.5}
.upd span{flex:1;min-width:200px}
.updGo{background:var(--warn)!important;color:#111!important;border:0!important;border-radius:6px;padding:8px 12px;font-weight:700}
.note{max-width:980px;margin:10px auto 0;font-size:12px;color:var(--muted);line-height:1.6}

/* ---- 乗務画面：左の計器 ---- */
.run{display:grid;grid-template-columns:150px 1fr;grid-template-rows:minmax(0,1fr);gap:10px;padding:8px 10px 10px;flex:1;min-height:0}
.side{display:flex;flex-direction:column;gap:8px;align-items:center}
#clock{width:120px;height:120px}
.dclock{font-size:20px;letter-spacing:.08em}
.mset{font-size:11px;color:var(--muted);line-height:1.5;align-self:stretch;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.menu{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.menubox{background:#10151e;border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:16px;width:min(480px,100%);max-height:100%;overflow:auto}
.meter{width:100%;background:var(--panel);border-radius:8px;padding:8px;display:grid;gap:2px;text-align:center}
.meter small{font-size:10px;color:var(--muted);letter-spacing:.06em}
.meter b{font-size:24px}
.meter b span{font-size:12px;font-weight:400;color:var(--muted)}

/* ---- ヘッダー（種別・次駅・両数）と、その上に重ねる表示 ---- */
.main{display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0;position:relative}
.head{display:grid;grid-template-columns:1fr 150px;grid-template-rows:auto auto;border-radius:4px;overflow:hidden;position:relative;container-type:inline-size;flex-shrink:0}
.kind{grid-column:1;grid-row:1;background:var(--kind-kaitoku);text-align:center;font-size:88px;font-weight:700;letter-spacing:.4em;padding:6px 0 6px .4em;line-height:1.1}
.next{grid-column:1;grid-row:2;background:var(--ks,var(--dest));color:var(--ksf,#fff);border-top:2px solid var(--screen);text-align:center;font-size:56px;font-weight:700;padding:8px 4px;white-space:nowrap;overflow:hidden}
.next.msg{background:#efefea;color:#111;font-weight:400;font-size:min(56px,8.6cqw)!important;letter-spacing:.02em}
.next.msg.blink{background:#111;color:#f4f4f0}
.next.sec{background:#f4f4f0;color:#e60012;font-size:min(56px,8.6cqw)!important;letter-spacing:.02em}
.next.sec.blink{background:#e60012;color:#f4f4f0}
/* スキット注意は幅に合わせて文字を縮めて1行に収める */
.next.skid{background:#1f6fd1;color:#ffe23a;letter-spacing:.02em;font-size:min(56px,7.2cqw)!important}
.next.skid.blink{background:#ffe23a;color:#1f6fd1}
.next.taihi{background:#ecebe6;color:#111;font-weight:700;font-size:min(56px,6cqw)!important;letter-spacing:0}
.next.updmsg{font-size:min(56px,6.4cqw)!important}
.next.blank{color:transparent}
.cars{grid-column:2;grid-row:1/3;background:var(--ks,var(--dest));color:var(--ksf,#fff);border-left:2px solid var(--screen);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cars b{font-size:60px;line-height:1}
.cars span{font-size:20px}
.hover{position:absolute;top:0;bottom:0;left:0;background:#efefea;color:#111;display:grid;place-items:center;font-size:160px;line-height:1;font-weight:400;letter-spacing:.06em;z-index:2;white-space:nowrap;overflow:hidden}
.hover.blink{background:#111;color:#f4f4f0}
#hStop{right:150px}
#hCars{right:0}
/* 新バージョンのお知らせ：種別の欄を「更新／あとで」に分ける */
.updkind{grid-column:1;grid-row:1;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--screen)}
.updkind button{border:0;font-weight:700;font-size:min(64px,9cqw);letter-spacing:.1em;border-radius:0}
.updkind .updGo{border-radius:0!important;padding:0}
#updLater{background:#3a4352;color:#fff}

/* ---- 状態の行 ---- */
.statusrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.delay,.gps,.dbadge{display:inline-flex;align-items:center;gap:6px;background:var(--ok);color:#06130a;border-radius:4px;padding:4px 10px;font-size:13px;font-weight:700}
.delay.warn,.gps.warn{background:var(--warn)}
.delay.bad,.gps.bad,.dbadge{background:var(--bad);color:#fff}
.gps svg{width:14px;height:14px}
.gps.lost svg{opacity:.25}
.dist{font-size:13px;color:var(--muted)}
.annc{margin-left:auto;font-size:13px;background:#24304a;border:1px solid var(--dest);border-radius:4px;padding:3px 8px;opacity:0;transition:opacity .2s}
.annc.on{opacity:1}
.dbg{font-size:11px;color:var(--muted);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- 駅一覧 ---- */
.listhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 2px;border-bottom:1px solid var(--line);flex-shrink:0}
.listhead span:last-child{color:var(--muted);font-size:11px}
.list{overflow-y:auto;flex:1;min-height:200px;scroll-behavior:smooth}
.row{display:grid;grid-template-columns:minmax(0,1fr) 88px 30px 88px;align-items:center;gap:6px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:15px}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm::before{content:"";display:inline-block;width:14px}
.row .t{text-align:right}
.row .tb{font-size:10px;border:1px solid var(--warn);color:var(--warn);border-radius:3px;padding:0 3px;margin-left:4px;vertical-align:2px}
.row .dep.red{color:#ff3b30;font-weight:700}
.row.pass-row{color:var(--muted);font-size:14px}
.row.passed{opacity:.35}
.row.target{background:#1d2b42}
.row.target .nm{color:#fff;font-weight:700}
.row.target .nm::before{content:"▶";color:var(--warn);font-size:11px;vertical-align:1px}
.trk{width:22px;height:22px;border-radius:50%;border:2px solid var(--track);color:var(--fg);display:grid;place-items:center;font-size:12px;font-weight:700;justify-self:center}
.trk.tbk{background:var(--warn);border-color:var(--warn);color:#111}
.pass{justify-self:center;width:16px;height:18px;background:var(--track);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}

/* ---- 操作バー ---- */
.ctrl{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 10px;border-top:1px solid var(--line);background:#10151e}
.ctrl button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.ctrl button[aria-pressed="true"]{background:var(--dest);border-color:var(--dest-hi)}
#taihiBtn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#111}
.ctrl .sp{flex:1}

/* ---- 在線図（横向きで幅があるときだけ出す） ---- */
.zaisen{display:none}
.zn{font-size:13px;fill:#e9eef6}
.zn.zpass{fill:#8b97a8}
.zn.past{fill:#56606e}
.zn.tgt{fill:#fff;font-weight:700;font-size:16px}
.ztk{font-size:11px;font-weight:700;fill:#c3cad6;stroke:#05080d;stroke-width:4px;paint-order:stroke;font-family:var(--f-num)}

/* ---- 画面サイズ別 ---- */
/* 大きい画面（iPad縦、または横向きで幅が広い）：上の表示を大きく、駅一覧も大きめ */
@media (orientation:portrait) and (min-width:700px),(orientation:landscape) and (min-width:1100px) and (min-height:640px){
  .listhead{font-size:16px}
  .kind{font-size:min(160px,19cqw)!important;line-height:1.05;letter-spacing:.25em;padding-left:.25em;white-space:nowrap}
  .next{font-size:min(110px,12cqw)!important}
  .cars b{font-size:96px}
  .cars span{font-size:28px}
  #hStop{font-size:min(220px,31cqw)!important}
}
/* iPad縦 */
@media (orientation:portrait) and (min-width:700px){
  #clock{width:130px;height:130px}
  .head{grid-template-columns:1fr 170px}
  #hStop{right:170px}
  .hover{font-size:220px!important}
}
/* 横向きで幅が広い：左は縦向きと同じ表示、残りに在線図 */
@media (orientation:landscape) and (min-width:1100px) and (min-height:640px){
  .device{max-width:none}
  .run{grid-template-columns:120px minmax(0,42vw) minmax(0,1fr)}
  .row{font-size:18px;padding:11px 6px;grid-template-columns:minmax(0,1fr) 96px 32px 96px}
  .trk{width:30px;height:30px;font-size:15px}
  .ctrl button{font-size:15px;padding:10px 12px}
  #clock{width:110px;height:110px}
  .hover{font-size:min(220px,30cqw)!important}
  .zaisen{display:flex;flex-direction:column;min-height:0;min-width:0;background:#05080d;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .zh{font-size:13px;color:var(--muted);padding:8px 12px 4px}
  .zbody{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth}
  #zsvg{display:block;width:100%}
}
/* スマホ（縦・横）：画面の高さに詰め込まずページごとスクロール。操作ボタンは下に固定 */
@media (max-width:640px),(max-height:600px){
  .device,.screen{height:auto}
  .screen{overflow:visible;min-height:0}
  #runv{flex:none!important}
  .run{grid-template-rows:auto auto}
  .list{flex:none;min-height:0;max-height:60dvh}
  .ctrl{position:sticky;bottom:0;z-index:6;padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
  .hover{font-size:96px}
  .kind{font-size:56px!important}
  .next{font-size:34px!important}
  .cars b{font-size:40px}
}
/* 横向きで高さが低い画面 */
@media (max-height:600px) and (min-width:641px){
  .run{grid-template-columns:130px 1fr}
  #clock{width:70px;height:70px}
  .head{grid-template-columns:1fr 110px}
  #hStop{right:110px}
}
/* スマホ縦：計器を横に並べて詰め、駅一覧の高さを稼ぐ */
@media (max-width:640px){
  .run{grid-template-columns:1fr;gap:6px;padding:6px}
  .side{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:6px}
  #clock{width:60px;height:60px}
  .dclock{font-size:16px}
  .meter{width:auto;flex:1;min-width:90px;padding:4px 6px}
  .meter b{font-size:18px}
  .ctrl{gap:4px;padding:6px 6px max(6px,env(safe-area-inset-bottom,0px))}
  .ctrl .sp{display:none}
  .ctrl button{font-size:12px;padding:7px 8px}
  .row{grid-template-columns:minmax(0,1fr) 76px 26px 76px;font-size:14px;padding:7px 4px}
  .head{grid-template-columns:1fr 96px}
  #hStop{right:96px}
  .cars span{font-size:14px}
}
@media (prefers-reduced-motion:reduce){.list,.zbody{scroll-behavior:auto}.annc{transition:none}}
</style>

<div class="device">
  <div class="screen">

    <section class="setup" id="setup">
      <div>
        <h1 id="appTitle">運転士タブレット（GPS連動）</h1>
        <div class="upd" id="updSetup" hidden><span id="updSetupTxt"></span><button type="button" class="updGo">更新する</button></div>
        <div class="hint">バージョン <span id="appVer"></span></div>
      </div>
      <div class="field"><span>路線</span>
        <div class="seg" data-k="net">
          <button aria-pressed="true" data-v="keikyu">京急線</button>
          <button aria-pressed="false" data-v="jr">JR横須賀線（品川〜戸塚）</button>
          <button aria-pressed="false" data-v="tokaido">JR東海道線（品川〜茅ヶ崎）</button>
          <button aria-pressed="false" data-v="nambu">JR南武線</button>
          <button aria-pressed="false" data-v="keihin">JR京浜東北・根岸線</button>
        </div></div>
      <div class="field"><span>位置</span>
        <div class="seg" data-k="src">
          <button aria-pressed="true" data-v="gps">GPS（実際に乗る）</button>
          <button aria-pressed="false" data-v="test">テスト走行（GPSを模擬）</button>
        </div></div>
      <div class="field"><span>種別</span>
        <div class="seg" data-k="kind">
          <button aria-pressed="true" data-v="kaitoku">快特</button>
          <button aria-pressed="false" data-v="tokkyu">特急</button>
          <button aria-pressed="false" data-v="kyuko">急行</button>
          <button aria-pressed="false" data-v="futsu">普通</button>
        </div></div>
      <div class="field"><span>区間</span>
        <div class="secpick">
          <select id="secFrom" aria-label="乗車駅"></select>
          <span>→</span>
          <select id="secTo" aria-label="降車駅"></select>
          <button type="button" id="secSwap">入れ替え</button>
          <button type="button" id="secHere">現在地から</button>
        </div>
        <div class="seg" id="secPresets"></div>
        <div id="secErr" style="color:var(--bad);font-size:12px" hidden>乗車駅と降車駅が同じ。どちらかを変えて</div>
        <div class="hint" id="hereMsg" hidden></div></div>
      <div class="field"><span>発車時刻（任意）</span>
        <div class="secpick">
          <input type="time" id="sched" step="1" aria-label="乗車駅の発車時刻">
          <button type="button" id="schedClr">消す</button>
        </div></div>
      <div class="field testonly" hidden><span>テストの速さ</span>
        <div class="seg" data-k="speed">
          <button aria-pressed="true" data-v="1">等倍</button>
          <button aria-pressed="false" data-v="5">5倍速</button>
          <button aria-pressed="false" data-v="20">20倍速</button>
        </div></div>
      <div class="field"><span>両数</span>
        <div class="seg" data-k="cars"></div></div>
      <div class="field"><span>乗務</span><div class="seg" data-k="crew"><button data-v="two">ツーマン</button><button data-v="one">ワンマン</button></div></div>
      <div class="field"><span>乗っている位置</span>
        <div class="seg" data-k="pos">
          <button aria-pressed="true" data-v="head">先頭</button>
          <button aria-pressed="false" data-v="mid">中ほど</button>
          <button aria-pressed="false" data-v="tail">最後尾</button>
        </div></div>
      <div class="field"><span>天候</span>
        <div class="seg" data-k="weather">
          <button aria-pressed="true" data-v="fine">晴れ</button>
          <button aria-pressed="false" data-v="rain">雨（スキット注意）</button>
        </div></div>
      <div class="field"><span>ダイヤ</span>
        <div class="seg" data-k="disorder">
          <button aria-pressed="true" data-v="off">平常</button>
          <button aria-pressed="false" data-v="on">ダイヤ乱れ</button>
        </div></div>
      <div class="field"><span>測位の頻度</span>
        <div class="seg" data-k="rate">
          <button aria-pressed="true" data-v="std">標準</button>
          <button aria-pressed="false" data-v="hi">高頻度</button>
        </div></div>
      <div class="field"><span>音声</span>
        <div class="seg" data-k="voice">
          <button aria-pressed="true" data-v="on">読み上げあり</button>
          <button aria-pressed="false" data-v="off">なし</button>
        </div></div>
      <div class="hint" id="geoWarn" hidden></div>
      <button class="go" id="start">乗務開始</button>
    </section>

    <section id="runv" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="run">
        <div class="side">
          <canvas id="clock" width="240" height="240" aria-label="時計"></canvas>
          <div class="dclock num" id="dclock">--:--:--</div>
          <button class="mset" id="mset" type="button" aria-haspopup="dialog">☰ 放送：自動<br>音量：11</button>
          <div class="meter"><small>速度</small><b class="num" id="spd">0<span> km/h</span></b></div>
          <div class="meter"><small>次停車駅まで</small><b class="num" id="rem">0<span> m</span></b></div>
        </div>
        <div class="main">
          <div class="head">
            <div class="kind" id="kindLbl">快特</div>
            <div class="next" id="nextLbl">　</div>
            <div class="cars"><b class="num" id="carsLbl">8</b><span id="crewLbl">ツーマン</span></div>
            <div class="updkind" id="updKind" hidden><button type="button" class="updGo">更新</button><button type="button" id="updLater">あとで</button></div>
            <div class="hover" id="hStop" hidden>停車</div>
            <div class="hover" id="hCars" hidden>8両</div>
          </div>

function makeGeom(pts){

}

let LINE_ORDER,LINES,PLAT_DATA,ADJ;
function buildLines(geo,order){
LINE_ORDER=order; LINES={};
for(const ln of LINE_ORDER){ const g=makeGeom(geo[ln].track); LINES[ln]={g,st:geo[ln].stations.map(([name,lat,lon,len])=>({name,lat,lon,len,s:projectOn(g,lat,lon).s}))}; }
// 駅の線の長さ(m)。実際のホームより短い駅が多いので、ホームの長さは「これ」と「列車長＋20m」の長いほうとする
PLAT_DATA={}; for(const ln of LINE_ORDER) for(const t of LINES[ln].st) PLAT_DATA[t.name]=Math.max(PLAT_DATA[t.name]||0,t.len);
// 駅のつながり（隣どうし）。区間はこの上の最短経路
ADJ={};
for(const ln of LINE_ORDER){ const st=LINES[ln].st; for(let i=0;i+1<st.length;i++){ const a=st[i],b=st[i+1],w=Math.abs(b.s-a.s);
  (ADJ[a.name]=ADJ[a.name]||[]).push({to:b.name,line:ln,w}); (ADJ[b.name]=ADJ[b.name]||[]).push({to:a.name,line:ln,w}); } }
}
// 最短経路：[{from,to,line}] の並び
function findPath(a,b){
  const dist={[a]:0},prev={},done=new Set();
  while(true){
    let u=null; for(const n in dist) if(!done.has(n)&&(u==null||dist[n]<dist[u])) u=n;
    if(u==null||u===b) break; done.add(u);
    for(const e of ADJ[u]||[]){ const d=dist[u]+e.w; if(dist[e.to]==null||d<dist[e.to]){ dist[e.to]=d; prev[e.to]={from:u,line:e.line}; } }
  }
  const out=[]; for(let n=b;n!==a;n=prev[n].from) out.unshift({from:prev[n].from,to:n,line:prev[n].line});
  return out;
}
const sOf=(ln,name)=>LINES[ln].st.find(t=>t.name===name);

const GRID=10;
function curveArray(g,cap){
  const n=Math.ceil(g.len/GRID)+1, raw=new Float32Array(n), out=new Float32Array(n);
  for(let k=0;k<n;k++){
    const s=k*GRID; let d=headingOn(g,s+100)-headingOn(g,s-100); d=Math.abs(Math.atan2(Math.sin(d),Math.cos(d)));
    raw[k]=Math.min(cap(s),d<1e-4?200:Math.min(200,CURVE_K*Math.sqrt(200/d)));

  return out;
}

function nextStop(route,i){for(let j=i+1;j<route.length;j++) if(route[j].stop) return j; return -1;}

function makeEnv(route,k,x0,x1,decel){
  const n=Math.max(1,Math.ceil((x1-x0)/GRID)), e=new Float32Array(n+1), vmax=k.vmax/3.6;
  e[n]=0;

function step(s,route,k,decel,rand,onEvent){
  if(s.mode==="end") return;

    const hx=s.halt&&!s.halt.done?s.halt.x:route[s.target].x;

  }

function announceUpdate(){

// 区間の線路を、通る線をつないで作る。x は乗車駅の中心を0とした線路沿いの距離(m)
function buildRoute(){
  const k=KINDS[cfg.kind];
  const [from,to]=cfg.sec.split("|");
  const path=findPath(from,to);
  const pts=[], marks=[], legs=[], EXT=300;
  const add=(arr)=>{ for(const q of arr){ const l=pts[pts.length-1]; if(!l||Math.abs(l[0]-q[0])>1e-7||Math.abs(l[1]-q[1])>1e-7) pts.push(q); } };
  // 乗車駅の手前に300m（GPSの位置が乗車駅の後ろ側でも線路に乗るように）
  const e0=path[0], g0=LINES[e0.line].g, s00=sOf(e0.line,e0.from).s, dir0=sOf(e0.line,e0.to).s>s00?1:-1;
  add(cutGeom(g0,s00-dir0*EXT,s00)); marks.push({name:from,i:pts.length-1,line:e0.line,down:dir0>0,prevLine:null,nextLine:e0.line,nextDown:dir0>0});
  path.forEach((e,n)=>{
    const g=LINES[e.line].g, sa=sOf(e.line,e.from).s, sb=sOf(e.line,e.to).s, i0=pts.length-1;
    add(cutGeom(g,sa,sb)); legs.push({i0,i1:pts.length-1,line:e.line});
    const nx=path[n+1];
    marks.push({name:e.to,i:pts.length-1,line:nx?nx.line:e.line,down:nx?sOf(nx.line,nx.to).s>sOf(nx.line,nx.from).s:sb>sa,
      prevLine:e.line,prevDown:sb>sa,nextLine:nx&&nx.line,nextDown:nx&&sOf(nx.line,nx.to).s>sOf(nx.line,nx.from).s});
  });
  const eL=path[path.length-1], gL=LINES[eL.line].g, sL=sOf(eL.line,eL.to).s, dirL=sL>sOf(eL.line,eL.from).s?1:-1;
  add(cutGeom(gL,sL,sL+dirL*EXT));
  const rg=makeGeom(pts), E=rg.S[marks[0].i];
  // 停車駅の x は「止まったときのスマホの位置」：先頭がホームの進行方向の端から10m手前に止まるとして、乗っている位置のぶん後ろへ
  const L=trainLen(), back={head:10,mid:L/2,tail:L-10}[cfg.pos]||10;
  const r=marks.map(({name,i,line,down,prevLine,prevDown,nextLine,nextDown},n)=>{
    const lines=new Set([prevLine,nextLine].filter(Boolean)), isEnd=n===0||n===marks.length-1;
    const lay=parseLayout(LAYOUT[(lines.has("大師線")&&name==="京急川崎")?"大師線:京急川崎":name]||SOTAI);
    const tok=(t)=>lay.find(x=>x.t===t);
    const main=tok(down?"D":"U"), sideT=tok(down?"d":"u");
    // 止まるときの番線：本線（通過線の駅はホームのある副本線）。分岐駅と終点は個別に
    let stopNo=main&&!main.pass?main.n:(sideT?sideT.n:"1");
    if(name==="生麦"&&down) stopNo="2";
    if(name==="京急蒲田"&&lines.has("空港線")) stopNo=lines.has("本線")?((prevLine==="本線"?prevDown:nextDown)?"1":"4"):(n===0?"1":"4");
    if(name==="京急川崎"&&lines.has("大師線")) stopNo="3";
    if(name==="金沢八景"&&lines.has("逗子線")) stopNo=down?"2":"3";
    if(name==="堀ノ内"&&lines.has("久里浜線")&&down) stopNo="2";
    if(TERMINAL.has(name)&&isEnd&&!(name==="泉岳寺")) stopNo=lay.find(x=>x.n==="1")?"1":stopNo;
    const taihiOK=!!TAIHI[name]&&(TAIHI[name]==="both"||TAIHI[name]===(down?"down":"up"));
    const cx=rg.S[i]-E, plen=Math.max(PLAT_DATA[name]||120,L+20), pLo=cx-plen/2, pHi=cx+plen/2;
    const stop=(k.stops? k.stops.includes(name):true) || ALL_STOP_LINES.has(line) || ALL_STOP_ST.has(name) || name===from || name===to;
    return {name, line, cx, pLo, pHi, plen, x:stop?Math.max(pLo,pHi-10-back):cx, stop,
      down, lay, track:stopNo, mainNo:main&&!main.pass?main.n:"", side:taihiOK&&sideT?sideT.n:"", taihiOK,
      dwell: k.long[name]||k.dwell};
  });
  const lineAt=s=>{ for(const l of legs) if(s<=rg.S[l.i1]) return l.line; return legs[legs.length-1].line; };
  const curve=curveArray(rg,s=>LINE_VMAX[lineAt(s)]||200);
  r.project=(lat,lon)=>{ const p=projectOn(rg,lat,lon); return {x:p.s-E,off:p.off}; };
  r.latLonAt=x=>latLonOn(rg,x+E);
  r.curveAt=x=>curve[Math.max(0,Math.min(curve.length-1,Math.round((x+E)/GRID)))];
  r.lines=[...new Set(path.map(e=>e.line))];
  return r;
}

// route:区間の駅  plan:走行モデルの予定(秒)  planEpoch:予定の0秒にあたる時刻(ms)
// G:GPSから判定した列車の状態  SIM:テスト走行の模擬列車  DR:GPSが切れている間の推定
let route,K,plan,planEpoch=0,schedFixed=false,G,SIM=null,DR=null,testMode=false,simEpoch=0,mult=1,paused=false;

function fmt(ms){ const d=new Date(ms); return [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,"0")).join(":"); }
// 予定上、位置xを通る時刻(秒)
function planTimeAt(x){
  const tr=plan.traj; let lo=0,hi=tr.length-1;
  if(x>=tr[hi][1]) return tr[hi][0];
  while(lo<hi){const m=(lo+hi)>>1; if(tr[m][1]>=x) hi=m; else lo=m+1;}
  if(lo===0) return tr[0][0];
  const [t0,x0]=tr[lo-1],[t1,x1]=tr[lo];
  return x1>x0? t0+(x-x0)/(x1-x0)*(t1-t0) : t1;
}

// ---- GPSの測位を受け取る ----
function newG(){
  return {mode:"dwell",last:0,target:nextStop(route,0),started:false,x:0,v:0,fixT:null,acc:null,off:0,offRoute:false,lastSeen:null,geoErr:"",
    events:{},announced:{},holdX:0,dwellStart:nowMs(),haltStart:0,stillSince:null,moveSince:null,relX:null,taihiAt:-1,taihiPending:false,delay:0};
}
function onFix(f){
  if(!G||(G.lastSeen!=null&&f.t<=G.lastSeen)) return;
  const p=route.project(f.lat,f.lon);
  G.acc=f.acc; G.off=p.off; G.lastSeen=f.t; G.geoErr=""; (G.fixLog=G.fixLog||[]).push(f.t); if(G.fixLog.length>20) G.fixLog.shift();
  G.offRoute=p.off>OFF_MAX; if(G.offRoute) return;
  const xm=p.x, sp=(f.speed!=null&&isFinite(f.speed)&&f.speed>=0)?f.speed:null; G.sp=sp;
  if(G.fixT==null||f.t-G.fixT>STALE_MS){
    // 最初の測位、またはGPSが切れたあと：測位の位置に合わせ直す
    G.x=xm; G.v=sp??(DR?DR.v:0); G.fixT=f.t; DR=null;
    if(!G.started) initPosition(xm,f.t);
    return;
  }
  // 位置と速度をなめらかにする（精度が良いほど測位を信じる）
  const dt=(f.t-G.fixT)/1000; G.fixT=f.t;
  const pred=G.x+G.v*dt, r=xm-pred, a1=f.acc<=15?0.6:f.acc<=40?0.35:0.15, a=1-Math.pow(1-a1,Math.min(1,dt)); // 測位が多くても1秒あたりの効き方は同じにする
  G.x=pred+a*r;
  let v=G.v+0.3*a*r/Math.max(dt,1); if(sp!=null){ const w=1-Math.pow(0.3,Math.min(1,dt)); v=(1-w)*v+w*sp; }
  G.v=Math.max(0,Math.min(v,45));
}
// 乗務開始後、最初の測位で今どこにいるかを決める（途中から使い始めてもよい）
function initPosition(x,now){
  G.started=true;
  let j=-1;
  route.forEach((r,i)=>{ if(r.stop&&inPlat(r,x)&&(j<0||Math.abs(r.x-x)<Math.abs(route[j].x-x))) j=i; });
  if(j===0||(j<0&&x<0)){ G.mode="dwell"; G.last=0; G.target=nextStop(route,0); G.holdX=x; G.dwellStart=now; return; }
  if(j>0){
    G.last=j; G.target=nextStop(route,j); G.mode=j===route.length-1?"end":"dwell"; G.holdX=x; G.dwellStart=now;
    if(!schedFixed){ planEpoch=now-plan.ev[j].arr*1000; schedFixed=true; }
  } else {
    let l=0; route.forEach((r,i)=>{ if(r.stop&&r.x<x) l=i; });
    G.last=l; G.target=nextStop(route,l); G.mode="run";
    if(!schedFixed){ planEpoch=now-planTimeAt(x)*1000; schedFixed=true; }
  }
  renderList();
}
// GPSが切れている間の推定：走っていたら、最後の位置・速度から走行モデルで走らせる（次の停車駅で止まる）。
// 止まっていたら止まったままとみなす（止まっているとスマホが測位を出さないことがあるので、勝手に発車させない）
function makeDR(x,v,now){
  const d={x,v,t:0,last:G.last,target:G.target,events:{},halt:null,remain:1e9,acc:0};
  // 発車直後(30秒)は速度がまだ小さくても走っているとみなす
  if(G.mode==="run"&&G.target>=0&&(v>=STILL_V||now-(G.depAnnAt||0)<30000)){ d.mode="run"; d.env=makeEnv(route,K,x,Math.max(x+1,route[G.target].x),DECEL); }
  else { d.mode="halt"; d.v=0; }
  return d;
}
function estimate(now,dt){
  if(!G.started) return {x:0,v:0,src:"none"};
  const age=now-G.fixT;
  if(age<=STALE_MS){ DR=null; return {x:G.x+G.v*Math.max(0,age)/1000,v:G.v,src:"gps"}; }
  if(!DR) DR=makeDR(G.x+G.v*STALE_MS/1000,G.v,now);
  // 推定で駅に止まったら、そのまま止まっていることにする（勝手に発車させると、実際より先へ進んでしまう）
  DR.acc+=dt; while(DR.acc>=DT){ DR.acc-=DT; step(DR,route,K,DECEL,null,t=>{ if(t==="arr") DR.remain=1e9; }); }
  return {x:DR.x,v:DR.v,src:"dr"};
}

// ---- 停車・通過・駅間停車の判定 ----
function track(e,now){
  if(!G.started||G.mode==="end") return;
  const x=e.x, v=e.v;
  if(G.mode==="run"){
    for(let i=G.last+1;i<G.target;i++){ const ev=G.events[i]=G.events[i]||{}; if(ev.pass==null&&x>=route[i].x) ev.pass=now; }
    const tg=route[G.target];
    G.stillSince=v<STILL_V?(G.stillSince??now):null;
    if(G.stillSince!=null&&now-G.stillSince>=STILL_MS){
      // 発車直後に同じ駅で止まり直した：GPSのぶれで発車と誤判定していたので取り消す
      const from=route[G.last];
      if(G.depFrom==="dwell"&&now-G.depAt<=UNDO_MS&&inPlat(from,x)&&Math.abs(x-from.x)<Math.abs(x-tg.x)){ undoDepart(x); return; }
      if(inPlat(tg,x)) arrive(G.target,G.stillSince,x);
      else { G.mode="halt"; G.holdX=x; G.haltStart=G.stillSince; G.moveSince=null; speak("セクション、注意。","f"); }
      return;
    }
    // 停車駅を過ぎてしまった（GPSが切れている間に停車・発車した等）：停車したことにして先へ進める
    if(x>tg.pHi+ZONE){ arrive(G.target,now,x,true); if(G.mode==="dwell") depart(now,true); }
  } else if(G.mode==="dwell"||G.mode==="halt"){
    // 前へ進んだ分だけ見る（後ろへの跳びは無視）。端末の速度が取れればそれを使う
    const fwd=x-G.holdX, sp=(G.sp!=null&&now-G.lastSeen<=STALE_MS)?G.sp:v;
    const hist=G.xHist=(G.xHist||[]).filter(h=>now-h[0]<=3000); hist.push([now,x]);
    const moving=(sp>MOVE_V&&fwd>-10)||fwd>Math.max(MOVE_DIST,2*(G.acc||10));
    G.moveSince=moving?(G.moveSince??now):null;
    // 直近2秒でも前へ2m以上進み続けている（GPSの跳びは跳んだ先で止まるので、これで弾ける）
    const h2=hist.find(h=>now-h[0]<=2000), going=h2&&now-h2[0]>=1500&&x-h2[1]>2;
    // 5km/h に達するのは動き出して約1.5秒後なので、そのぶん前の時刻を発車とする
    if(G.moveSince!=null&&now-G.moveSince>=MOVE_MS&&going) depart(Math.max(G.mode==="dwell"?G.dwellStart:G.haltStart,G.moveSince-1500));
  }
}
function arrive(i,t,x,silent){
  for(let j=G.last+1;j<i;j++){ const ev=G.events[j]=G.events[j]||{}; if(ev.pass==null) ev.pass=t; }
  G.mode=i===route.length-1?"end":"dwell"; G.last=i; G.holdX=x;
  (G.events[i]=G.events[i]||{}).arr=t;
  G.target=nextStop(route,i); G.dwellStart=t; G.stillSince=null; G.moveSince=null;
  if(!silent&&G.taihiPending&&K.taihi&&route[i].taihiOK) applyTaihi(i);
}
function depart(t,silent){
  const wasHalt=G.mode==="halt";
  G.depFrom=G.mode; G.depAt=t; G.depAnnAt=nowMs(); G.depAnchored=false; G.xHist=[];
  if(G.mode==="dwell"){
    (G.events[G.last]=G.events[G.last]||{}).dep=t;
    if(G.last===0&&!schedFixed){ planEpoch=t-plan.ev[0].dep*1000; schedFixed=true; G.depAnchored=true; renderList(); }
  }
  G.mode="run"; G.stillSince=null; G.moveSince=null;
  if(wasHalt){ flashMsg("解除長標確認",4000); speak("セクション、確認。","f"); return; }
  G.relX=route[G.last].x;
  if(!silent&&G.target>=0) speak(`次は、${route[G.target].name}、停車。`,"f");
}
function undoDepart(x){
  const ev=G.events[G.last]; if(ev) delete ev.dep;
  for(let j=G.last+1;j<route.length;j++){ const e=G.events[j]; if(e) delete e.pass; }
  if(G.depAnchored) schedFixed=false;
  G.mode="dwell"; G.holdX=x; G.stillSince=null; G.moveSince=null; G.depFrom=null; G.relX=null;
  if(G.target>=0) G.announced[G.target]={};
  delete G.announced["rel"+G.last];
}
// 待避を予約中なら、待避する駅（この先で最初に止まる待避駅）
function taihiIdx(){ if(!G||!G.taihiPending||!K.taihi) return -1; for(let i=G.last+1;i<route.length-1;i++) if(route[i].stop&&route[i].taihiOK) return i; return -1; }
const taihiHere=i=>!!G&&(G.taihiAt===i||taihiIdx()===i);
// 待避：停車を合計2分に延ばし、予定時刻もその分後ろにずらす（待避はダイヤ上の予定なので遅延にしない）
function applyTaihi(i){
  if(G.taihiAt===i) return;
  const p=plan.ev[i]||{}, shift=TAIHI_SEC-((p.dep??0)-(p.arr??0));
  if(shift>0){
    const t0=p.dep;
    route.forEach((_,j)=>{ const q=plan.ev[j]; if(!q||j<i) return;
      if(j===i){ if(q.dep!=null) q.dep+=shift; } else { ["arr","dep","pass"].forEach(k=>{ if(q[k]!=null) q[k]+=shift; }); } });
    plan.traj.forEach(s=>{ if(s[0]>=t0) s[0]+=shift; });
  }
  if(testMode&&SIM.mode==="dwell"&&SIM.last===i) SIM.remain=Math.max(SIM.remain,TAIHI_SEC-(SIM.t-SIM.dwellStart));
  G.taihiAt=i; G.taihiPending=false; $("taihiBtn").setAttribute("aria-pressed","false");
  renderList(); speak("待避","f");
}

// ---- 読み上げのタイミング（GPSの距離と速度で発火） ----
// 「停止位置」→0.8秒→「○」を、20km/h以下になるまで繰り返す
function stopPosLoop(k,v){
  if(G.mode!=="run"||G.target!==k||v<=20/3.6) return;
  const a=G.announced[k], n=performance.now();
  if(n<(a.posNext||0)) return;
  if(a.pos!==1){ speak("停止位置","f"); a.pos=1; a.posNext=n+300; a.gapAt=0; }
  else { if(!a.gapAt){ a.gapAt=n+800/Math.max(1,mult); return; } if(n<a.gapAt) return; speak(String(cfg.cars),"f"); a.pos=2; a.posNext=n+300; }
}
function checkApproach(e){
  if(G.mode!=="run"||G.target<0) return;
  const x=e.x, v=e.v, key=G.target, d=route[key].x-x;
  const a=G.announced[key]=G.announced[key]||{};
  // 発車後、列車長ぶん進んだら「解除長標確認」
  const rk="rel"+G.last;
  if(G.relX!=null&&!G.announced[rk]&&x>=G.relX+(+cfg.cars)*20+120&&d>900){G.announced[rk]=1; flashMsg("解除長標確認",4500);}
  // 停車駅へのブレーキをかけ始める距離（今の速度で止まれる距離＋余裕）で「次は停車」×2 → ホーム手前で「○両、停車」
  // 距離はどれも停止位置まで。「8両、停車」は先頭がホームに入る約130m手前、「次は停車」はさらに約250m手前（速いときは止まれる距離＋250m）
  const plat=route[key].plen-10, nowR=performance.now();
  // 「次は停車」はホームの約350m手前（速いときは止まれる距離＋250m）。駅間が短いときは「次は○○停車」から8秒あける
  if(!a.brake&&v>10/3.6&&d<=Math.max(plat+380,v*v/(2*0.9)+250)&&(d<=plat+180||nowMs()-(G.depAnnAt||0)>=8000)){a.brake=1; speak("次は、停車。　次は、停車。","f");}
  // 「○両、停車」はホームの少し手前（列車長＋160m）で。そのあと 喋り終わり＋3秒 → スキット注意（雨）→ 3秒 → 停止位置 ○
  if(!a.cars&&d<=plat+130){a.cars=1; a.brake=1; a.step=cfg.weather==="rain"?"skid":"pos"; a.readyAt=0; speak(`${cfg.cars}両、停車。`,"f");}
  if(!a.cars) return;
  if(!a.readyAt){ if(speechIdle()||cfg.voice!=="on") a.readyAt=nowR+ANN_GAP/Math.max(1,mult); return; }
  if(nowR<a.readyAt) return;
  if(a.step==="skid"){ a.skid=1; a.step="pos"; a.readyAt=0; skidUntil=nowR+2600/Math.max(1,mult); speak("スキット注意。","f"); return; }
  if(speechIdle()) stopPosLoop(key,v);
}
const ANN_GAP=3000; // 読み上げの間の空白(ms)

// ---- 遅延 ----
function rawDelay(x,now){
  const ev=plan.ev;
  if(G.mode==="dwell"||G.mode==="end"){
    const p=ev[G.last]||{}, e=G.events[G.last]||{};
    let d=(e.arr!=null&&p.arr!=null)?(e.arr-pt(p.arr))/1000:0;
    if(G.mode==="dwell"&&p.dep!=null) d=Math.max(d,(now-pt(p.dep))/1000);
    return d;
  }
  return (now-pt(planTimeAt(x)))/1000;
}

// ---- 画面 ----
function gpsBadge(now){
  const el=$("gps"), tx=$("gpsTxt");
  let cls="", t;
  const age=G.lastSeen==null?Infinity:now-G.lastSeen;
  const still=!G.started||G.mode!=="run"||G.v<STILL_V;
  if(G.lastSeen==null){ cls=" bad lost"; t=G.geoErr||"GPS 受信待ち"; }
  else if(age>60000){ cls=" bad lost"; t="GPS 受信なし（推定中）"; }
  else if(G.offRoute){ cls=" warn"; t=`線路外 ${Math.round(G.off)}m`; }
  else if(age>STALE_MS&&!still){ cls=" warn lost"; t="GPS 推定中"; }
  else if(G.acc>50){ cls=" warn"; t=`GPS 精度低 ±${Math.round(G.acc)}m`; }
  else t=`GPS 良好 ±${Math.max(1,Math.round(G.acc))}m`;
  el.className="gps num"+cls; tx.textContent=t;
}
// 長い駅名（羽田空港第1・第2ターミナルなど）は欄の幅に収まるよう文字を縮める
function fitText(el,len){ const base=parseFloat(getComputedStyle(el).fontSize), fit=Math.floor(el.clientWidth*0.92/len); if(fit<base) el.style.setProperty("font-size",fit+"px","important"); }
function draw(e,now,dt){
  $("dclock").textContent=fmt(now);
  drawClock(new Date(now));
  const running=G.mode==="run";
  $("spd").firstChild.textContent=running?Math.round(e.v*3.6):0;
  const tg=G.target>=0?route[G.target]:null;
  $("rem").firstChild.textContent=tg? Math.max(0,Math.round(tg.x-(running||G.mode==="halt"?e.x:route[G.last].x))) : 0;
  // ヘッダー表示：次駅 → 停車 → ○両 → 到着で空欄
  const nowR=performance.now(), nl=$("nextLbl"), skid=nowR<skidUntil;
  $("hCars").textContent=cfg.cars+"両";
  const ann=(tg&&G.announced[G.target])||{}, blink=Math.floor(nowR/500)%2===1;
  $("hCars").hidden=!(running&&ann.cars&&!skid&&e.v>20/3.6);
  $("hStop").hidden=!(running&&ann.brake&&!ann.cars);
  $("hStop").classList.toggle("blink",blink);
  const pdep=(plan.ev[G.last]||{}).dep, toDep=pdep!=null?Math.ceil((pt(pdep)-now)/1000):null;
  nl.style.removeProperty("font-size");
  if(G.mode==="halt"){nl.className="next sec"+(blink?" blink":"");nl.textContent="セクション注意";}
  else if(upd&&upd.showing){nl.className="next msg updmsg";nl.textContent=`新バージョン v${upd.version}`;}
  else if(skid){nl.className="next skid"+(blink?" blink":"");nl.textContent="！スキット注意！";}
  else if(G.mode==="dwell"&&G.taihiAt===G.last){nl.className="next taihi";nl.textContent=`待避　発車まで ${Math.max(0,toDep??0)}秒`;}
  else if(nowR<msgUntil&&running){nl.className="next msg"+(blink?" blink":"");nl.textContent=msgText;}
  else if(running&&tg||(G.mode==="dwell"&&G.last===0&&tg)){nl.className="next";nl.textContent=tg.name; fitText(nl,tg.name.length);}
  else {nl.className="next blank";nl.textContent="　";}
  let ph;
  if(!G.started) ph=testMode?"テスト走行 準備中":(G.offRoute?"線路から離れている":"GPS 受信待ち");
  else if(G.mode==="halt") ph=`駅間停車 ・ ${Math.max(0,Math.floor((now-G.haltStart)/1000))}秒`;
  else if(G.mode==="end") ph="乗務終了";
  else if(G.mode==="dwell"&&G.last===0&&!schedFixed) ph="発車待ち";
  else if(G.mode==="dwell") ph=toDep==null?"停車中":toDep>=0?`停車中 ・ 発車まで ${toDep}秒`:`停車中 ・ 発車時刻を ${-toDep}秒 過ぎた`;
  else ph=(tg&&e.v>0&&(tg.x-e.x)<=e.v*e.v/(2*0.9)+60)?"減速中":"走行中";
  $("phase").textContent=ph;
  gpsBadge(now);
  // 遅延：走行中はGPSのぶれでちらつくのでなだらかに、停車中は駅の時刻でそのまま
  const raw=G.started?rawDelay(e.x,now):0;
  G.delay=running?G.delay+(raw-G.delay)*Math.min(1,dt/2):raw;
  const d=G.delay+offset, ad=Math.abs(Math.round(d));
  const hms=[Math.floor(ad/3600),Math.floor(ad/60)%60,ad%60].map(n=>String(n).padStart(2,"0")).join(":");
  const de=$("delay"); de.textContent="遅延 "+(d<-0.5?"−":"")+hms;
  de.className="delay num"+(d>60?" bad":d>=15?" warn":"");
  route.forEach((r,i)=>{
    const row=$("r"+i); if(!row) return;
    const passed=running? r.x<e.x : i<G.last;
    row.classList.toggle("passed",G.started&&passed&&i!==G.last);
    // ▶：停車中は今いる駅、発車したら次の停車駅
    row.classList.toggle("target",i===((G.mode==="dwell"||G.mode==="end")?G.last:G.target));
    const dp=row.querySelector(".dep"); if(dp) dp.classList.toggle("red",G.mode==="dwell"&&i===G.last&&blink);
  });
  if(showDbg){
    const age=G.lastSeen==null?"-":((now-G.lastSeen)/1000).toFixed(1);
    $("dbg").textContent=G.lastSeen==null?"測位なし":
      `${route[0].name}から ${(e.x/1000).toFixed(3)}km ・ 横ずれ ${Math.round(G.off)}m ・ 精度 ±${Math.round(G.acc)}m ・ ${age}秒前 ・ ${e.src==="dr"?"推定":"GPS"} ・ 測位 ${fixRate()}回/秒 ・ 状態 ${G.mode}`;
  }
}

function drawClock(d){
  const c=$("clock"),g=c.getContext("2d"),R=120;
  g.clearRect(0,0,240,240);
  g.fillStyle="#f3f3ee";g.beginPath();g.arc(R,R,114,0,Math.PI*2);g.fill();
  g.fillStyle="#111";g.font="bold 22px sans-serif";g.textAlign="center";g.textBaseline="middle";
  for(let n=1;n<=12;n++){const a=n*Math.PI/6;g.fillText(n,R+86*Math.sin(a),R-86*Math.cos(a));}
  const hand=(ang,len,w,col)=>{g.strokeStyle=col;g.lineWidth=w;g.lineCap="round";g.beginPath();g.moveTo(R,R);g.lineTo(R+len*Math.sin(ang),R-len*Math.cos(ang));g.stroke();};
  const s=d.getSeconds(),m=d.getMinutes()+s/60,h=(d.getHours()%12)+m/60;
  hand(h*Math.PI/6,52,7,"#111");hand(m*Math.PI/30,78,5,"#111");hand(s*Math.PI/30,88,2,"#c8302f");
  g.fillStyle="#111";g.beginPath();g.arc(R,R,6,0,Math.PI*2);g.fill();
}

// ---- 在線図（横向きで幅があるとき）：区間の駅を行に折り返して並べ、駅ごとの配線と自列車を描く ----
// 上の線が上り、下の線が下り。左から右へ進行方向に並べる
let Z=null;
const zVisible=()=>getComputedStyle($("zaisen")).display!=="none";
function buildZaisen(){
  Z=null; const svg=$("zsvg"); if(!route||!zVisible()) { svg.innerHTML=""; return; }
  const W=$("zbody").clientWidth||600, padL=84, padR=56, per=Math.max(2,Math.floor((W-padL-padR)/135)), step=(W-padL-padR)/per, GAP=13;
  const n=route.length, rows=Math.max(1,Math.ceil((n-1)/per));
  // 上り本線より上・本線の間・下り本線より下に並ぶ線とホームの数（区間でいちばん多い駅に合わせる）
  let above=1,between=1,below=1;
  route.forEach(r=>{ const iu=r.lay.findIndex(x=>x.t==="U"), id=r.lay.findIndex(x=>x.t==="D");
    above=Math.max(above,iu<0?0:iu); between=Math.max(between,(id<0?r.lay.length:id)-(iu<0?-1:iu)-1); below=Math.max(below,id<0?0:r.lay.length-1-id); });
  const UY0=28+above*GAP+4, DY0=UY0+Math.max(2,between+1)*GAP, rowH=DY0+below*GAP+46;
  const w=Math.min(step*0.46,78);
  const pos=i=>{ const r=Math.min(rows-1,Math.floor(i/per)); return {row:r,X:padL+(i-r*per)*step}; };
  // 駅の中の線・ホームの高さ
  const ys=(r,top)=>{ const L=r.lay, iu=L.findIndex(x=>x.t==="U"), id=L.findIndex(x=>x.t==="D"), UY=top+UY0, DY=top+DY0;
    return L.map((x,j)=>{ if(iu>=0&&j<=iu) return UY-(iu-j)*GAP; if(id>=0&&j>=id) return DY+(j-id)*GAP;
      const a=iu<0?-1:iu, b=id<0?L.length:id; return UY+(j-a)*(DY-UY)/(b-a); }); };
  let o="";
  for(let row=0;row<rows;row++){
    const top=row*rowH, UY=top+UY0, DY=top+DY0, i0=row*per, i1=Math.min(n-1,i0+per);
    // 本線：行の左端の駅の手前から右端の駅の先まで通す（終点・始発の駅と、上り線のない駅では止める）
    const hasU=r=>r.lay.some(x=>x.t==="U"), Xa=padL, Xb=padL+(i1-i0)*step, endL=i0===0&&TERMINAL.has(route[0].name), endR=i1===n-1&&TERMINAL.has(route[n-1].name);
    const dl=endL?Xa-w/2-4:Xa-w/2-22, dr=endR?Xb+w/2+4:Xb+w/2+30;
    const ul=hasU(route[i0])?dl:Xa+w/2+10, ur=hasU(route[i1])?dr:Xb-w/2-10;
    o+=`<line x1="${ul}" y1="${UY}" x2="${ur}" y2="${UY}" stroke="#3a4352" stroke-width="5"/><line x1="${dl}" y1="${DY}" x2="${dr}" y2="${DY}" stroke="#3a4352" stroke-width="5"/>`;
    // 走る道すじ（青）：駅と駅の間は、出発する駅の進行方向の本線
    const seg=(xa,xb,down)=>{ const y=down?DY:UY; o+=`<line x1="${xa}" y1="${y}" x2="${xb}" y2="${y}" stroke="#4b86d6" stroke-width="5"/>`; };
    if(i0>0||!endL) seg(dl,Xa,route[i0].down);
    for(let i=i0;i<i1;i++) seg(Xa+(i-i0)*step,Xa+(i-i0+1)*step,route[i].down);
    if(i1<n-1||!endR) seg(Xb,dr,route[Math.max(0,i1-1)].down);
    o+=`<text x="2" y="${UY+4}" font-size="11" fill="#8b97a8">上り</text><text x="2" y="${DY+4}" font-size="11" fill="#8b97a8">下り</text>`;
    // 駅
    for(let i=i0;i<=i1;i++){ const r=route[i], X=padL+(i-i0)*step, Y=ys(r,top), x1=X-w/2, x2=X+w/2;
      r.lay.forEach((t,j)=>{ const y=Y[j];
        if(t.t==="="){ o+=`<rect x="${x1}" y="${y-4}" width="${w}" height="8" rx="2" fill="${r.stop?"#d9dde4":"#4a5260"}"/>`; return; }
        if(t.t==="U"||t.t==="D"){ if(t.n) o+=`<text class="ztk" x="${x2+5}" y="${y+4}">${t.n}</text>`; return; }
        // 本線から分かれる線（待避線・空港線・中線）。他社の線はつながない
        const toU=t.t==="u"||(t.t==="a"&&+t.n>=4)||t.t==="c", my=toU?Y[r.lay.findIndex(x=>x.t==="U")]:Y[r.lay.findIndex(x=>x.t==="D")];
        const onPath=t.n&&t.n===r.side&&taihiHere(i)&&(t.t==="u"||t.t==="d");
        if(onPath){ const mainY=my; o+=`<line x1="${x1-18}" y1="${mainY}" x2="${x2+18}" y2="${mainY}" stroke="#3a4352" stroke-width="5"/>`; }
        const col=t.t==="o"?"#2c3646":onPath?"#4b86d6":"#3a4352";
        if(t.t==="o"||my==null) o+=`<line x1="${x1-6}" y1="${y}" x2="${x2+6}" y2="${y}" stroke="${col}" stroke-width="4"/>`;
        else if(t.endQ||t.endD){ // 行き止まり：上り方（<）なら下りの区間で左、下り方（>）なら下りの区間で右
          o+=(t.endQ?r.down:!r.down)?`<path d="M${x1} ${y} L${x2} ${y} L${x2+18} ${my}" fill="none" stroke="${col}" stroke-width="4"/><line x1="${x1}" y1="${y-6}" x2="${x1}" y2="${y+6}" stroke="${col}" stroke-width="3"/>`
                   :`<path d="M${x1-18} ${my} L${x1} ${y} L${x2} ${y}" fill="none" stroke="${col}" stroke-width="4"/><line x1="${x2}" y1="${y-6}" x2="${x2}" y2="${y+6}" stroke="${col}" stroke-width="3"/>`; }
        else o+=`<path d="M${x1-18} ${my} L${x1} ${y} L${x2} ${y} L${x2+18} ${my}" fill="none" stroke="${col}" stroke-width="4"/>`;
        o+=`<text class="ztk" x="${x2+5}" y="${y+4}">${t.t==="c"&&t.n==="3"?"2・3":t.n}</text>`; });
      // 長い駅名が枠からはみ出さないよう、端では内側に寄せる
      const tw=(r.name.length+2)*14, anc=X+tw/2>W-4?"end":X-tw/2<4?"start":"middle", tx=anc==="end"?W-4:anc==="start"?4:X;
      o+=`<text class="zn${r.stop?"":" zpass"}" id="zn${i}" x="${tx}" y="${top+18}" text-anchor="${anc}">${r.name}</text>`; }
  }
  // 自列車（白い車体と黄色い先頭）と札
  o+=`<g id="ztr"><rect x="-34" y="-8" width="56" height="16" rx="3" fill="#f2f2ee" stroke="#111" stroke-width="2"/><polygon points="22,-8 34,0 22,8" fill="#ffe23a"/>`+
     `<g id="ztlg"><rect x="-50" y="14" width="100" height="22" rx="4" fill="#1c2431" stroke="#ffe23a"/><text id="ztl" x="0" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#ffe23a"></text></g></g>`;
  svg.setAttribute("viewBox",`0 0 ${W} ${rows*rowH}`); svg.setAttribute("height",rows*rowH); svg.innerHTML=o;
  Z={per,step,padL,rowH,rows,ys,pos,W,lastRow:-1};
  $("zh").textContent=`在線　${route[0].name} → ${route[route.length-1].name}`;
}
function updateZaisen(e){
  if(!Z){ if(route&&zVisible()) buildZaisen(); if(!Z) return; }
  const n=route.length, x=G.started?e.x:route[0].x;
  let k=0; while(k<n-1&&route[k+1].cx<=x) k++;
  const a=route[k], b=route[Math.min(n-1,k+1)], f=b.cx>a.cx?Math.max(0,Math.min(1,(x-a.cx)/(b.cx-a.cx))):0;
  // 行の右端の駅を過ぎたら次の行
  let row=Math.min(Z.rows-1,Math.floor(k/Z.per)); const X=Z.padL+((k-row*Z.per)+f)*Z.step, top=row*Z.rowH;
  // 走る線：基本は本線。待避する駅（待避を押した駅・待避中の駅）だけ待避線
  const near=Math.abs(x-a.cx)<=a.plen/2+40?k:(Math.abs(x-b.cx)<=b.plen/2+40?k+1:-1), st=near>=0?route[near]:null;
  const r=st||a, Y=Z.ys(r,top);
  let no=null; if(st&&st.side&&taihiHere(near)&&(G.mode!=="run"||Math.abs(x-st.x)<st.plen)) no=st.side;
  let j=no!=null?r.lay.findIndex(t=>t.n===no||(t.t==="c"&&(no==="2"||no==="3"))):-1;
  if(j<0) j=r.lay.findIndex(t=>t.t===(r.down?"D":"U"));
  const y=j>=0?Y[j]:top+(r.down?Z.ys(r,0)[0]:0);
  $("ztr").setAttribute("transform",`translate(${X},${y})`);
  // 札は枠からはみ出さないように左右へずらす
  $("ztlg").setAttribute("transform",`translate(${Math.min(Z.W-54-X,Math.max(54-X,0))},0)`);
  $("ztl").textContent=`${K.label} `+(G.mode==="dwell"&&G.taihiAt===G.last?"待避中":G.mode==="dwell"?"停車中":G.mode==="halt"?"駅間停車":Math.round(e.v*3.6)+"km/h");
  route.forEach((s,i)=>{ const t=$("zn"+i); if(!t) return; const tg=(G.mode==="run"||G.mode==="halt")?i===G.target:i===G.last;
    t.classList.toggle("tgt",tg); t.classList.toggle("past",!tg&&i<(G.mode==="run"?k+1:G.last)); t.textContent=(tg?"▶ ":"")+s.name; });
  if(row!==Z.lastRow){ Z.lastRow=row; const b2=$("zbody"); b2.scrollTop=Math.max(0,top-4); }
}
window.addEventListener("resize",()=>{ if(route&&!$("runv").hidden) buildZaisen(); });

// ---- テスト走行：模擬列車を走らせ、1秒ごとにGPSの測位（数mのぶれつき）を流す ----
const simDecel=()=>cfg.weather==="rain"?0.8:DECEL;
function onSimEvent(type,i){
  if(type==="dep"){
    const a0=route[i].x, L=route[SIM.target].x-a0;
    if(cfg.disorder==="on"&&L>700&&Math.random()<0.55) SIM.halt={x:a0+L*(0.3+0.4*Math.random()),sec:25+Math.random()*90,done:false};
    // ときどきトンネルでGPSが切れる
    if(L>1500&&Math.random()<0.3) SIM.gap={from:SIM.t+20+Math.random()*60,len:30+Math.random()*60};
  }
  if(type==="arr"){
    SIM.dwellStart=SIM.t;
    // 普通・急行はときどき待避で長く止まる（2分以上で自動判定されるかの確認）
    if(K.taihi&&route[i].taihiOK&&i<route.length-1&&Math.random()<0.3) SIM.remain=Math.max(SIM.remain,125+Math.random()*20);
  }
}
let nextFixT=0;
function emitFakeFix(){
  if(SIM.gap&&SIM.t>=SIM.gap.from&&SIM.t<SIM.gap.from+SIM.gap.len) return;
  const [lat,lon]=route.latLonAt(SIM.x), n=()=>(Math.random()+Math.random()+Math.random()-1.5)*4;
  onFix({lat:lat+n()/KY,lon:lon+n()/KX,acc:4+Math.random()*6,speed:Math.max(0,SIM.v+(Math.random()-0.5)*0.6),t:nowMs()});
}

function loop(ts){
  if(lastReal==null) lastReal=ts;
  const dtReal=Math.min(60,(ts-lastReal)/1000); lastReal=ts;
  if(testMode&&!paused){
    acc+=dtReal*mult; let n=Math.floor(acc/DT); acc-=n*DT;
    const rand=cfg.disorder==="on"? (()=>Math.random()<0.7?15+Math.random()*75:0) : (()=>Math.random()<0.35?5+Math.random()*25:0);
    // 終点に着いたあとも時計と測位は進める（実際のGPSは止まらない）
    while(n-->0){ if(SIM.mode==="end") SIM.t+=DT; else step(SIM,route,K,simDecel(),rand,onSimEvent); if(SIM.t>=nextFixT){ nextFixT+=cfg.rate==="hi"?0.25:1; emitFakeFix(); } }
  }
  const now=nowMs(), dt=Math.max(0,(now-lastNow)/1000); lastNow=now;
  if(G.mode==="dwell"&&G.last===0&&!schedFixed){
    // 定刻がなければ、始発駅では「今発車したら」の時刻で並べる
    const e0=Math.round((now-plan.ev[0].dep*1000)/1000)*1000; if(e0!==planEpoch){ planEpoch=e0; renderList(); }
  }
  const e=estimate(now,dt); lastEst=e;
  track(e,now); checkApproach(e);
  if(G.mode==="dwell"&&K.taihi&&route[G.last].taihiOK&&G.last>0&&now-G.dwellStart>=TAIHI_SEC*1000&&G.taihiAt!==G.last) applyTaihi(G.last);
  announceUpdate();
  draw(e,now,dt);
  updateZaisen(e);
  // 駅一覧は、いま止まっている駅か最後に通過した駅をいちばん上に出す
  let cur=G.last; if(G.started&&(G.mode==="run"||G.mode==="halt")) for(let i=G.last+1;i<route.length&&route[i].cx<=e.x;i++) cur=i;
  const row=$("r"+cur);
  if(row&&row!==loop.lastRow){loop.lastRow=row;const L=$("list"); L.scrollTop=row.offsetTop-L.offsetTop;}
  raf=requestAnimationFrame(loop);
}

function keepAwake(){ try{ navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>{wakeLock=w;}).catch(()=>{}); }catch(_){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&!$("runv").hidden) keepAwake(); });
function startGeo(){
  if(!("geolocation" in navigator)||!window.isSecureContext){ G.geoErr="位置情報が使えない（HTTPSで開く）"; return; }
  watchId=navigator.geolocation.watchPosition(
    onGeo,
    e=>{ if(G) G.geoErr=geoErrText(e); },
    {enableHighAccuracy:true,maximumAge:0,timeout:20000});
  // 高頻度：watchPosition とは別に最新の位置を取りに行く（同じ測位が返ってきたら onFix で捨てる）
  if(cfg.rate==="hi") pollId=setInterval(()=>{ if(pollBusy) return; pollBusy=true;
    navigator.geolocation.getCurrentPosition(p=>{ pollBusy=false; onGeo(p); },()=>{ pollBusy=false; },{enableHighAccuracy:true,maximumAge:0,timeout:2000}); },250);
}
let pollId=null,pollBusy=false;
function onGeo(p){ onFix({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,speed:p.coords.speed,t:Math.min(Date.now(),p.timestamp||Date.now())}); }
function fixRate(){ const l=G.fixLog||[]; if(l.length<2) return "-"; return ((l.length-1)/((l[l.length-1]-l[0])/1000)).toFixed(1); }
function stopGeo(){ if(watchId!=null){ try{navigator.geolocation.clearWatch(watchId);}catch(_){} watchId=null; } clearInterval(pollId); pollId=null; pollBusy=false; }
function parseSched(){
  const v=$("sched").value; if(!v) return null;
  const [h,m,s]=v.split(":").map(Number), d=new Date(); d.setHours(h,m,s||0,0);
  if(d.getTime()<Date.now()-6*3600e3) d.setDate(d.getDate()+1);
  return d.getTime();
}

// 種別に合わせてヘッダーの色・文字と待避ボタンを変える
function kindLook(){
  const hd=document.querySelector(".head"); hd.style.setProperty("--ks",K.sub); hd.style.setProperty("--ksf",K.subFg||"#fff");
  $("taihiBtn").hidden=!K.taihi; $("taihiBtn").setAttribute("aria-pressed","false");
  const kl=$("kindLbl"); kl.textContent=K.label; kl.style.background=K.color; kl.style.color=K.fg||"#fff";
  // 長い種別（各駅停車など）は帯の幅に収まるよう字間と大きさを詰める
  kl.style.removeProperty("font-size"); kl.style.letterSpacing=K.label.length>2?".05em":""; kl.style.paddingLeft=K.label.length>2?"0":"";
  requestAnimationFrame(()=>fitText(kl,K.label.length*(K.label.length>2?1.08:1.45)));
}
// 乗務中に種別を変える：今の位置と遅延はそのまま、止まる駅・予定・次の停車駅を作り直す
function changeKind(){
  const now=nowMs(), x=lastEst.x, delay=G.delay;
  route=buildRoute(); K=KINDS[cfg.kind]; plan=planTimes(route,K);
  const ahead=(from,px)=>{ for(let j=from+1;j<route.length;j++) if(route[j].stop&&route[j].x>px+5) return j; return -1; };
  if(G.mode==="run"||G.mode==="halt"){ G.target=ahead(G.last,x); if(G.target>=0) G.announced[G.target]={}; }
  else if(G.mode==="dwell") G.target=nextStop(route,G.last);
  G.taihiPending=false; if(!K.taihi) G.taihiAt=-1;
  // 遅延が変わらないよう、予定の基準時刻を合わせ直す
  const pt0=(G.mode==="dwell"||G.mode==="end")?(plan.ev[G.last]||{}).arr??planTimeAt(x):planTimeAt(x);
  if(G.started){ planEpoch=now-delay*1000-pt0*1000; schedFixed=true; }
  if(SIM){ SIM.target=ahead(SIM.last,SIM.x); if(SIM.mode==="run"&&SIM.target>=0) SIM.env=makeEnv(route,K,SIM.x,route[SIM.target].x,simDecel()); }
  kindLook(); renderList(); loop.lastRow=null;
  speak(`種別変更、${K.label}、${route[route.length-1].name}行き`,"m");
}
$("start").addEventListener("click",()=>{
  unlockAudio();
  testMode=cfg.src==="test";
  route=buildRoute(); K=KINDS[cfg.kind]; plan=planTimes(route,K);
  mult=testMode?+cfg.speed:1; paused=false; $("pause").setAttribute("aria-pressed","false"); $("pause").textContent="一時停止";
  document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.m===String(mult)));
  document.querySelector(".testctl").hidden=!testMode;
  simEpoch=Date.now(); SIM=testMode?newState(route):null; if(SIM){ SIM.dwellStart=0; SIM.gap=null; } nextFixT=0; DR=null;
  G=newG(); offset=0; lastReal=null; lastNow=nowMs(); acc=0; loop.lastRow=null;
  const sched=parseSched(); schedFixed=sched!=null; planEpoch=schedFixed?sched-plan.ev[0].dep*1000:nowMs()-plan.ev[0].dep*1000;
  kindLook();
  $("carsLbl").textContent=cfg.cars; $("crewLbl").textContent=cfg.crew==="one"?"ワンマン":"ツーマン";
  $("mset").innerHTML="☰ 放送："+(cfg.voice==="on"?"自動":"切")+"<br>音量：11"; msgUntil=0; skidUntil=0;
  $("rangeLbl").textContent=`${route[0].name} - ${route[route.length-1].name} 駅一覧`;
  renderList(); Z=null;
  $("dbadge").hidden=cfg.disorder!=="on";
  $("setup").hidden=true; $("runv").hidden=false; $("note").hidden=true;
  try{ window.scrollTo(0,0); document.querySelector(".screen").scrollTop=0; }catch(_){}
  keepAwake();
  if(!testMode) startGeo();
  speak(`${K.label}、${route[route.length-1].name}行き、${cfg.cars}両、乗務開始`,"m");
  cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
});
$("pause").addEventListener("click",e=>{paused=!paused;e.target.setAttribute("aria-pressed",paused);e.target.textContent=paused?"再開":"一時停止";});
document.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>{
  mult=+b.dataset.m; document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",x===b));
}));
// 手動の補正：GPSの判定がずれたとき用。テスト走行では模擬列車を発車させる
$("depNow").addEventListener("click",()=>{
  unlockAudio(); if(!G) return;
  if(testMode){ if(SIM.mode==="dwell"||SIM.mode==="halt") SIM.remain=0; return; }
  if(G.mode==="dwell"||G.mode==="halt"){ G.started=true; depart(nowMs()); }
});
$("arrNow").addEventListener("click",()=>{
  if(!G||(G.mode!=="run"&&G.mode!=="halt")||G.target<0) return;
  arrive(G.target,nowMs(),lastEst.x);
});
$("taihiBtn").addEventListener("click",()=>{
  if(!G||!K.taihi) return;
  if(G.mode==="dwell"&&G.last>0&&route[G.last].taihiOK&&G.taihiAt!==G.last){ applyTaihi(G.last); return; }
  G.taihiPending=!G.taihiPending; $("taihiBtn").setAttribute("aria-pressed",G.taihiPending); renderList();
});
$("haltBtn").addEventListener("click",()=>{ if(testMode) insertHalt(SIM,route,K,simDecel(),40+Math.random()*50); });
$("gapBtn").addEventListener("click",()=>{ if(testMode) SIM.gap={from:SIM.t,len:60}; });
$("mset").addEventListener("click",()=>{ segSync(); $("menu").hidden=false; });
$("menuClose").addEventListener("click",()=>{ $("menu").hidden=true; });
$("menu").addEventListener("click",e=>{ if(e.target.id==="menu") $("menu").hidden=true; });
$("minus").addEventListener("click",()=>{offset-=10;});
$("plus").addEventListener("click",()=>{offset+=10;});
$("dbgBtn").addEventListener("click",e=>{showDbg=!showDbg; e.target.setAttribute("aria-pressed",showDbg); $("dbg").hidden=!showDbg;});
$("vtest").addEventListener("click",()=>{ unlockAudio(); speak("音声テスト、停車","f"); setTimeout(()=>{ const ok=("speechSynthesis" in window); $("vstat").textContent= ok? `読み上げ機能あり・日本語の声 ${jaVoices.length}種類。聞こえなければマナーモードと音量を確認` : "この画面では読み上げが使えない。Safariで開くと声が出るかも"; },400); });
document.querySelectorAll(".updGo").forEach(b=>b.addEventListener("click",reloadToUpdate));
// あとで：バーを閉じる（下の「更新」ボタンは残す）。乗務終了のときにもう一度出す
$("updLater").addEventListener("click",()=>{ hideUpdBar(); if(upd) upd.later=true; });
$("appVer").textContent="v"+APP_VERSION;
$("back").addEventListener("click",()=>{ $("menu").hidden=true;
  cancelAnimationFrame(raf); stopGeo(); try{speechSynthesis.cancel()}catch(_){}
  try{ wakeLock&&wakeLock.release(); }catch(_){} wakeLock=null;
  $("runv").hidden=true; $("setup").hidden=false; $("note").hidden=false;
});
</script>
